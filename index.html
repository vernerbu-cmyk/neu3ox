<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>NeuroX</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito+Sans:wght@400;600;700;800&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="shared/styles.css" />
</head>

<body>
  <!-- SPLASH -->
  <div class="splash" id="splash">
    <div class="splash__inner">
      <div class="splash__brain">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M15.5 13a3.5 3.5 0 0 0 -3.5 3.5v1a3.5 3.5 0 0 0 7 0v-1.8"/>
          <path d="M8.5 13a3.5 3.5 0 0 1 3.5 3.5v1a3.5 3.5 0 0 1 -7 0v-1.8"/>
          <path d="M17.5 16a3.5 3.5 0 0 0 0 -7h-.5"/>
          <path d="M19 9.3v-2.8a3.5 3.5 0 0 0 -7 0"/>
          <path d="M6.5 16a3.5 3.5 0 0 1 0 -7h.5"/>
          <path d="M5 9.3v-2.8a3.5 3.5 0 0 1 7 0v10"/>
        </svg>
      </div>
      <div class="splash__title">NeuroX</div>
      <div class="splash__subtitle">тренажёры для ума</div>
      <div class="splash__loader"><div class="splash__loader-fill"></div></div>
    </div>
  </div>

  <div class="container">
    <div class="cards">

      <div class="card" data-category="preschool">
        <div class="left">
          <div class="icon-wrap">
            <svg viewBox="0 0 48 48" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round">
              <g class="float-cube float-1">
                <rect x="5" y="24" width="18" height="18" rx="4" fill="none"/>
                <text x="14" y="37" font-family="Fredoka, sans-serif" font-size="12" font-weight="700" fill="currentColor" stroke="none" text-anchor="middle">А</text>
              </g>
              <g class="float-cube float-2">
                <rect x="25" y="24" width="18" height="18" rx="4" fill="#FF6A00" stroke="#FF6A00"/>
                <text x="34" y="37" font-family="Fredoka, sans-serif" font-size="12" font-weight="700" fill="white" stroke="none" text-anchor="middle">Б</text>
              </g>
              <g class="float-cube float-3">
                <rect x="15" y="5" width="18" height="18" rx="4" fill="none"/>
                <text x="24" y="18" font-family="Fredoka, sans-serif" font-size="12" font-weight="700" fill="currentColor" stroke="none" text-anchor="middle">В</text>
              </g>
            </svg>
          </div>
          <div class="card-text"><div class="title">Дошколятам</div></div>
        </div>
        <div class="arrow">›</div>
      </div>

      <div class="card" data-category="reading">
        <div class="left">
          <div class="icon-wrap">
            <svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round">
              <path d="M6 12 Q14 8 24 12 L24 38 Q14 34 6 38 Z"/>
              <path d="M42 12 Q34 8 24 12 L24 38 Q34 34 42 38 Z"/>
              <path d="M11 18 L19 20"/>
              <path d="M11 24 L19 26"/>
              <path d="M11 30 L19 32"/>
              <path class="book-line-1" d="M29 20 L37 18" stroke="#FF6A00"/>
              <path class="book-line-2" d="M29 26 L37 24" stroke="#FF6A00"/>
              <path class="book-line-3" d="M29 32 L37 30" stroke="#FF6A00"/>
            </svg>
          </div>
          <div class="card-text"><div class="title">Скорочтение</div></div>
        </div>
        <div class="arrow">›</div>
      </div>

      <div class="card" data-category="math">
        <div class="left">
          <div class="icon-wrap">
            <svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round">
              <path d="M10 8 L10 40"/><path d="M20 8 L20 40"/><path d="M30 8 L30 40"/><path d="M40 8 L40 40"/>
              <circle class="bead bead-1" cx="10" cy="16" r="3.5" fill="#FF6A00" stroke="#FF6A00"/>
              <circle class="bead bead-2" cx="10" cy="30" r="3.5" fill="#FF6A00" stroke="#FF6A00"/>
              <circle class="bead bead-3" cx="20" cy="14" r="3.5"/>
              <circle class="bead bead-4" cx="20" cy="26" r="3.5"/>
              <circle class="bead bead-5" cx="30" cy="20" r="3.5"/>
              <circle class="bead bead-6" cx="40" cy="16" r="3.5" fill="#FF6A00" stroke="#FF6A00"/>
              <circle class="bead bead-7" cx="40" cy="34" r="3.5"/>
            </svg>
          </div>
          <div class="card-text"><div class="title">Скоросчёт</div></div>
        </div>
        <div class="arrow">›</div>
      </div>

      <div class="card" data-category="other">
        <div class="left">
          <div class="icon-wrap">
            <svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round">
              <rect x="8" y="8" width="32" height="32" rx="8"/>
              <circle class="dot dot-1" cx="17" cy="17" r="2.2" fill="#FF6A00" stroke="none"/>
              <circle class="dot dot-2" cx="31" cy="17" r="2.2" fill="currentColor" stroke="none"/>
              <circle class="dot dot-3" cx="17" cy="31" r="2.2" fill="currentColor" stroke="none"/>
              <circle class="dot dot-4" cx="31" cy="31" r="2.2" fill="#FF6A00" stroke="none"/>
              <circle class="dot dot-5" cx="24" cy="24" r="2.2" fill="currentColor" stroke="none"/>
            </svg>
          </div>
          <div class="card-text"><div class="title">Другое</div></div>
        </div>
        <div class="arrow">›</div>
      </div>

      <div class="card" data-category="memory">
        <div class="left">
          <div class="icon-wrap">
            <svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round">
              <path d="M8 8 L34 8 L40 14 L40 40 L8 40 Z"/>
              <rect class="disk-shutter" x="16" y="8" width="16" height="12" fill="#FF6A00" stroke="#FF6A00"/>
              <rect x="22" y="10" width="4" height="8" fill="white" stroke="none"/>
              <rect x="14" y="26" width="20" height="14"/>
            </svg>
          </div>
          <div class="card-text"><div class="title">Память<span class="badge">в разработке</span></div></div>
        </div>
        <div class="arrow">›</div>
      </div>

      <div class="card" data-category="generators">
        <div class="left">
          <div class="icon-wrap">
            <svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round">
              <defs>
                <clipPath id="printClipMain"><rect x="0" y="0" width="48" height="20"/></clipPath>
              </defs>
              <g clip-path="url(#printClipMain)">
                <g class="print-paper">
                  <rect x="15" y="3" width="18" height="15" rx="1.5"/>
                  <path d="M20 8 L28 8" stroke="#FF6A00" stroke-width="1.8"/>
                  <path d="M20 12 L26 12" stroke="#FF6A00" stroke-width="1.8"/>
                </g>
              </g>
              <rect x="6" y="20" width="36" height="20" rx="3"/>
              <circle cx="11" cy="26" r="1.5" fill="#FF6A00" stroke="none"/>
              <circle class="print-led" cx="37" cy="26" r="1.6" fill="#FF6A00" stroke="none"/>
              <path d="M14 34 L34 34" stroke-width="3.2"/>
            </svg>
          </div>
          <div class="card-text"><div class="title">Генераторы листов<span class="badge">в разработке</span></div></div>
        </div>
        <div class="arrow">›</div>
      </div>

      <div class="card" data-category="orfografos">
        <div class="left">
          <div class="icon-wrap">
            <svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round">
              <text class="letter-a" x="14" y="38" font-family="Fredoka, sans-serif" font-size="28" font-weight="700" fill="currentColor" stroke="none" text-anchor="middle">А</text>
              <text class="letter-o" x="34" y="38" font-family="Fredoka, sans-serif" font-size="28" font-weight="700" fill="#FF6A00" stroke="none" text-anchor="middle">О</text>
            </svg>
          </div>
          <div class="card-text"><div class="title">Орфография<span class="badge">в разработке</span></div></div>
        </div>
        <div class="arrow">›</div>
      </div>

    </div>
  </div>

<script src="shared/changelog.js" defer></script>
<script src="shared/layout.js" defer></script>
<script src="shared/seasons.js" defer></script>
<script src="shared/storage.js" defer></script>
<script src="shared/app.js" defer></script>

  <script>
    // Обработка клика по карточкам на главной
    document.querySelectorAll('.card[data-category]').forEach(card => {
      card.addEventListener('click', () => {
        window.openCategory(card.dataset.category);
      });
    });
  </script>
</body>
</html>
