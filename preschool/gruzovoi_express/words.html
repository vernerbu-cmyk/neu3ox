 function stop(){if(!active)return;const image=active.closest('.card').querySelector('img');image.src=image.getAttribute('src').split('#')[0].replace('&motion=1','&motion=0')+'#still';active.textContent='Оживить';active.setAttribute('aria-pressed','false');active=null}
 function render(){

   if(entry.animated){const button=document.createElement('button');button.type='button';button.className='animate-animal';button.textContent='Оживить';button.disabled=preference.matches;button.setAttribute('aria-pressed','false');button.setAttribute('aria-label','Анимация: '+entry.word.toLowerCase());button.addEventListener('click',()=>{const wasActive=active===button;stop();if(wasActive||preference.matches)return;active=button;image.src=entry.asset+'?art=lite-v3&motion=1';button.textContent='Остановить';button.setAttribute('aria-pressed','true')});article.append(button)}
