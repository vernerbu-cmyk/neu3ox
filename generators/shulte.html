<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Генератор таблиц Шульте — NeuroX</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/menu-drawer.css">

<style>
:root{
  --blue:#1E3F8A;
  --blue-soft:#3A5FA8;
  --blue-light:#2A56C6;
  --blue-pale:#E8EEF9;
  --orange:#FF6A00;
  --orange-soft:#FF8B3D;
  --orange-dark:#C85100;
  --orange-pale:#FFEADB;
  --bg:#F4F6FB;
  --text:#24324B;
  --text-dim:#6B7280;
  --border:rgba(30,63,138,.10);
  --panel:#FFFFFF;
  --red:#E63946;
  --green:#22C55E;
  --dot-color:rgba(30,63,138,.07);
  --header-shadow:rgba(30,63,138,.25);
  --overlay:rgba(30,63,138,.45);
  --input-bg:#FFFFFF;
  --input-border:#DCE4F4;
  --preview-bg:#EEF2FB;
}

[data-theme="dark"]{
  --blue:#7B9BE5;
  --blue-soft:#5F80D0;
  --blue-light:#7B9BE5;
  --blue-pale:#2A3A5C;
  --orange:#FF8B3D;
  --orange-soft:#FFA057;
  --orange-dark:#8A3F00;
  --orange-pale:#4A2E1A;
  --bg:#121721;
  --text:#E8EEF9;
  --text-dim:#8A96B0;
  --border:rgba(140,170,240,.15);
  --panel:#1C2331;
  --red:#E85A5A;
  --green:#3ED07A;
  --dot-color:rgba(140,170,240,.09);
  --header-shadow:rgba(0,0,0,.55);
  --overlay:rgba(0,0,0,.6);
  --input-bg:#232B3D;
  --input-border:#2E3A52;
  --preview-bg:#161C28;
}

*{ box-sizing:border-box; }

html, body{ transition:background-color .3s, color .3s; }

body{
  margin:0;
  font-family:"Nunito Sans",sans-serif;
  background-color:var(--bg);
  background-image:radial-gradient(circle, var(--dot-color) 1.5px, transparent 1.6px);
  background-size:26px 26px;
  color:var(--text);
  display:flex;
  flex-direction:column;
  min-height:100vh;
  transition:background-color .3s, color .3s;
}

/* ===== HEADER ===== */

header{
  position:relative;
  width:100%;
  background:linear-gradient(135deg,#152E68 0%,#1E3F8A 60%,#2A4A99 100%);
  color:#fff;
  padding:20px 24px 22px;
  box-shadow:0 6px 20px var(--header-shadow);
  transition:background .3s, box-shadow .3s;
}

[data-theme="dark"] header{
  background:linear-gradient(135deg,#12193A 0%,#1A2440 60%,#243057 100%);
}

.header-top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
}

.brand{
  display:flex;
  align-items:center;
  gap:14px;
  min-width:0;
}

.logo{
  position:relative;
  width:56px;
  height:56px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:transparent;
  border:none;
  padding:0;
  color:#FF8B3D;
  flex-shrink:0;
  cursor:pointer;
  transition:transform .2s;
}

.logo svg{ width:46px; height:46px; display:block; }

.logo::after{
  content:'←';
  position:absolute;
  top:-4px;
  left:-6px;
  width:22px;
  height:22px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#FF6A00;
  color:#fff;
  font-size:13px;
  font-weight:800;
  border-radius:50%;
  box-shadow:0 2px 6px rgba(0,0,0,.3);
  font-family:"Nunito Sans",sans-serif;
  line-height:1;
  pointer-events:none;
}

.logo:hover{ transform:scale(1.08); }
.logo:active{ transform:scale(.94); }

h1{
  margin:0;
  font-family:"Fredoka",sans-serif;
  font-size:26px;
  font-weight:700;
  letter-spacing:.4px;
  line-height:1.1;
  text-shadow:0 2px 4px rgba(0,0,0,.12);
}

.subtitle{
  margin-top:2px;
  font-size:12.5px;
  opacity:.85;
  font-weight:600;
}

.header-buttons{
  display:flex;
  gap:10px;
  flex-shrink:0;
}

.icon-btn{
  position:relative;
  width:48px;
  height:48px;
  border:none;
  border-radius:16px;
  background:rgba(255,255,255,.18);
  color:#fff;
  cursor:pointer;
  transition:.22s;
  font-family:inherit;
  line-height:1;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:0;
}

.icon-btn svg{ width:22px; height:22px; display:block; }

.icon-btn:hover{
  background:var(--orange);
  transform:translateY(-2px) rotate(6deg) scale(1.06);
}

.icon-btn:active{ transform:scale(.95); }

/* ===== LAYOUT ===== */

.container{
  flex:1;
  width:100%;
  max-width:1240px;
  margin:0 auto;
  padding:24px 20px 60px;
}

.layout{
  display:grid;
  grid-template-columns:340px 1fr;
  gap:20px;
  align-items:start;
}

@media (max-width:900px){
  .layout{ grid-template-columns:1fr; }
}

/* ===== PANEL ===== */

.panel{
  background:var(--panel);
  border:2px solid var(--border);
  border-radius:22px;
  padding:20px 18px 22px;
  box-shadow:0 6px 0 rgba(30,63,138,.08),
             0 14px 30px rgba(30,63,138,.06);
  position:sticky;
  top:20px;
  transition:background .3s, border-color .3s;
}

[data-theme="dark"] .panel{
  box-shadow:0 6px 0 rgba(0,0,0,.25), 0 14px 30px rgba(0,0,0,.3);
}

@media (max-width:900px){
  .panel{ position:static; }
}

.panel h3{
  font-family:"Fredoka",sans-serif;
  font-size:15px;
  font-weight:600;
  color:var(--blue);
  margin:0 0 12px;
  letter-spacing:.3px;
  display:flex;
  align-items:center;
  gap:8px;
}

.panel h3::after{
  content:'';
  flex:1;
  height:1px;
  background:var(--border);
  border-radius:1px;
}

.panel-section{
  margin-bottom:20px;
}

.panel-section:last-child{ margin-bottom:0; }

.field{
  display:block;
  margin-bottom:12px;
}

.field:last-child{ margin-bottom:0; }

.field > span{
  display:block;
  font-size:12px;
  font-weight:800;
  color:var(--text-dim);
  letter-spacing:.4px;
  text-transform:uppercase;
  margin-bottom:6px;
}

.field select,
.field input[type="text"],
.field input[type="number"]{
  width:100%;
  font-family:"Nunito Sans",sans-serif;
  font-size:14px;
  font-weight:700;
  color:var(--text);
  background:var(--input-bg);
  border:2px solid var(--input-border);
  border-radius:12px;
  padding:10px 12px;
  outline:none;
  transition:.18s;
}

.field select:hover,
.field select:focus,
.field input:hover,
.field input:focus{
  border-color:var(--orange);
}

.field input::placeholder{
  color:var(--text-dim);
  font-weight:600;
}

/* segmented button group */

.seg{
  display:flex;
  gap:4px;
  padding:4px;
  background:var(--input-bg);
  border:2px solid var(--input-border);
  border-radius:12px;
}

.seg button{
  flex:1;
  padding:8px 6px;
  font-size:12.5px;
  font-weight:800;
  font-family:inherit;
  color:var(--text-dim);
  background:transparent;
  border:none;
  border-radius:8px;
  cursor:pointer;
  transition:.15s;
  box-shadow:none;
  letter-spacing:.2px;
}

.seg button:hover{ color:var(--blue); background:var(--blue-pale); }
.seg button:active{ transform:none; box-shadow:none; }

.seg button.active{
  background:var(--orange);
  color:#fff;
  box-shadow:0 2px 0 var(--orange-dark);
}

.seg button.active:hover{ color:#fff; background:var(--orange-soft); }

/* toggle row */

.toggle-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  padding:10px 12px;
  background:var(--input-bg);
  border:2px solid var(--input-border);
  border-radius:12px;
  cursor:pointer;
  user-select:none;
  transition:.18s;
  margin-bottom:10px;
}

.toggle-row:hover{ border-color:var(--blue-soft); }
.toggle-row:last-child{ margin-bottom:0; }

.toggle-row__label{
  font-size:13.5px;
  font-weight:800;
  color:var(--blue);
}

.switch{
  width:40px;
  height:22px;
  border-radius:999px;
  background:#CBD3E5;
  position:relative;
  flex-shrink:0;
  transition:background .2s;
}

[data-theme="dark"] .switch{ background:#3A4560; }

.switch::after{
  content:'';
  position:absolute;
  top:3px;
  left:3px;
  width:16px;
  height:16px;
  background:#fff;
  border-radius:50%;
  box-shadow:0 2px 4px rgba(0,0,0,.18);
  transition:transform .26s cubic-bezier(.34, 1.56, .64, 1);
}

.toggle-row.on .switch{ background:var(--orange); }
.toggle-row.on .switch::after{ transform:translateX(18px); }

/* ===== PREVIEW ===== */

.preview-area{
  display:flex;
  flex-direction:column;
  gap:16px;
}

.actions-bar{
  display:flex;
  flex-wrap:wrap;
  gap:10px;
  align-items:center;
  padding:14px 16px;
  background:var(--panel);
  border:2px solid var(--border);
  border-radius:18px;
  box-shadow:0 4px 0 rgba(30,63,138,.06);
  transition:background .3s, border-color .3s;
}

[data-theme="dark"] .actions-bar{
  box-shadow:0 4px 0 rgba(0,0,0,.25);
}

.actions-bar .spacer{ flex:1; }

.btn{
  font-family:"Nunito Sans",sans-serif;
  font-size:13.5px;
  font-weight:800;
  letter-spacing:.3px;
  padding:10px 16px;
  border-radius:12px;
  border:none;
  cursor:pointer;
  transition:.15s;
  display:inline-flex;
  align-items:center;
  gap:8px;
}

.btn svg{ width:16px; height:16px; }

.btn-primary{
  background:var(--orange);
  color:#fff;
  box-shadow:0 4px 0 var(--orange-dark);
}
.btn-primary:hover{ background:var(--orange-soft); }
.btn-primary:active{ transform:translateY(3px); box-shadow:0 1px 0 var(--orange-dark); }

.btn-ghost{
  background:var(--blue-pale);
  color:var(--blue);
  box-shadow:none;
}
.btn-ghost:hover{ background:var(--blue-soft); color:#fff; }
.btn-ghost:active{ transform:translateY(1px); }

.btn:disabled{
  opacity:.5;
  cursor:not-allowed;
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill, minmax(280px, 1fr));
  gap:16px;
}

.preview-item{
  background:var(--panel);
  border:2px solid var(--border);
  border-radius:18px;
  padding:12px;
  display:flex;
  flex-direction:column;
  gap:10px;
  transition:background .3s, border-color .3s, box-shadow .2s;
}

.preview-item:hover{
  box-shadow:0 8px 24px rgba(30,63,138,.10);
  border-color:var(--blue-soft);
}

[data-theme="dark"] .preview-item:hover{
  box-shadow:0 8px 24px rgba(0,0,0,.35);
}

.preview-item__head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:8px;
  padding:0 4px;
}

.preview-item__title{
  font-size:12.5px;
  font-weight:800;
  color:var(--text-dim);
  letter-spacing:.3px;
  text-transform:uppercase;
}

.preview-item__actions{
  display:flex;
  gap:6px;
  flex-shrink:0;
}

.preview-item__dl{
  width:30px;
  height:30px;
  border:none;
  border-radius:9px;
  background:var(--blue-pale);
  color:var(--blue);
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:0;
  transition:.15s;
}

.preview-item__dl:hover{ background:var(--orange); color:#fff; }
.preview-item__dl svg{ width:14px; height:14px; }

.preview-item__copy{
  width:30px;
  height:30px;
  border:none;
  border-radius:9px;
  background:var(--blue-pale);
  color:var(--blue);
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:0;
  transition:.15s;
}

.preview-item__copy:hover{ background:var(--green); color:#fff; }
.preview-item__copy svg{ width:14px; height:14px; }

.preview-item__canvas{
  display:flex;
  justify-content:center;
  align-items:center;
  background:var(--preview-bg);
  border-radius:12px;
  padding:8px;
  overflow:hidden;
  transition:background .3s;
}

.preview-item canvas{
  display:block;
  width:100%;
  height:auto;
  max-width:100%;
  border-radius:8px;
}

/* ===== TOAST ===== */

.toast{
  position:fixed;
  left:50%;
  bottom:28px;
  transform:translate(-50%, 20px);
  background:var(--blue);
  color:#fff;
  font-family:"Nunito Sans",sans-serif;
  font-size:14px;
  font-weight:800;
  letter-spacing:.3px;
  padding:12px 22px;
  border-radius:14px;
  box-shadow:0 10px 30px rgba(0,0,0,.28);
  opacity:0;
  visibility:hidden;
  transition:opacity .22s, transform .32s cubic-bezier(.34, 1.56, .64, 1), visibility .22s;
  z-index:2000;
  pointer-events:none;
  max-width:90vw;
  text-align:center;
}

.toast.show{
  opacity:1;
  visibility:visible;
  transform:translate(-50%, 0);
}

.toast.success{ background:var(--green); }
.toast.error{ background:var(--red); }

/* ===== SIGNATURE ===== */

.signature{
  position:fixed;
  bottom:8px;
  left:14px;
  font-size:12px;
  font-weight:600;
  color:var(--text-dim);
  opacity:.8;
  pointer-events:none;
  user-select:none;
  z-index:5;
}

/* ===== MOBILE ===== */

@media (max-width:700px){
  header{ padding:16px 18px 20px; }
  h1{ font-size:22px; }
  .logo{ width:48px; height:48px; }
  .logo svg{ width:40px; height:40px; }
  .logo::after{ width:20px; height:20px; font-size:12px; top:-3px; left:-5px; }
  .subtitle{ font-size:12px; }
  .icon-btn{ width:42px; height:42px; border-radius:14px; }
  .icon-btn svg{ width:20px; height:20px; }

  .container{ padding:16px 12px 50px; }
  .panel{ padding:16px 14px 18px; border-radius:18px; }
  .actions-bar{ padding:12px; }
  .actions-bar .btn{ flex:1 1 calc(50% - 5px); justify-content:center; }
  .grid{ grid-template-columns:1fr; }
}

/* ===== PRINT ===== */

@media print{
  header,
  .panel,
  .actions-bar,
  .signature,
  .preview-item__head,
  .preview-item__dl,
  .preview-item__copy,
  .toast{
    display:none !important;
  }
  body{
    background:#fff !important;
    background-image:none !important;
  }
  .container{ padding:0; max-width:none; }
  .layout{ display:block; }
  .grid{ display:block; }
  .preview-item{
    background:#fff !important;
    border:none !important;
    padding:0 !important;
    margin:0 0 24px !important;
    page-break-inside:avoid;
    break-inside:avoid;
  }
  .preview-item__canvas{
    background:transparent !important;
    padding:0 !important;
  }
  .preview-item canvas{
    max-width:100% !important;
    height:auto !important;
  }
}

/* ===== REDUCED MOTION ===== */

@media (prefers-reduced-motion: reduce){
  .icon-btn,
  .logo,
  .btn,
  .seg button,
  .switch::after,
  .toast{
    transition-duration:.01ms !important;
  }
}
</style>
</head>

<body>

<header>
  <div class="header-top">
    <div class="brand">
      <button class="logo" onclick="goBack()" title="Назад" aria-label="Назад">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M15.5 13a3.5 3.5 0 0 0 -3.5 3.5v1a3.5 3.5 0 0 0 7 0v-1.8"/>
          <path d="M8.5 13a3.5 3.5 0 0 1 3.5 3.5v1a3.5 3.5 0 0 1 -7 0v-1.8"/>
          <path d="M17.5 16a3.5 3.5 0 0 0 0 -7h-.5"/>
          <path d="M19 9.3v-2.8a3.5 3.5 0 0 0 -7 0"/>
          <path d="M6.5 16a3.5 3.5 0 0 1 0 -7h.5"/>
          <path d="M5 9.3v-2.8a3.5 3.5 0 0 1 7 0v10"/>
        </svg>
      </button>
      <div>
        <h1>Генератор таблиц Шульте</h1>
        <div class="subtitle">NeuroX · для печати и сохранения</div>
      </div>
    </div>

    <div class="header-buttons">
      <button class="icon-btn" id="themeBtn" title="Сменить тему" onclick="toggleTheme()" aria-label="Сменить тему">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>
        </svg>
      </button>
    </div>
  </div>
</header>

<div class="container">
  <div class="layout">

    <!-- ===== PANEL ===== -->
    <aside class="panel">

      <div class="panel-section">
        <h3>Основное</h3>

        <div class="field">
          <span>Размер поля</span>
          <select id="size">
            <option value="3">3×3 (9 клеток)</option>
            <option value="4" selected>4×4 (16 клеток)</option>
            <option value="5">5×5 (25 клеток)</option>
            <option value="6">6×6 (36 клеток)</option>
            <option value="7">7×7 (49 клеток)</option>
          </select>
        </div>

        <div class="field">
          <span>Содержимое</span>
          <div class="seg" id="modeSeg">
            <button data-value="numbers" class="active">Числа</button>
            <button data-value="letters">Буквы</button>
          </div>
        </div>

        <div class="field">
          <span>Количество таблиц</span>
          <input type="number" id="count" min="1" max="12" value="4">
        </div>

        <div class="field">
          <span>Заголовок (необязательно)</span>
          <input type="text" id="title" placeholder="Таблица" maxlength="32">
        </div>
      </div>

      <div class="panel-section">
        <h3>Оформление</h3>

        <div class="field">
          <span>Стиль клеток</span>
          <div class="seg" id="cellStyleSeg">
            <button data-value="framed" class="active">Рамки</button>
            <button data-value="soft">Мягкий</button>
            <button data-value="plain">Плоский</button>
          </div>
        </div>

        <div class="field">
          <span>Палитра</span>
          <div class="seg" id="paletteSegA">
            <button data-value="classic">Синяя</button>
            <button data-value="mono" class="active">Чёрная</button>
            <button data-value="warm">Тёплая</button>
          </div>
        </div>
        <div class="field">
          <div class="seg" id="paletteSegB">
            <button data-value="cool">Холодная</button>
            <button data-value="dark">Тёмная</button>
          </div>
        </div>

        <div class="field">
          <span>Размер клетки</span>
          <select id="cellSize">
            <option value="140">Маленький (компактно)</option>
            <option value="180" selected>Средний</option>
            <option value="220">Большой</option>
            <option value="260">Максимум (для печати)</option>
          </select>
        </div>

        <div class="toggle-row" id="numberingRow">
          <span class="toggle-row__label">Номер таблицы</span>
          <div class="switch"></div>
        </div>

        <div class="toggle-row" id="starRow">
          <span class="toggle-row__label">Звёздочка в центре</span>
          <div class="switch"></div>
        </div>
      </div>

      <div class="panel-section">
        <h3>Повторяемость</h3>
        <div class="field">
          <span>Seed (пусто = случайный)</span>
          <input type="text" id="seed" placeholder="например: 42">
        </div>
      </div>

    </aside>

    <!-- ===== PREVIEW ===== -->
    <main class="preview-area">

      <div class="actions-bar">
        <button class="btn btn-primary" id="regenBtn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M23 4v6h-6"/>
            <path d="M1 20v-6h6"/>
            <path d="M3.5 9a9 9 0 0 1 14.9-3.4L23 10"/>
            <path d="M1 14l4.6 4.4A9 9 0 0 0 20.5 15"/>
          </svg>
          Новый набор
        </button>
        <div class="spacer"></div>
        <button class="btn btn-ghost" id="copySheetBtn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <rect x="9" y="9" width="11" height="11" rx="2"/>
            <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
          </svg>
          Копировать
        </button>
        <button class="btn btn-ghost" id="downloadAllBtn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
            <polyline points="7 10 12 15 17 10"/>
            <line x1="12" y1="15" x2="12" y2="3"/>
          </svg>
          Скачать PNG
        </button>
        <button class="btn btn-ghost" id="downloadSheetBtn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="8" height="8" rx="1.5"/>
            <rect x="13" y="3" width="8" height="8" rx="1.5"/>
            <rect x="3" y="13" width="8" height="8" rx="1.5"/>
            <rect x="13" y="13" width="8" height="8" rx="1.5"/>
          </svg>
          Одним листом
        </button>
        <button class="btn btn-ghost" id="printBtn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="6 9 6 2 18 2 18 9"/>
            <path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/>
            <rect x="6" y="14" width="12" height="8"/>
          </svg>
          Печать
        </button>
      </div>

      <div class="grid" id="grid"></div>

    </main>

  </div>
</div>

<div class="signature">© verner</div>

<div class="toast" id="toast"></div>

<script>
/* ===== ТЕМА ===== */

const LS_THEME_KEY = 'neurox_theme';
const SVG_SUN = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
const SVG_MOON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>';

function applyTheme(theme){
  document.documentElement.setAttribute('data-theme', theme);
  const btn = document.getElementById('themeBtn');
  if (btn) btn.innerHTML = theme === 'dark' ? SVG_SUN : SVG_MOON;
}

function getStoredTheme(){ return localStorage.getItem(LS_THEME_KEY) || ''; }
function saveTheme(t){ localStorage.setItem(LS_THEME_KEY, t); }

function initTheme(){
  let theme = getStoredTheme();
  if (!theme){
    const prefersDark = window.matchMedia &&
                        window.matchMedia('(prefers-color-scheme: dark)').matches;
    theme = prefersDark ? 'dark' : 'light';
  }
  applyTheme(theme);
}

function toggleTheme(){
  const cur = document.documentElement.getAttribute('data-theme') || 'light';
  const next = cur === 'dark' ? 'light' : 'dark';
  applyTheme(next);
  saveTheme(next);
}

initTheme();

function goBack(){ location.href = "index.html"; }

/* ===== TOAST ===== */

let toastTimer = null;

function showToast(message, type = 'info'){
  const t = $('toast');
  if (!t) return;
  t.textContent = message;
  t.classList.remove('success', 'error');
  if (type === 'success') t.classList.add('success');
  if (type === 'error')   t.classList.add('error');
  t.classList.add('show');
  if (toastTimer) clearTimeout(toastTimer);
  toastTimer = setTimeout(() => {
    t.classList.remove('show');
  }, 1800);
}

/* ===== DATA ===== */

const $ = id => document.getElementById(id);

const CYR = ['А','Б','В','Г','Д','Е','Ё','Ж','З','И','Й','К','Л','М','Н','О','П','Р','С','Т','У','Ф','Х','Ц','Ч','Ш','Щ','Ъ','Ы','Ь','Э','Ю','Я'];

const PALETTES = {
  classic: { bg:'#FFFFFF', cell:'#FFFFFF', border:'#1E3F8A', text:'#1E3F8A', title:'#1E3F8A', shadow:'rgba(30,63,138,.14)', star:'#FF6A00' },
  mono:    { bg:'#FFFFFF', cell:'#FFFFFF', border:'#000000', text:'#000000', title:'#000000', shadow:'rgba(0,0,0,.18)',    star:'#000000' },
  warm:    { bg:'#FFF9F3', cell:'#FFFFFF', border:'#FF6A00', text:'#C85100', title:'#C85100', shadow:'rgba(200,81,0,.16)', star:'#FF6A00' },
  cool:    { bg:'#F1F6FF', cell:'#FFFFFF', border:'#3A5FA8', text:'#1E3F8A', title:'#1E3F8A', shadow:'rgba(58,95,168,.16)', star:'#FF6A00' },
  dark:    { bg:'#121721', cell:'#1C2331', border:'#7B9BE5', text:'#E8EEF9', title:'#7B9BE5', shadow:'rgba(0,0,0,.5)',     star:'#FF8B3D' }
};

/* ===== PRNG (mulberry32) ===== */

function mulberry32(a){
  return function(){
    a |= 0;
    a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

function hashString(str){
  let h = 2166136261;
  for (let i = 0; i < str.length; i++){
    h ^= str.charCodeAt(i);
    h = Math.imul(h, 16777619);
  }
  return h >>> 0;
}

function shuffleRng(arr, rng){
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--){
    const j = Math.floor(rng() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function randomSeedStr(){
  return Math.floor(Math.random() * 1e9).toString(36).toUpperCase();
}

/* ===== STATE ===== */

const state = {
  size: 4,
  mode: 'numbers',
  count: 4,
  title: '',
  cellStyle: 'framed',
  palette: 'mono',
  cellSize: 180,
  numbering: false,
  star: true,
  seedInput: ''
};

let currentSeed = '';

/* ===== CONTROLS BINDING ===== */

function bindSeg(id, key, after){
  const seg = $(id);
  seg.addEventListener('click', e => {
    const btn = e.target.closest('button');
    if (!btn) return;
    seg.querySelectorAll('button').forEach(b => b.classList.toggle('active', b === btn));
    state[key] = btn.dataset.value;
    if (after) after();
    render();
  });
}

function bindToggle(id, key){
  const row = $(id);
  row.classList.toggle('on', state[key]);
  row.addEventListener('click', () => {
    state[key] = !state[key];
    row.classList.toggle('on', state[key]);
    render();
  });
}

function setPalette(value){
  state.palette = value;
  ['paletteSegA', 'paletteSegB'].forEach(id => {
    const seg = $(id);
    if (!seg) return;
    seg.querySelectorAll('button').forEach(b => {
      b.classList.toggle('active', b.dataset.value === value);
    });
  });
  render();
}

['paletteSegA', 'paletteSegB'].forEach(id => {
  $(id).addEventListener('click', e => {
    const btn = e.target.closest('button');
    if (btn) setPalette(btn.dataset.value);
  });
});

bindSeg('modeSeg', 'mode', () => {
  if (state.mode === 'letters' && state.size > 5){
    state.size = 5;
    $('size').value = '5';
  }
});
bindSeg('cellStyleSeg', 'cellStyle');

bindToggle('numberingRow', 'numbering');
bindToggle('starRow', 'star');

$('size').addEventListener('change', e => {
  state.size = parseInt(e.target.value, 10);
  render();
});
$('count').addEventListener('change', e => {
  let v = parseInt(e.target.value, 10);
  if (!v || v < 1) v = 1;
  if (v > 12) v = 12;
  state.count = v;
  e.target.value = v;
  render();
});
$('title').addEventListener('input', e => {
  state.title = e.target.value.slice(0, 32);
  render();
});
$('cellSize').addEventListener('change', e => {
  state.cellSize = parseInt(e.target.value, 10);
  render();
});
$('seed').addEventListener('input', e => {
  state.seedInput = e.target.value.trim();
  render();
});

/* ===== CANVAS RENDER ===== */

function roundRect(ctx, x, y, w, h, r){
  r = Math.min(r, w / 2, h / 2);
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function generateValues(size, mode, rng){
  const total = size * size;
  if (mode === 'numbers'){
    const arr = Array.from({ length: total }, (_, i) => i + 1);
    return shuffleRng(arr, rng);
  } else {
    const picked = CYR.slice(0, total);
    return shuffleRng(picked, rng);
  }
}

function drawTable(canvas, values, cfg){
  const size = Math.round(Math.sqrt(values.length));
  const { cellSize, cellStyle, palette, titleText, star } = cfg;
  const pal = PALETTES[palette];

  const gap = Math.round(cellSize * 0.06);
  const margin = Math.round(cellSize * 0.22);

  const gridW = size * cellSize + (size - 1) * gap;
  const gridH = gridW;
  const titleH = titleText ? Math.round(cellSize * 0.5) : 0;
  const titleGap = titleText ? Math.round(cellSize * 0.2) : 0;

  const W = gridW + margin * 2;
  const H = gridH + margin * 2 + titleH + titleGap;

  canvas.width = W;
  canvas.height = H;

  const ctx = canvas.getContext('2d');
  ctx.imageSmoothingEnabled = true;

  ctx.fillStyle = pal.bg;
  ctx.fillRect(0, 0, W, H);

  const fontFamily = '"Fredoka","Nunito Sans",system-ui,sans-serif';

  if (titleText){
    ctx.fillStyle = pal.title;
    ctx.font = `600 ${Math.round(cellSize * 0.32)}px ${fontFamily}`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(titleText, W / 2, margin + titleH / 2);
  }

  const gridX = margin;
  const gridY = margin + titleH + titleGap;

  const radius = cellStyle === 'soft' ? Math.round(cellSize * 0.16) : Math.round(cellSize * 0.08);
  const borderW = cellStyle === 'framed' ? Math.max(2, Math.round(cellSize * 0.014)) : 0;

  for (let row = 0; row < size; row++){
    for (let col = 0; col < size; col++){
      const i = row * size + col;
      const x = gridX + col * (cellSize + gap);
      const y = gridY + row * (cellSize + gap);

      if (cellStyle === 'soft'){
        ctx.save();
        ctx.shadowColor = pal.shadow;
        ctx.shadowBlur = Math.round(cellSize * 0.08);
        ctx.shadowOffsetY = Math.round(cellSize * 0.02);
        ctx.fillStyle = pal.cell;
        roundRect(ctx, x, y, cellSize, cellSize, radius);
        ctx.fill();
        ctx.restore();
      } else if (cellStyle === 'framed'){
        ctx.fillStyle = pal.cell;
        roundRect(ctx, x, y, cellSize, cellSize, radius);
        ctx.fill();

        ctx.strokeStyle = pal.border;
        ctx.lineWidth = borderW;
        ctx.stroke();
      }

      ctx.fillStyle = pal.text;
      const isLetter = /[А-ЯЁ]/.test(values[i]);
      const fontSize = Math.round(cellSize * (isLetter ? 0.5 : 0.58));
      ctx.font = `700 ${fontSize}px ${fontFamily}`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(String(values[i]), x + cellSize / 2, y + cellSize / 2 + Math.round(cellSize * 0.02));
    }
  }

  if (star){
    const cx = gridX + gridW / 2;
    const cy = gridY + gridH / 2;
    const r = cellSize * 0.5;
    drawStar(ctx, cx, cy, r, pal.star);
  }
}

function drawStar(ctx, cx, cy, r, strokeColor){
  const spikes = 5;
  const outer = r;
  const inner = r * 0.45;

  ctx.save();
  ctx.beginPath();
  for (let i = 0; i < spikes * 2; i++){
    const angle = (Math.PI / spikes) * i - Math.PI / 2;
    const rad = i % 2 === 0 ? outer : inner;
    const x = cx + Math.cos(angle) * rad;
    const y = cy + Math.sin(angle) * rad;
    if (i === 0) ctx.moveTo(x, y);
    else ctx.lineTo(x, y);
  }
  ctx.closePath();

  ctx.strokeStyle = strokeColor;
  ctx.lineWidth = Math.max(2, r * 0.06);
  ctx.lineJoin = 'round';
  ctx.lineCap = 'round';
  ctx.stroke();
  ctx.restore();
}

/* ===== FILENAMES ===== */

function makeFilename(index, size, mode, seed, ext){
  const pad = String(index).padStart(2, '0');
  return `schulte_${size}x${size}_${mode}_${pad}_${seed}.${ext}`;
}

/* ===== DOWNLOAD HELPERS ===== */

function canvasToBlob(canvas){
  return new Promise(resolve => canvas.toBlob(resolve, 'image/png'));
}

function downloadCanvas(canvas, filename){
  return canvasToBlob(canvas).then(blob => {
    const url = URL.createObjectURL(blob);
    const link = document.createElement('a');
    link.download = filename;
    link.href = url;
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
    setTimeout(() => URL.revokeObjectURL(url), 1500);
  });
}

/* ===== COPY HELPERS ===== */

const canCopyImages = () =>
  typeof ClipboardItem !== 'undefined' &&
  navigator.clipboard &&
  typeof navigator.clipboard.write === 'function' &&
  window.isSecureContext !== false;

async function copyCanvasToClipboard(canvas, label){
  if (!canCopyImages()){
    showToast('Браузер не поддерживает копирование картинок', 'error');
    return false;
  }
  try {
    const blob = await canvasToBlob(canvas);
    await navigator.clipboard.write([
      new ClipboardItem({ 'image/png': blob })
    ]);
    showToast(label || 'Скопировано', 'success');
    return true;
  } catch (err){
    console.warn('clipboard error', err);
    showToast('Не удалось скопировать: доступ запрещён', 'error');
    return false;
  }
}

/* ===== RENDER ===== */

async function render(){
  if (document.fonts && document.fonts.ready){
    try { await document.fonts.ready; } catch(e){}
  }

  const grid = $('grid');
  grid.innerHTML = '';

  if (state.seedInput){
    currentSeed = state.seedInput;
  } else if (!currentSeed){
    currentSeed = randomSeedStr();
  }

  const baseSeedNum = hashString(currentSeed);

  const total = state.count;
  const canvases = [];

  for (let i = 0; i < total; i++){
    const rng = mulberry32(baseSeedNum + i * 1000033);

    const values = generateValues(state.size, state.mode, rng);

    let titleText = '';
    if (state.numbering){
      const baseTitle = state.title.trim();
      titleText = baseTitle ? `${baseTitle} ${i + 1}` : `Таблица ${i + 1}`;
    } else {
      titleText = state.title.trim();
    }

    const canvas = document.createElement('canvas');
    drawTable(canvas, values, {
      cellSize: state.cellSize,
      cellStyle: state.cellStyle,
      palette: state.palette,
      titleText,
      star: state.star
    });

    canvases.push(canvas);

    const item = document.createElement('div');
    item.className = 'preview-item';

    const head = document.createElement('div');
    head.className = 'preview-item__head';

    const label = document.createElement('span');
    label.className = 'preview-item__title';
    label.textContent = `Таблица ${i + 1} из ${total}`;
    head.appendChild(label);

    const actions = document.createElement('div');
    actions.className = 'preview-item__actions';

    const copyBtn = document.createElement('button');
    copyBtn.className = 'preview-item__copy';
    copyBtn.title = 'Копировать в буфер';
    copyBtn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>';
    copyBtn.addEventListener('click', () => {
      copyCanvasToClipboard(canvas, `Таблица ${i + 1} скопирована`);
    });
    actions.appendChild(copyBtn);

    const dl = document.createElement('button');
    dl.className = 'preview-item__dl';
    dl.title = 'Скачать PNG';
    dl.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>';
    dl.addEventListener('click', () => {
      downloadCanvas(canvas, makeFilename(i + 1, state.size, state.mode, currentSeed, 'png'));
    });
    actions.appendChild(dl);

    head.appendChild(actions);

    const wrap = document.createElement('div');
    wrap.className = 'preview-item__canvas';
    wrap.appendChild(canvas);

    item.appendChild(head);
    item.appendChild(wrap);
    grid.appendChild(item);
  }

  window.__canvases = canvases;
  $('downloadAllBtn').disabled = canvases.length === 0;
  $('downloadSheetBtn').disabled = canvases.length === 0;
  $('copySheetBtn').disabled = canvases.length === 0;
}

/* ===== ACTIONS ===== */

$('regenBtn').addEventListener('click', () => {
  currentSeed = randomSeedStr();
  $('seed').value = '';
  state.seedInput = '';
  render();
});

$('copySheetBtn').addEventListener('click', () => {
  const canvases = window.__canvases || [];
  if (!canvases.length) return;
  const sheet = composeSheet(canvases);
  copyCanvasToClipboard(sheet, 'Лист скопирован в буфер');
});

$('downloadAllBtn').addEventListener('click', async () => {
  const canvases = window.__canvases || [];
  for (let i = 0; i < canvases.length; i++){
    await new Promise(r => setTimeout(r, 350));
    await downloadCanvas(
      canvases[i],
      makeFilename(i + 1, state.size, state.mode, currentSeed, 'png')
    );
  }
});

$('downloadSheetBtn').addEventListener('click', () => {
  const canvases = window.__canvases || [];
  if (!canvases.length) return;
  const sheet = composeSheet(canvases);
  downloadCanvas(sheet, `schulte_${state.size}x${state.size}_${state.mode}_sheet_${currentSeed}.png`);
});

$('printBtn').addEventListener('click', () => {
  window.print();
});

function composeSheet(canvases){
  const cols = canvases.length === 1 ? 1 : 2;
  const rows = Math.ceil(canvases.length / cols);

  const gap = 40;
  const pad = 60;

  const maxW = Math.max(...canvases.map(c => c.width));
  const maxH = Math.max(...canvases.map(c => c.height));

  const W = pad * 2 + cols * maxW + (cols - 1) * gap;
  const H = pad * 2 + rows * maxH + (rows - 1) * gap;

  const sheet = document.createElement('canvas');
  sheet.width = W;
  sheet.height = H;
  const ctx = sheet.getContext('2d');

  ctx.fillStyle = '#FFFFFF';
  ctx.fillRect(0, 0, W, H);

  canvases.forEach((c, i) => {
    const col = i % cols;
    const row = Math.floor(i / cols);

    const slotX = pad + col * (maxW + gap);
    const slotY = pad + row * (maxH + gap);
    const x = slotX + (maxW - c.width) / 2;
    const y = slotY + (maxH - c.height) / 2;

    ctx.drawImage(c, x, y);
  });

  return sheet;
}

/* ===== INIT ===== */

render();
</script>
