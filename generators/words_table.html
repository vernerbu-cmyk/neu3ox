<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Слова по слогам — генератор</title>
<style>
  :root {
    --ink: #1d4e89;
    --ink-strong: #123a6b;
    --accent: #f08c1c;
    --accent-soft: #fde7c9;
    --soft: #eaf2fb;
    --line: #b9cfe7;
    --paper: #ffffff;
    --page: #eef3fa;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--page);
    color: var(--ink);
  }

  .controls {
    max-width: 960px;
    margin: 0 auto;
    padding: 20px 16px;
    background: var(--paper);
    border-bottom: 2px solid var(--ink);
  }
  .controls h1 { margin: 0 0 14px; font-size: 20px; font-weight: 700; }

  fieldset {
    border: 1px solid var(--line);
    border-radius: 10px;
    margin: 0 0 12px;
    padding: 10px 12px 12px;
    background: #fbfdff;
  }
  legend { font-weight: 700; padding: 0 6px; font-size: 14px; }

  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chips label {
    display: inline-flex; align-items: center; gap: 5px;
    padding: 4px 9px;
    border: 1px solid var(--line);
    border-radius: 7px;
    cursor: pointer; user-select: none;
    font-size: 15px;
    color: var(--ink);
    background: var(--paper);
    transition: background .12s, border-color .12s;
  }
  .chips label:hover { background: var(--soft); }
  .chips label:has(input:checked) {
    background: var(--soft);
    border-color: var(--ink);
    color: var(--ink-strong);
  }
  .chips input { margin: 0; accent-color: var(--ink); }

  .vowels-chips .chips label {
    font-weight: 700;
    min-width: 34px;
    justify-content: center;
    color: var(--accent);
  }
  .vowels-chips .chips label:has(input:checked) {
    background: var(--accent-soft);
    border-color: var(--accent);
    color: #a35a00;
  }

  .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-top: 8px; }
  .row > label { display: inline-flex; align-items: center; gap: 6px; font-size: 14px; color: var(--ink); }

  select, input[type=text] {
    font: inherit; padding: 6px 9px;
    border: 1px solid var(--line); border-radius: 7px;
    background: #fff; color: var(--ink);
  }
  button {
    font: inherit; padding: 7px 13px;
    border: 1px solid var(--ink); background: var(--paper); color: var(--ink);
    border-radius: 7px; cursor: pointer;
    transition: background .12s, color .12s;
  }
  button:hover { background: var(--soft); }
  button.primary { background: var(--ink-strong); color: #fff; border-color: var(--ink-strong); }
  button.primary:hover { background: var(--ink); }
  button.small { padding: 4px 9px; font-size: 13px; }

  .size-slider { display: flex; align-items: center; gap: 10px; font-size: 14px; }
  .size-slider input[type=range] { width: 240px; accent-color: var(--accent); }
  .size-slider .val { font-weight: 700; min-width: 110px; }
  .hint { font-size: 12px; color: #777; margin-top: 6px; }

  .sheet-wrap { display: flex; justify-content: center; padding: 24px 12px 48px; }
  .sheet {
    width: 210mm; height: 297mm; padding: 12mm;
    background: var(--paper);
    box-shadow: 0 6px 28px rgba(29,78,137,.18);
    display: flex; flex-direction: column;
  }
  .sheet-header {
    display: flex; justify-content: space-between; align-items: baseline;
    margin-bottom: 4mm; font-size: 11pt; color: var(--ink); opacity: .65;
  }
  .sheet-header .title { font-weight: 700; opacity: 1; }

  .cards {
    flex: 1; display: grid; gap: 2mm;
    justify-content: center; align-content: center;
    min-height: 0;
  }
  .card {
    display: flex; align-items: center; justify-content: center;
    border: 1px solid var(--accent); border-radius: 3mm;
    padding: 2mm 3mm; overflow: hidden;
    text-align: center;
    background: var(--accent-soft);
  }
  .card .word {
    font-weight: 700; line-height: 1; color: var(--ink);
    display: inline-block; text-align: center;
  }
  .word .syllable { display: inline-block; position: relative; padding-bottom: 0.6em; }
  .word .char {
    display: inline-block;
    position: relative;
    line-height: 1;
    vertical-align: baseline;
  }
  .word .char.silent {
    display: inline;
  }
  .word .arc  { display: inline-block; position: relative; line-height: 1; vertical-align: baseline; }

  .word.arcs .char.dot::after {
    content: ''; position: absolute;
    left: 50%; bottom: -0.32em;
    width: 0.16em; height: 0.16em;
    transform: translateX(-50%);
    background: currentColor; border-radius: 50%;
  }
  .word.arcs .arc::after {
    content: ''; position: absolute;
    left: 0.02em; right: 0.02em; bottom: -0.3em;
    height: 0.22em;
    border-bottom: 0.07em solid currentColor;
    border-radius: 0 0 100% 100% / 0 0 100% 100%;
  }
  .word .sep { display: inline-block; opacity: .55; }

  .empty-msg {
    display: flex; align-items: center; justify-content: center;
    height: 100%; color: var(--ink); opacity: .4;
    font-size: 14pt; font-weight: 600; text-align: center; padding: 20px;
  }

  @page { size: A4 portrait; margin: 0; }
  @media print {
    body { background: #fff; }
    .controls { display: none !important; }
    .sheet-wrap { padding: 0; }
    .sheet {
      box-shadow: none; width: 210mm; height: 297mm; padding: 12mm;
      page-break-after: avoid;
    }
    * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  }
</style>

    return syllabify(token);
  }

  const WORDS = RAW_WORDS.trim().split(/\s+/).filter(Boolean).map(parseWord);

  const VOWELS_LIST = ['А','О','У','Ы','Э','Я','Ё','Ю','И','Е'];

  const state = {
    syllableCounts: new Set([2]),
    vowelsInWord: new Set(),
    twoConsStart: false,
    sep: '-',
    lowercase: false,
    arcs: false,
    cols: 3,
    count: 'auto',
    cardWidthMm: 55,
    title: 'Слова по слогам',
    showTitle: true,
  };
  let currentWords = [];

  const cards       = document.getElementById('cards');
  const sheetHeader = document.getElementById('sheetHeader');
  const sheetTitle  = document.getElementById('sheetTitle');
  const titleInput  = document.getElementById('titleInput');
  const showTitle   = document.getElementById('showTitle');
  const sylChips    = document.getElementById('sylChips');
  const vowelInChips= document.getElementById('vowelInChips');
  const twoConsStart= document.getElementById('twoConsStart');
  const poolHint    = document.getElementById('poolHint');
  const sepSelect   = document.getElementById('sepSelect');
  const lowerToggle = document.getElementById('lowerToggle');
  const arcsToggle  = document.getElementById('arcsToggle');
  const colsSelect  = document.getElementById('colsSelect');
  const countSelect = document.getElementById('countSelect');
  const sizeRange   = document.getElementById('sizeRange');
  const sizeVal     = document.getElementById('sizeVal');

  const SHEET_W_MM = 210, SHEET_H_MM = 297;
  const SHEET_PADDING_MM = 12;
  const HEADER_HEIGHT_MM = 8;
  const GAP_MM = 2;
  const CARD_RATIO = 30 / 55;

  function shuffle(a) {
    const arr = a.slice();
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  }
  const escapeHtml = s => s.replace(/[&<>"']/g, ch => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  })[ch]);

  function makeChip(text, checked, onToggle) {
    const label = document.createElement('label');
    const input = document.createElement('input');
    input.type = 'checkbox';
    input.checked = checked;
    input.addEventListener('change', () => onToggle(input.checked, input));
    label.appendChild(input);
    label.appendChild(document.createTextNode(text));
    return label;
  }

  function renderSyllableChips() {
    sylChips.innerHTML = '';
    [1,2,3,4,5].forEach(n => {
      let label;
      if (n === 1) label = '1 слог';
      else if (n === 5) label = '5+ слогов';
      else label = n + ' слога';
      sylChips.appendChild(makeChip(label, state.syllableCounts.has(n), (checked, input) => {
        if (checked) state.syllableCounts.add(n);
        else {
          if (state.syllableCounts.size <= 1) { input.checked = true; return; }
          state.syllableCounts.delete(n);
        }
        regenerate();
      }));
    });
  }

  function renderVowelChips() {
    vowelInChips.innerHTML = '';
    VOWELS_LIST.forEach(ch => {
      vowelInChips.appendChild(makeChip(ch, state.vowelsInWord.has(ch), (checked) => {
        if (checked) state.vowelsInWord.add(ch);
        else state.vowelsInWord.delete(ch);
        regenerate();
      }));
    });
  }

  function matchesSyllables(w) {
    const n = w.length;
    if (n >= 5) return state.syllableCounts.has(5);
    return state.syllableCounts.has(n);
  }

  function pool() {
    return WORDS.filter(w => {
      if (!matchesSyllables(w)) return false;

      if (state.vowelsInWord.size > 0) {
        const wordStr = w.join('').toUpperCase();
        const hasAny = [...state.vowelsInWord].some(v => wordStr.includes(v));
        if (!hasAny) return false;
      }

      if (state.twoConsStart) {
        const chars = [...w[0]];
        if (chars.length < 2) return false;
        if (isVowel(chars[0]) || isVowel(chars[1])) return false;
      }

      return true;
    });
  }

  function updatePoolHint() {
    const p = pool();
    poolHint.textContent = `В базе: ${WORDS.length} слов. Подходит под фильтр: ${p.length}.`;
  }

  function computeAutoCount() {
    const usableW = SHEET_W_MM - SHEET_PADDING_MM * 2;
    const usableH = SHEET_H_MM - SHEET_PADDING_MM * 2 - HEADER_HEIGHT_MM;
    const cols = state.cols;
    const cellW = (usableW - GAP_MM * (cols - 1)) / cols;
    const cellH = cellW * CARD_RATIO;
    const rows = Math.max(1, Math.floor((usableH + GAP_MM) / (cellH + GAP_MM)));
    return cols * rows;
  }

  function effectiveCount() {
    return state.count === 'auto' ? computeAutoCount() : state.count;
  }

  function regenerate() {
    const p = pool();
    const cnt = effectiveCount();
    if (!p.length) {
      currentWords = [];
    } else {
      const shuffled = shuffle(p);
      currentWords = shuffled.slice(0, Math.min(cnt, shuffled.length));
    }
    updatePoolHint();
    render();
  }

  function computeCardSize(cols, rows) {
    const usableW = SHEET_W_MM - SHEET_PADDING_MM * 2;
    const usableH = SHEET_H_MM - SHEET_PADDING_MM * 2 - HEADER_HEIGHT_MM;
    const neededW = state.cardWidthMm * cols + GAP_MM * (cols - 1);
    let W = state.cardWidthMm;
    if (neededW > usableW) W = (usableW - GAP_MM * (cols - 1)) / cols;
    const H2 = W * CARD_RATIO * rows + GAP_MM * (rows - 1);
    if (H2 > usableH) W = (usableH - GAP_MM * (rows - 1)) / (CARD_RATIO * rows);
    return { W, H: W * CARD_RATIO };
  }

  const NO_MARK = 'ьЬъЪ';

  function charHtml(ch, isDot) {
    const isV = VOWELS.includes(ch);
    const isSilent = NO_MARK.includes(ch);
    const cls = 'char'
      + (isV ? ' vowel' : '')
      + (isDot && !isSilent ? ' dot' : '')
      + (isSilent ? ' silent' : '');
    return `<span class="${cls}">${escapeHtml(ch)}</span>`;
  }

  function renderSyllable(syl) {
    const txt = state.lowercase ? syl.toLowerCase() : syl;
    const chars = [...txt];

    if (chars.length === 1) {
      return `<span class="syllable">${charHtml(chars[0], true)}</span>`;
    }

    let firstVowel = -1;
    for (let i = 0; i < chars.length; i++) {
      if (VOWELS.includes(chars[i])) { firstVowel = i; break; }
    }

    if (firstVowel === -1) {
      return `<span class="syllable">${chars.map(ch => charHtml(ch, true)).join('')}</span>`;
    }

    let arcStart, arcEnd;
    if (firstVowel === 0) {
      arcStart = 0;
      arcEnd = chars.length - 1;
    } else {
      arcStart = firstVowel - 1;
      arcEnd = firstVowel;
    }

    let html = '';
    let i = 0;
    while (i < chars.length) {
      if (i < arcStart || i > arcEnd) {
        html += charHtml(chars[i], true);
        i++;
      } else {
        let j = i;
        while (j <= arcEnd && j < chars.length) j++;
        const inner = chars.slice(i, j).map(ch => charHtml(ch, false)).join('');
        html += `<span class="arc">${inner}</span>`;
        i = j;
      }
    }
    return `<span class="syllable">${html}</span>`;
  }

  function buildWordHtml(syllables) {
    if (!state.arcs) {
      const text = syllables.map(s => state.lowercase ? s.toLowerCase() : s).join(state.sep || '');
      return escapeHtml(text);
    }
    let sep = state.sep;
    if (sep === ' ') sep = '\u00A0';
    const sepHtml = sep ? `<span class="sep">${escapeHtml(sep)}</span>` : '';
    return syllables.map(syl => renderSyllable(syl)).join(sepHtml);
  }

  function measureCardFont(cardEl, wordEl) {
    const cs = getComputedStyle(cardEl);
    const padL = parseFloat(cs.paddingLeft) || 0;
    const padR = parseFloat(cs.paddingRight) || 0;
    const padT = parseFloat(cs.paddingTop) || 0;
    const padB = parseFloat(cs.paddingBottom) || 0;
    const availW = cardEl.clientWidth - padL - padR - 2;
    const availH = cardEl.clientHeight - padT - padB - 2;
    if (availW <= 1 || availH <= 1) return 0;

    wordEl.style.fontSize = '400px';
    let rect = wordEl.getBoundingClientRect();
    if (rect.width <= availW && rect.height <= availH) {
      return Math.min(availH * 0.95, availW);
    }
    let lo = 5, hi = 400;
    for (let i = 0; i < 30; i++) {
      const mid = (lo + hi) / 2;
      wordEl.style.fontSize = mid + 'px';
      rect = wordEl.getBoundingClientRect();
      if (rect.width <= availW && rect.height <= availH) lo = mid;
      else hi = mid;
      if (hi - lo < 0.5) break;
    }
    return lo;
  }

  function fitAllCards() {
    const cardEls = cards.querySelectorAll('.card');
    const items = [];
    cardEls.forEach((cardEl, i) => {
      if (i >= currentWords.length) return;
      const wordEl = cardEl.querySelector('.word');
      if (wordEl) items.push({ cardEl, wordEl });
    });
    if (!items.length) return;

    const sizes = items.map(({ cardEl, wordEl }) => measureCardFont(cardEl, wordEl));
    const unified = Math.floor(Math.min(...sizes));
    items.forEach(({ wordEl }) => {
      wordEl.style.fontSize = unified + 'px';
    });
  }

  function render() {
    sheetHeader.style.visibility = state.showTitle ? 'visible' : 'hidden';
    sheetTitle.textContent = state.title || '';

    cards.innerHTML = '';
    if (!currentWords.length) {
      const msg = document.createElement('div');
      msg.className = 'empty-msg';
      msg.textContent = 'Нет слов под выбранные фильтры.';
      cards.style.gridTemplateColumns = '1fr';
      cards.style.gridTemplateRows = '1fr';
      cards.appendChild(msg);
      return;
    }
    const cnt = effectiveCount();
    const rows = Math.max(1, Math.ceil(cnt / state.cols));
    const { W, H } = computeCardSize(state.cols, rows);
    cards.style.gridTemplateColumns = `repeat(${state.cols}, ${W.toFixed(3)}mm)`;
    cards.style.gridTemplateRows    = `repeat(${rows}, ${H.toFixed(3)}mm)`;
    const drawCount = Math.min(cnt, currentWords.length);
    const totalCells = rows * state.cols;

    for (let i = 0; i < totalCells; i++) {
      if (i < drawCount) {
        const w = currentWords[i];
        const card = document.createElement('div');
        card.className = 'card';
        const word = document.createElement('div');
        word.className = 'word';
        word.innerHTML = buildWordHtml(w);
        word.classList.toggle('arcs', state.arcs);
        card.appendChild(word);
        cards.appendChild(card);
      } else {
        const empty = document.createElement('div');
        empty.className = 'card';
        empty.style.border = 'none';
        empty.style.background = 'transparent';
        cards.appendChild(empty);
      }
    }
    fitAllCards();
    requestAnimationFrame(() => { fitAllCards(); });
  }

  sepSelect.addEventListener('change', e => { state.sep = e.target.value; render(); });
  lowerToggle.addEventListener('change', e => { state.lowercase = e.target.checked; render(); });
  arcsToggle.addEventListener('change', e => { state.arcs = e.target.checked; render(); });
  colsSelect.addEventListener('change', e => {
    state.cols = parseInt(e.target.value, 10);
    if (state.count === 'auto') regenerate();
    else render();
  });
  countSelect.addEventListener('change', e => {
    const v = e.target.value;
    state.count = v === 'auto' ? 'auto' : parseInt(v, 10);
    regenerate();
  });

  sizeRange.addEventListener('input', e => {
    state.cardWidthMm = parseInt(e.target.value, 10);
    sizeVal.textContent = state.cardWidthMm + ' × ' + Math.round(state.cardWidthMm * CARD_RATIO) + ' мм';
    if (state.count !== 'auto') render();
  });

  titleInput.addEventListener('input', e => { state.title = e.target.value; render(); });
  showTitle.addEventListener('change', e => { state.showTitle = e.target.checked; render(); });

  document.querySelectorAll('[data-vow]').forEach(btn => {
    btn.addEventListener('click', () => {
      const mode = btn.dataset.vow;
      if (mode === 'all') VOWELS_LIST.forEach(ch => state.vowelsInWord.add(ch));
      else state.vowelsInWord.clear();
      renderVowelChips();
      regenerate();
    });
  });

  twoConsStart.addEventListener('change', e => {
    state.twoConsStart = e.target.checked;
    regenerate();
  });

  document.getElementById('regenBtn').addEventListener('click', regenerate);
  document.getElementById('printBtn').addEventListener('click', () => window.print());

  window.addEventListener('resize', fitAllCards);
  window.addEventListener('beforeprint', fitAllCards);

  renderSyllableChips();
  renderVowelChips();
  sepSelect.value = state.sep;
  lowerToggle.checked = state.lowercase;
  arcsToggle.checked = state.arcs;
  colsSelect.value = String(state.cols);
  countSelect.value = String(state.count);
  sizeRange.value = state.cardWidthMm;
  sizeVal.textContent = state.cardWidthMm + ' × ' + Math.round(state.cardWidthMm * CARD_RATIO) + ' мм';
  titleInput.value = state.title;
  showTitle.checked = state.showTitle;
  twoConsStart.checked = state.twoConsStart;

  regenerate();
})();
</script>

<script src="../assets/menu-data.js"></script>
<script src="../assets/menu-drawer.js"></script>
