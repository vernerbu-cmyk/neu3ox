<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Филворд — NeuroX</title>
  <script src="../shared/theme.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <style>
  :root {
    --blue: #1E3F8A;
    --darkblue: #152E68;
    --blue-pale: #E8EEF9;
    --orange: #FF6A00;
    --orange-soft: #FFF0E4;
    --orange-dark: #C85100;
    --bg: #F4F6FB;
    --panel: #fff;
    --text: #24324B;
    --muted: #67758E;
    --border: #DCE4F2;
    --green: #1DAB6A;
    --red: #DB4B59;
  }
  
  [data-theme="dark"] {
    --blue: #8EAFFC;
    --darkblue: #18284D;
    --blue-pale: #2A3958;
    --orange: #FF8B3D;
    --orange-soft: #483221;
    --orange-dark: #B55113;
    --bg: #121721;
    --panel: #1C2331;
    --text: #E8EEF9;
    --muted: #ABB6CC;
    --border: #3D4960;
    --green: #48C98D;
    --red: #FF7C86;
  }
  
  * {
    box-sizing: border-box;
  }
  
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Nunito Sans',sans-serif;
    min-height: 100vh;
  }
  
  button,input,select {
    font: inherit;
  }
  
  button {
    cursor: pointer;
  }
  
  .site-header {
    background: linear-gradient(125deg,#152E68,#1E3F8A 60%,#2B55A0);
    color: #fff;
    box-shadow: 0 7px 24px #142f6025;
    padding: 17px max(20px,calc((100vw - 1250px)/2));
    display: flex;
    gap: 15px;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
  }
  
  [data-theme="dark"] .site-header {
    background: linear-gradient(125deg,#111A2D,#22385F);
  }
  
  .brand {
    display: flex;
    align-items: center;
    gap: 13px;
  }
  
  .back {
    border: 0;
    background: #ffffff23;
    color: #fff;
    border-radius: 14px;
    width: 48px;
    height: 48px;
    font-size: 25px;
    font-weight: 900;
  }
  
  .back:hover,.header-btn:hover {
    background: #ff6a00;
  }
  
  h1 {
    margin: 0;
    font-size: 26px;
    font-weight: 900;
    font-style: italic;
    line-height: 1.12;
  }
  
  .brand small {
    display: block;
    color: #ecf2ffbd;
    font-size: 12px;
    font-weight: 700;
    margin-top: 3px;
  }
  
  .header-right {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  
  .score {
    background: var(--orange);
    color: white;
    border-radius: 14px;
    padding: 10px 16px;
    font-weight: 900;
    white-space: nowrap;
    box-shadow: 0 4px 0 #ae4304;
  }
  
  .header-btn {
    background: #ffffff23;
    border: 0;
    border-radius: 12px;
    color: white;
    font-weight: 900;
    padding: 10px 13px;
  }
  
  .wrap {
    max-width: 1250px;
    margin: 24px auto 55px;
    padding: 0 20px;
  }
  
  .panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 22px;
    padding: 24px;
    box-shadow: 0 6px 24px #203e7010;
  }
  
  .page-title {
    text-align: center;
    font-size: 23px;
    font-weight: 900;
    color: var(--text);
    margin: 0 0 4px;
  }
  
  .sub {
    text-align: center;
    color: var(--muted);
    font-size: 13px;
    font-weight: 700;
    margin: 0 0 21px;
  }
  
  .settings {
    max-width: 860px;
    margin: 0 auto;
  }
  
  .group {
    padding-top: 18px;
    margin-top: 18px;
    border-top: 1px solid var(--border);
  }
  
  .group:first-child {
    padding-top: 0;
    margin-top: 0;
    border: 0;
  }
  
  .group-title {
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: .8px;
    color: var(--muted);
    font-weight: 900;
    margin-bottom: 10px;
  }
  
  .chips {
    display: flex;
    flex-wrap: wrap;
    gap: 7px;
  }
  
  .chip {
    border: 2px solid var(--border);
    background: var(--panel);
    color: var(--text);
    padding: 8px 11px;
    border-radius: 11px;
    font-size: 12px;
    font-weight: 800;
  }
  
  .chip.active {
    background: var(--blue);
    color: #fff;
    border-color: var(--blue);
  }
  
  .chip.category.active {
    background: var(--orange);
    border-color: var(--orange);
  }
  
  .chip.mode {
    font-size: 15px;
    padding: 11px 19px;
    border-radius: 13px;
  }
  
  .chip.mode.active {
    background: var(--orange);
    border-color: var(--orange);
    color: #fff;
  }
  
  .baby-intro {
    font-size: 13px;
    color: var(--muted);
    font-weight: 700;
    line-height: 1.55;
    margin: 9px 0 0;
  }
  
  .board.baby {
    max-width: 590px;
    gap: 6px;
  }
  
  .board.baby .cell {
    border-width: 2px;
    border-radius: 12px;
  }
  
  .words.baby {
    gap: 10px;
  }
  
  .words.baby .word {
    font-size: 18px;
    padding: 9px 14px;
    border-radius: 12px;
  }
  
  .chip:hover:not(.active) {
    border-color: var(--orange);
  }
  
  .slider-row {
    display: flex;
    justify-content: space-between;
    margin-bottom: 6px;
    font-weight: 800;
  }
  
  .slider-row b {
    color: var(--orange);
  }
  
  input[type="range"] {
    width: 100%;
    accent-color: var(--orange);
    height: 24px;
  }
  
  .toggles {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }
  
  .toggle {
    display: flex;
    gap: 10px;
    align-items: center;
    border: 1px solid var(--border);
    border-radius: 12px;
    background: var(--bg);
    padding: 12px;
    font-size: 13px;
    font-weight: 750;
    cursor: pointer;
  }
  
  .toggle input {
    accent-color: var(--orange);
    width: 18px;
    height: 18px;
    flex: none;
  }
  
  .actions {
    display: flex;
    justify-content: center;
    gap: 10px;
    flex-wrap: wrap;
    margin-top: 24px;
  }
  
  .btn {
    padding: 12px 20px;
    border-radius: 12px;
    font-weight: 900;
    border: 1px solid var(--border);
    background: var(--panel);
    color: var(--text);
  }
  
  .btn.primary {
    background: var(--orange);
    border-color: var(--orange);
    color: #fff;
    box-shadow: 0 4px 0 var(--orange-dark);
  }
  
  .btn.blue {
    background: var(--blue);
    border-color: var(--blue);
    color: white;
  }
  
  .btn:hover:not(:disabled) {
    filter: brightness(.96);
  }
  
  .btn:disabled {
    opacity: .5;
    cursor: default;
  }
  
  .notice {
    border-left: 4px solid var(--orange);
    background: var(--orange-soft);
    color: var(--text);
    padding: 10px 13px;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 800;
    margin: 10px auto 20px;
    max-width: 900px;
  }
  
  .stats {
    display: flex;
    justify-content: center;
    gap: 8px;
    flex-wrap: wrap;
    margin: 0 auto 18px;
  }
  
  .stat {
    background: var(--blue-pale);
    color: var(--blue);
    border: 1px solid var(--border);
    border-radius: 11px;
    padding: 8px 13px;
    font-weight: 850;
    font-size: 13px;
  }
  
  .game-layout {
    max-width: 900px;
    margin: auto;
  }
  
  .board-wrap {
    display: flex;
    justify-content: center;
    position: relative;
  }
  
  .board {
    display: grid;
    gap: 3px;
    width: min(100%,670px);
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
    position: relative;
  }
  
  .cell {
    aspect-ratio: 1;
    display: flex;
    justify-content: center;
    align-items: center;
    border: 1.5px solid var(--border);
    border-radius: 7px;
    background: var(--panel);
    color: var(--text);
    font-size: var(--fs,20px);
    line-height: 1;
    font-weight: 900;
    cursor: crosshair;
    min-width: 0;
    min-height: 0;
    transition: background-color .12s,border-color .12s;
  }
  
  .cell.sel {
    background: var(--orange-soft);
    border-color: var(--orange);
    color: var(--orange-dark);
    outline: 1px solid var(--orange);
    z-index: 1;
  }
  
  .cell.found {
    background: var(--wc,var(--blue-pale));
    border-color: var(--wcb,var(--blue));
    color: var(--wcb,var(--blue));
  }
  
  .cell.hint {
    animation: hint .65s ease-in-out 2;
  }
  
  .cell.bad {
    background: #FFE1E4;
    border-color: var(--red);
    color: #9C2133;
  }
  
  @keyframes hint {
    50% {
      transform: scale(1.16);
      outline: 3px solid var(--orange);
    }
  }
  
  .words {
    display: flex;
    flex-wrap: wrap;
    gap: 7px;
    justify-content: center;
    margin-top: 23px;
  }
  
  .word {
    font-size: 13px;
    font-weight: 900;
    border: 1px solid var(--border);
    background: var(--blue-pale);
    color: var(--blue);
    padding: 7px 12px;
    border-radius: 10px;
  }
  
  .word.done {
    opacity: .6;
    text-decoration: line-through;
    background: #DCFCE7;
    color: #126E44;
  }
  
  .game-actions {
    margin: 18px auto 0;
  }
  
  .game-help {
    text-align: center;
    color: var(--muted);
    margin: 12px auto 0;
    font-size: 13px;
    font-weight: 700;
    line-height: 1.5;
  }
  
  .result {
    text-align: center;
    padding: 25px 10px;
  }
  
  .result-emoji {
    font-size: 58px;
    margin-bottom: 8px;
  }
  
  .result h2 {
    font-size: 26px;
    margin: 10px 0;
    color: var(--blue);
  }
  
  .result p {
    color: var(--muted);
    font-size: 15px;
    font-weight: 700;
    line-height: 1.55;
    margin: 8px 0;
  }
  
  .result-stars {
    font-size: 35px;
    margin: 15px 0;
  }
  
  footer {
    position: fixed;
    right: 13px;
    bottom: 8px;
    pointer-events: none;
    color: var(--muted);
    font-size: 12px;
    font-weight: 700;
  }
  
  @media (max-width:700px) {
    .board.baby {
      gap: 3px;
    }
    .board.baby .cell {
      border-width: 1.5px;
      border-radius: 7px;
    }
    .site-header {
      padding: 12px;
    }
    .wrap {
      margin-top: 13px;
      padding: 0 9px;
    }
    h1 {
      font-size: 21px;
    }
    .panel {
      padding: 12px;
      border-radius: 15px;
    }
    .toggles {
      grid-template-columns: 1fr;
    }
    .board {
      gap: 2px;
    }
    .cell {
      border-radius: 4px;
      border-width: 1px;
    }
    .actions {
      gap: 6px;
    }
    .btn {
      padding: 10px 12px;
      font-size: 12px;
    }
    .score {
      padding: 7px 12px;
      font-size: 13px;
    }
    .header-right {
      gap: 5px;
    }
    .back {
      width: 42px;
      height: 42px;
    }
    .page-title {
      font-size: 20px;
    }
  }
  </style>
  <link rel="stylesheet" href="../assets/menu-drawer.css">
  <link rel="stylesheet" href="../shared/unified-topbar.css">
  <link rel="stylesheet" href="../shared/season-effects.css">
  <link rel="stylesheet" href="../shared/theme.css">
</head>
<body>
  <header class="site-header">
    <div class="brand">
      <button class="back" onclick="location.href='index.html'" title="Назад">←</button>
      <div>

    </div>
  </header>
  <div class="wrap" id="game"></div>
  <footer>© verner</footer>

function failScreen() {
    gameEl.innerHTML = `<div class="panel result"><div class="result-emoji">🔎</div><h2>Не удалось составить филворд</h2><p>Для выбранных настроек не удалось найти свободные маршруты. Попробуй сетку крупнее, меньше слов или диагонали.</p><button class="btn primary" id="settingsBtn">Настройки</button></div>`;
    $('settingsBtn').onclick = showSettings;
}
function startGame() {
    clearTimers();
    pointerID = null;
    const puzzle = buildPuzzleFromCfg();
    if (!puzzle) {
        state = null;
        failScreen();
        return;
    }
    state = { ...puzzle, found: new Set(), foundPaths: [], hints: 0, selection: [], paused: false, startedAt: Date.now(), elapsed: 0, ended: false };
    renderGame();
    timerId = setInterval(updateTimer, 250);
    updateTimer();
}
function elapsedMs() {
    if (!state)
        return 0;
    return state.elapsed + (state.paused ? 0 : Date.now() - state.startedAt);
}
function updateTimer() {
    const el = $('timer');
    if (!el || !state)
        return;
    el.textContent = fmtTime(Math.floor(elapsedMs() / 1000));
}
function setPause(value) {
    if (!state || state.ended || state.paused === value)
        return;
    if (value) {
        state.elapsed = elapsedMs();
        state.paused = true;
        resetSelection();
    }
    else {
        state.startedAt = Date.now();
        state.paused = false;
    }
    $('pauseBtn').textContent = value ? '▶ Продолжить' : '⏸ Пауза';
    $('pauseBtn').classList.toggle('blue', value);
    $('board').style.opacity = value ? '.35' : '1';
    $('board').style.pointerEvents = value ? 'none' : 'auto';
    if ($('hintBtn'))
        $('hintBtn').disabled = value;
    updateTimer();
}
function renderGame() {
    if (!state)
        return;
    const downgrade = state.placed.length < state.requested;
    const notice = downgrade ? `<div class="notice">Для выбранной сетки поместилось ${state.placed.length} из ${state.requested} слов. Размер ${state.W}×${state.H} сохранён.</div>` : '';
    gameEl.innerHTML = `<div class="game-layout">
 <h2 class="page-title">${isBaby() ? '🧸 Найди короткие слова' : 'Найди все слова'}</h2>
 <p class="sub">${isBaby() ? getBabyDirectionSpec().description : (cfg.diag ? 'Можно ходить по диагонали · ' : '') + 'Слова поворачивают; каждую клетку можно использовать только один раз'}</p>
 ${notice}
 <div class="panel">
  <div class="stats">
   ${cfg.showTimer ? '<span class="stat">⏱ <span id="timer">00:00</span></span>' : ''}
   <span class="stat">✅ <span id="foundCount">0</span> из ${state.placed.length}</span>
   <span class="stat">💡 <span id="hintCount">0</span></span>
   <span class="stat">Сетка ${state.W}×${state.H}</span>
  </div>
  <div class="board-wrap"><div id="board" class="board ${isBaby() ? 'baby' : ''}" aria-label="Поле филворда"></div></div>
  ${cfg.showList ? `<div class="words ${isBaby() ? 'baby' : ''}" id="wordList"></div>` : ''}
  <div class="actions game-actions">
   <button id="hintBtn" class="btn">💡 Подсказка (−10)</button>
   <button id="pauseBtn" class="btn blue">⏸ Пауза</button>
   <button id="finishBtn" class="btn">■ Завершить</button>
   <button id="printBtn" class="btn">🖨 Печать</button>
  </div>
  <div class="actions" style="margin-top:10px">
   <button id="newBtn" class="btn primary">↻ Новый филворд</button>
   <button id="settingsBtn" class="btn">⚙ Настройки</button>
  </div>
  <p class="game-help" id="gameHelp">Веди пальцем или мышью по соседним клеткам. Можно вернуться на шаг назад по той же линии.</p>
 </div></div>`;
    const board = $('board');
    board.style.gridTemplateColumns = `repeat(${state.W}, minmax(0,1fr))`;
    state.cells = [];
    for (let r = 0; r < state.H; r++) {
        const row = [];
        for (let c = 0; c < state.W; c++) {
            const el = document.createElement('div');
            el.className = 'cell';
            el.dataset.r = r;
            el.dataset.c = c;
            el.textContent = state.grid[r][c];
            board.append(el);
            row.push(el);
        }
        state.cells.push(row);
    }
    if (cfg.showList) {
        const list = $('wordList');
        [...state.placed].sort((a, b) => b.word.length - a.word.length || a.word.localeCompare(b.word, 'ru')).forEach(p => {
            const el = document.createElement('span');
            el.className = 'word';
            el.dataset.word = p.word;
            el.textContent = p.word;
            list.append(el);
        });
    }
    $('hintBtn').onclick = useHint;
    $('pauseBtn').onclick = () => setPause(!state.paused);
    $('finishBtn').onclick = () => finishGame(false);
    $('printBtn').onclick = () => doPrint(state, cfg.printAnswers);
    $('newBtn').onclick = startGame;
    $('settingsBtn').onclick = showSettings;
    attachEvents(board);
    requestAnimationFrame(fitBoard);
}
function fitBoard() {
    const board = $('board');
    if (!board || !board.firstElementChild)
        return;
    const width = board.firstElementChild.getBoundingClientRect().width;
    board.style.setProperty('--fs', `${Math.max(9, Math.min(isBaby() ? 48 : 30, width * (isBaby() ? .57 : .52)))}px`);
}
window.addEventListener('resize', fitBoard);
function isAdjacent(a, b) {
    const dr = b[0] - a[0], dc = b[1] - a[1];
    if (isBaby())
        return getBabyDirectionSpec().dirs.some(d => d[0] === dr && d[1] === dc);
    return cfg.diag ? Math.abs(dr) <= 1 && Math.abs(dc) <= 1 && Math.abs(dr) + Math.abs(dc) > 0 : Math.abs(dr) + Math.abs(dc) === 1;
}
function containsCell(path, cell) { return path.some(p => p[0] === cell[0] && p[1] === cell[1]); }
function isFoundCell([r, c]) { return state.foundPaths.some(p => p.cells.some(q => q[0] === r && q[1] === c)); }
function resetSelection() {
    if (!state)
        return;
    state.selection = [];
    document.querySelectorAll('.cell.sel').forEach(el => el.classList.remove('sel'));
}
function moveTo(cell) {
    if (!state || state.paused || state.ended || isFoundCell(cell))
        return;
    const sel = state.selection, last = sel[sel.length - 1];
    if (!last) {
        sel.push(cell);
        updateSelection();
        return;
    }
    if (last[0] === cell[0] && last[1] === cell[1])
        return;
    if (sel.length >= 2) {
        const before = sel[sel.length - 2];
        if (before[0] === cell[0] && before[1] === cell[1]) {
            sel.pop();
            updateSelection();
            return;
        }
    }
    if (isAdjacent(last, cell) && !containsCell(sel, cell)) {
        if (isBaby() && getBabyDirectionSpec().straight && sel.length >= 2) {
            const prev = sel[sel.length - 2];
            if (cell[0] - last[0] !== last[0] - prev[0] || cell[1] - last[1] !== last[1] - prev[1])
                return;
        }
        sel.push(cell);
        updateSelection();
    }
}
function updateSelection() {
    if (!state)
        return;
    state.cells.flat().forEach(c => c.classList.remove('sel'));
    state.selection.forEach(([r, c]) => state.cells[r][c].classList.add('sel'));
}
function attachEvents(board) {
    board.addEventListener('pointerdown', e => {
        if (!state || state.paused || state.ended || pointerID !== null)
            return;
        const cell = e.target.closest('.cell');
        if (!cell)
            return;
        e.preventDefault();
        initAudio();
        pointerID = e.pointerId;
        resetSelection();
        if (!isFoundCell([+cell.dataset.r, +cell.dataset.c]))
            moveTo([+cell.dataset.r, +cell.dataset.c]);
        try {
            board.setPointerCapture(pointerID);
        }
        catch (err) { }
    });
    board.addEventListener('pointermove', e => {
        if (!state || state.paused || state.ended || pointerID !== e.pointerId)
            return;
        const hit = document.elementFromPoint(e.clientX, e.clientY);
        const cell = hit?.closest?.('.cell');
        if (!cell || !board.contains(cell))
            return;
        moveTo([+cell.dataset.r, +cell.dataset.c]);
    });
    board.addEventListener('pointerup', e => {
        if (pointerID !== e.pointerId)
            return;
        pointerID = null;
        try {
            board.releasePointerCapture(e.pointerId);
        }
        catch (err) { }
        finishSelection();
    });
    board.addEventListener('pointercancel', () => { pointerID = null; resetSelection(); });
    board.addEventListener('lostpointercapture', () => { if (pointerID !== null) {
        pointerID = null;
        resetSelection();
    } });
}
function pathEquals(a, b) {
    if (a.length !== b.length)
        return false;
    const direct = a.every((p, i) => p[0] === b[i][0] && p[1] === b[i][1]);
    const backward = a.every((p, i) => p[0] === b[b.length - 1 - i][0] && p[1] === b[b.length - 1 - i][1]);
    return direct || backward;
}
function finishSelection() {
    if (!state || state.paused || state.ended)
        return;
    const selected = state.selection.slice();
    resetSelection();
    if (selected.length < 2)
        return; // одиночный клик больше не оставляет подсветку
    // Только реально проложенный путь слова, не случайный набор тех же букв.
    const placement = state.placed.find(p => !state.found.has(p.word) && pathEquals(p.cells, selected));
    if (placement) {
        markFound(placement);
        return;
    }
    const cells = selected.map(([r, c]) => state.cells[r][c]);
    cells.forEach(el => el.classList.add('bad'));
    sfxWrong();
    later(() => cells.forEach(el => el.classList.remove('bad')), 360);
}
function markFound(placement) {
    if (!state || state.found.has(placement.word))
        return;
    const idx = state.found.size;
    state.found.add(placement.word);
    state.foundPaths.push(placement);
    const [bg, fg] = PALETTE[idx % PALETTE.length];
    placement.cells.forEach(([r, c]) => {
        const el = state.cells[r][c];
        el.classList.add('found');
        el.style.setProperty('--wc', bg);
        el.style.setProperty('--wcb', fg);
    });
    document.querySelectorAll('.word').forEach(el => {
        if (el.dataset.word === placement.word)
            el.classList.add('done');
    });
    addScore(10);
    sfxCorrect();
    $('foundCount').textContent = state.found.size;
    if (state.found.size === state.placed.length)
        later(() => finishGame(true), 480);
}
function useHint() {
    if (!state || state.paused || state.ended)
        return;
    const left = state.placed.filter(p => !state.found.has(p.word));
    if (!left.length)
        return;
    const placement = left[rnd(left.length)];
    const [r, c] = placement.cells[0], el = state.cells[r][c];
    el.classList.add('hint');
    later(() => el.classList.remove('hint'), 1350);
    state.hints++;
    addScore(-10);
    $('hintCount').textContent = state.hints;
}
function finishGame(completed) {
    if (!state || state.ended)
        return;
    state.elapsed = elapsedMs();
    state.paused = true;
    state.ended = true;
    clearTimers();
    pointerID = null;
    const seconds = Math.floor(state.elapsed / 1000);
    const stars = state.hints >= 3 ? 1 : state.hints >= 1 ? 2 : 3;
    const bonus = completed ? stars * 20 : 0;
    if (bonus) {
        addScore(bonus);
        sfxWin();
    }
    gameEl.innerHTML = `<div class="panel result" style="max-width:780px;margin:auto">
  <div class="result-emoji">${completed ? '🏆' : '📋'}</div>
  <h2>${completed ? 'Все слова найдены!' : 'Занятие завершено'}</h2>
  <p>Найдено <b>${state.found.size} из ${state.placed.length}</b> слов · Время ${fmtTime(seconds)} · Подсказок ${state.hints}</p>
  ${completed ? `<div class="result-stars">${'⭐'.repeat(stars)}${'☆'.repeat(3 - stars)}</div><p>Бонус: +${bonus} очков</p>` : ''}
  <div class="actions"><button class="btn primary" id="againBtn">↻ Ещё раз</button><button class="btn" id="printResult">🖨 Распечатать</button><button class="btn" id="settingsResult">⚙ Настройки</button></div>
 </div>`;
    $('againBtn').onclick = startGame;
    $('printResult').onclick = () => doPrint(state, true);
    $('settingsResult').onclick = showSettings;
}
/* ===== Печать: передаём готовый пазл, повторная генерация отсутствует ===== */
function printContent(puzzle, withAnswers) {
    const { grid, W, H, placed } = puzzle;
    const category = activeCategory();
    const colored = new Map();
    if (withAnswers)
        placed.forEach((p, i) => p.cells.forEach(([r, c]) => colored.set(key(r, c), PRINT_PALETTE[i % PRINT_PALETTE.length])));
    const side = isBaby() ? Math.max(44, Math.min(72, Math.floor(635 / Math.max(W, H)))) : Math.max(20, Math.min(38, Math.floor(635 / Math.max(W, H))));
    let cells = '';
    for (let r = 0; r < H; r++)
        for (let c = 0; c < W; c++) {
            cells += `<div class="p-cell" style="width:${side}px;height:${side}px;font-size:${Math.max(11, Math.round(side * .52))}px;background:${colored.get(key(r, c)) || '#fff'}">${grid[r][c]}</div>`;
        }
    const ordered = [...placed].sort((a, b) => a.word.localeCompare(b.word, 'ru'));
    const words = ordered.map(p => `<span class="p-word">${p.word}</span>`).join('');
    const legend = withAnswers ? `<div class="p-legend">${placed.map((p, i) => `<span><i style="background:${PRINT_PALETTE[i % PRINT_PALETTE.length]}"></i>${p.word}</span>`).join('')}</div>` : '';
    return `<h1>${isBaby() ? 'Филворд для малышей' : 'Филворд'} · ${category.name}</h1><p class="sub">${isBaby() ? getBabyDirectionSpec().description : 'Найди все слова. Маршрут может поворачивать' + (cfg.diag ? ' и идти по диагонали' : '') + '.'}</p>
 <p class="meta">Слов: ${placed.length} · Сетка ${W}×${H} ${withAnswers ? '· ОТВЕТЫ' : ''}</p>
 <div class="p-grid" style="grid-template-columns:repeat(${W},${side}px)">${cells}</div>
 <h2>Найди слова</h2><div class="p-words">${words}</div>${legend}<footer>NeuroX · © verner</footer>`;
}
function doPrint(puzzle, withAnswers) {
    if (!puzzle)
        return;
    const w = window.open('', '_blank');
    if (!w) {
        alert('Разреши всплывающие окна для печати.');

 <style>*{box-sizing:border-box}body{margin:0;color:#202c40;font:13pt Arial,sans-serif;padding:8mm}h1{text-align:center;color:#1E3F8A;font-size:21pt;margin:0 0 3mm}h2{font-size:12pt;color:#1E3F8A;margin:6mm 0 2mm}.sub{text-align:center;font-size:10pt;margin:0 0 3mm}.meta{text-align:center;font-size:9pt;color:#607086}.p-grid{display:grid;gap:1px;width:max-content;margin:6mm auto}.p-cell{border:1px solid #374359;display:flex;align-items:center;justify-content:center;line-height:1;font-weight:700}.p-words{display:flex;flex-wrap:wrap;gap:3mm 7mm}.p-word{font-size:11pt;border-bottom:1px dotted #999;white-space:nowrap}.p-legend{display:flex;flex-wrap:wrap;gap:2mm 4mm;border-top:1px solid #ddd;margin-top:5mm;padding-top:3mm;font-size:9pt}.p-legend span{display:flex;gap:2mm;align-items:center}.p-legend i{width:4mm;height:4mm;border:1px solid #444;display:inline-block}footer{text-align:right;margin-top:8mm;color:#6c7a90;font-size:8pt}@page{size:A4;margin:10mm}@media print{body{padding:0}*{-webkit-print-color-adjust:exact;print-color-adjust:exact}}</style>
 </head><body>${printContent(puzzle, withAnswers)}<script>window.addEventListener('load',()=>setTimeout(()=>window.print(),300));<\/script></body></html>`;
    w.document.open();
    w.document.write(html);
    w.document.close();
}
