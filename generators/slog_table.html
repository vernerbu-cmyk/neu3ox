<!DOCTYPE html>
<html lang="ru">
<head>
<script src="../shared/theme.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Слоговые таблицы — NeuroX</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --blue: #1E3F8A; --blue-light: #2A56C6; --blue-pale: #E8EEF9;
    --orange: #FF6A00; --orange-soft: #FF8B3D; --orange-dark: #C85100;
    --bg: #F4F6FB; --text: #24324B; --text-dim: #6B7280;
    --border: rgba(30,63,138,.10); --panel: #FFFFFF;
    --header-shadow: rgba(30,63,138,.25);
    --dot-color: rgba(30,63,138,.07);
    --overlay: rgba(30,63,138,.45);
    --cell-bg: #FFFFFF;
    --cell-border: rgba(30,63,138,.18);
    --header-h: 80px;
    
    --vowel-red: #d32f2f;
    --cons-blue: #1d4e89;
    --soft-green: #2e9e2e;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: "Nunito Sans", sans-serif;
    background-color: var(--bg);
    background-image: radial-gradient(circle, var(--dot-color) 1.5px, transparent 1.6px);
    background-size: 26px 26px;
    color: var(--text);
    min-height: 100vh;
  }

  .hidden { display: none !important; }

  /* ===== HEADER ===== */
  header {
    position: sticky; top: 0; width: 100%;
    background: linear-gradient(135deg, #152E68 0%, #1E3F8A 60%, #2A4A99 100%);
    color: #fff; padding: 10px 16px; z-index: 1000;
    box-shadow: 0 6px 20px var(--header-shadow);
  }
  .header-top { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
  .brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .logo {
    position: relative; width: 40px; height: 40px;
    display: flex; align-items: center; justify-content: center;
    background: transparent; border: none; padding: 0;
    color: #FF8B3D; cursor: pointer; transition: transform .2s;
  }
  .logo svg { width: 30px; height: 30px; display: block; }
  .logo::after {
    content: '←'; position: absolute; top: -2px; left: -4px;
    width: 18px; height: 18px; display: flex; align-items: center; justify-content: center;
    background: #FF6A00; color: #fff; font-size: 11px; font-weight: 800;
    border-radius: 50%; box-shadow: 0 2px 6px rgba(0,0,0,.3); pointer-events: none;
  }
  .logo:hover { transform: scale(1.08); }
  h1 {
    margin: 0; font-family: "Fredoka", sans-serif;
    font-size: 18px; font-weight: 700; letter-spacing: .3px; line-height: 1.1;
  }
  .subtitle { font-size: 11px; opacity: .85; font-weight: 600; }
  .header-buttons { display: flex; gap: 6px; }
  .icon-btn {
    width: 38px; height: 38px; border: none; border-radius: 12px;
    background: rgba(255,255,255,.18); color: #fff; cursor: pointer;
    transition: .22s; display: flex; align-items: center; justify-content: center; padding: 0;
  }
  .icon-btn svg { width: 19px; height: 19px; }
  .icon-btn:hover { background: var(--orange); transform: translateY(-2px) rotate(6deg) scale(1.06); }
  .icon-btn:active { transform: scale(.95); }

  /* ===== SETTINGS ===== */
  .settings {
    margin-top: 10px;
    display: flex; flex-wrap: wrap; gap: 10px 12px; align-items: flex-end;
    max-height: 1500px; overflow: hidden;
    transition: max-height .3s ease, opacity .25s ease, margin .25s ease;
    opacity: 1;
  }
  .settings.collapsed { max-height: 0; opacity: 0; margin-top: 0; pointer-events: none; }
  
  .field { display: flex; flex-direction: column; gap: 4px; flex: 1 1 140px; min-width: 120px; }
  .field.wide { flex: 1 1 300px; max-width: none; }
  .field.full { flex: 1 1 100%; max-width: none; }
  .field label {
    display: flex; justify-content: space-between; align-items: center;
    font-size: 11px; font-weight: 800; color: rgba(255,255,255,.9);
    letter-spacing: .2px; padding-left: 2px;
  }
  .field label .val { color: #FFB37A; font-size: 11px; font-weight: 800; }

  select, input[type="text"] {
    width: 100%; padding: 8px 10px;
    border-radius: 8px; border: 2px solid transparent;
    font-family: inherit; font-size: 13px; font-weight: 700;
    background: var(--panel); color: var(--blue);
    cursor: pointer; outline: none; transition: .18s;
  }
  select:focus, input[type="text"]:focus { border-color: var(--orange); }
  input[type="range"] { width: 100%; accent-color: var(--orange); height: 22px; margin: 0; }

  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chips label {
    display: inline-flex; align-items: center; gap: 5px;
    padding: 5px 10px; border-radius: 8px; border: 2px solid transparent;
    background: var(--panel); color: var(--text-dim);
    font-size: 12px; font-weight: 800; cursor: pointer; transition: .15s;
  }
  .chips label:hover { border-color: var(--orange-soft); }
  .chips label:has(input:checked) {
    background: var(--orange); color: #fff; border-color: var(--orange-dark);
  }
  .chips input { display: none; }

  .toggle-chips { display: flex; flex-wrap: wrap; gap: 6px; padding: 2px 0; }
  .toggle-chip {
    padding: 7px 14px; border-radius: 8px; border: 2px solid transparent;
    background: var(--panel); color: var(--text-dim);
    font-family: inherit; font-size: 12px; font-weight: 800;
    cursor: pointer; transition: .15s;
  }
  .toggle-chip:hover { border-color: var(--orange-soft); }
  .toggle-chip.on { background: var(--orange); color: #fff; border-color: var(--orange-dark); }

  /* ===== GAME LAYOUT / PREVIEW ===== */
  .game-layout {
    display: flex; flex-direction: column; gap: 14px; margin: 14px; align-items: center;
  }
  
  .field-wrapper {
    background: var(--panel);
    border: 2px solid var(--border);
    border-radius: 16px;
    padding: 14px;
    box-shadow: 0 4px 0 rgba(30,63,138,.08), 0 10px 20px rgba(30,63,138,.06);
    overflow-x: auto;
    width: 100%;
    max-width: 1000px;
    display: flex;
    justify-content: center;
  }

  /* A4 sheet styles merged with panel design */
  .sheet-wrap { display: flex; flex-direction: column; align-items: center; gap: 24px; }
  .sheet {
    background: var(--panel);
    box-shadow: 0 6px 20px rgba(0,0,0,.1);
    display: flex; flex-direction: column;
    border: 1px solid var(--border);
  }
  .sheet.portrait { width: 210mm; height: 297mm; padding: 12mm; }
  .sheet.landscape { width: 297mm; height: 210mm; padding: 12mm; }
  
  
  /* ЦЕНТРИРОВАНИЕ И РАСТЯГИВАНИЕ */
  .sheet-content {
    flex: 1; 
    display: flex; 
    flex-direction: column; 
    gap: 8mm;
    min-height: 0; 
    justify-content: center; 
    align-items: center;
    padding-bottom: 0;
  }
  /* Единый блок таблицы; каждая группа колонок центрируется независимо. */
  .table-block {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 1mm;
    max-width: 100%;
    margin: 0 auto;
  }
  .table-block-title { font-size: 10pt; font-weight: 800; color: var(--text); text-align: center; }
  
  .grid {
    display: grid; gap: 1mm; font-family: "Nunito Sans", sans-serif; font-weight: 800; line-height: 1;
    justify-content: center; align-content: center;
    margin: 0 auto;
  }
  .cell {
    font-size: 1em; font-weight: 800; font-family: inherit;
    display: flex; align-items: center; justify-content: center;
    border: 1px solid var(--border); border-radius: 2mm;
    overflow: hidden; white-space: nowrap;
    background: var(--panel); color: var(--text);
  }
  .cell.header { background: var(--blue-pale); border-color: var(--blue); color: var(--blue); }
  .cell.vowel { background: var(--blue-pale); border-color: var(--orange); color: var(--orange-dark); }
  .cell.corner { border: none; background: transparent; }
  .cell.unreadable { background: rgba(0,0,0,.05); border-color: transparent; color: transparent; }
  
  .l-vowel { color: var(--vowel-red); }
  .l-cons  { color: var(--cons-blue); }
  .l-soft  { color: var(--soft-green); }


  /* Единая таблица: подписи осей и незаполненные ячейки */
  .cell.grid-label { font-size: 1em; letter-spacing: normal; padding: 1mm; text-align: center; }
  .cell.grid-spacer { background: transparent; border: 1px solid transparent; }

  .empty-msg { display: flex; align-items: center; justify-content: center; flex: 1; color: var(--text); opacity: .4; font-size: 16pt; font-weight: 600; }
  
  .cards-grid { flex: 1; display: flex; flex-wrap: wrap; gap: 3mm; justify-content: center; align-content: center; }
  .card {
    display: flex; align-items: center; justify-content: center;
    border: 2px solid var(--border); border-radius: 3mm;
    background: var(--panel); color: var(--text); font-weight: 800;
    padding: 1.5mm; white-space: nowrap; line-height: 1.1;
  }

  /* ===== ACTION BAR ===== */
  .action-bar { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin: 0 14px 30px; }
  .btn {
    padding: 10px 20px; border: none; border-radius: 10px;
    font-family: inherit; font-size: 13px; font-weight: 800; cursor: pointer; transition: .18s;
  }
  .btn:active { transform: scale(.97); }
  .btn-primary { background: var(--orange); color: #fff; box-shadow: 0 3px 0 var(--orange-dark); }
  .btn-primary:hover { background: var(--orange-soft); }
  .btn-blue { background: var(--blue); color: #fff; box-shadow: 0 3px 0 #102a63; }
  .btn-blue:hover { background: var(--blue-light); }
  .btn-secondary { background: var(--panel); color: var(--blue); border: 2px solid var(--border); }
  .btn-secondary:hover { border-color: var(--orange); color: var(--orange-dark); }

  #verner { position: fixed; right: 12px; bottom: 6px; font-size: 11px; font-weight: 600; color: var(--text-dim); opacity: .8; pointer-events: none; }

  /* ===== PRINT ===== */
  @page { margin: 0; }
  @media print {
    body { background: #fff !important; background-image: none !important; color: #000 !important; }
    header, .action-bar, #verner, .settings { display: none !important; }
    .game-layout { margin: 0 !important; display: block !important; }
    .field-wrapper { padding: 0 !important; border: none !important; box-shadow: none !important; background: transparent !important; }
    .sheet-wrap { padding: 0; gap: 0; }
    .sheet { box-shadow: none; page-break-after: always; border: none; background: #fff !important;
      transform: none !important; margin-bottom: 0 !important; }
    .sheet:last-child { page-break-after: auto; }
    .cell { border-color: #ccc !important; color: #000 !important; background: #fff !important; }
    .cell.header, .cell.vowel { background: #f0f0f0 !important; border-color: #999 !important; color: #000 !important; }
    * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  }
  
  @media screen and (max-width: 900px) {
    .sheet { transform: scale(0.8); transform-origin: top center; margin-bottom: -50px; }
  }
  @media screen and (max-width: 640px) {
    .sheet { transform: scale(0.55); margin-bottom: -120px; }
    .field-wrapper { padding: 10px; border-radius: 12px; }
  }
</style>

<body>

<header id="panel">
  <div class="header-top">
    <div class="brand">
      <button class="logo" onclick="goBack()" title="Назад" aria-label="Назад">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M15.5 13a3.5 3.5 0 0 0 -3.5 3.5v1a3.5 3.5 0 0 0 7 0v-1.8"/>
          <path d="M8.5 13a3.5 3.5 0 0 1 3.5 3.5v1a3.5 3.5 0 0 1 -7 0v-1.8"/>
          <path d="M17.5 16a3.5 3.5 0 0 0 0 -7h-.5"/>
          <path d="M19 9.3v-2.8a3.5 3.5 0 0 0 -7 0"/>
          <path d="M6.5 16a3.5 3.5 0 0 1 0 -7h.5"/>
          <path d="M5 9.3v-2.8a3.5 3.5 0 0 1 7 0v10"/>
        </svg>
      </button>
      <div>
        <h1>Слоговые таблицы</h1>
        <div class="subtitle">NeuroX · генератор чтения</div>
      </div>
    </div>
    <div class="header-buttons">
      <button class="icon-btn" id="toggleBtn" title="Свернуть настройки" aria-label="Свернуть настройки">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3"/>
          <path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.9.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/>
        </svg>
      </button>
    </div>
  </div>

  <div class="settings" id="settingsGrid">
    <div class="field wide">
      <label>Тип таблицы</label>
      <div class="chips" id="typeChips">
        <label title="МА, МО, МУ..."><input type="checkbox" name="tableType" value="CV" checked> Открытый</label>
        <label title="АМ, ОМ, УМ..."><input type="checkbox" name="tableType" value="VC"> Закрытый</label>
        <label title="МАЛЬ, МЪ..."><input type="checkbox" name="tableType" value="C_SIGN"> С ь / ъ</label>
        <label title="КРА, БЛО..."><input type="checkbox" name="tableType" value="CCV"> Сочетания</label>
        <label title="МАМ, МОЛ..."><input type="checkbox" name="tableType" value="CVC"> С гласной в центре</label>
      </div>
    </div>
    
    <div class="field" style="max-width:180px;">
      <label title="Приблизительный объём. Изменение ползунка подбирает новый набор букв.">≈ Слогов <span class="val" id="countVal">70</span></label>
      <input type="range" id="countRange" min="5" max="200" step="5" value="70">
    </div>

    <div class="field">
      <label>Действия</label>
      <div class="toggle-chips">
        <button class="toggle-chip" id="randomBtn" title="Случайные слоги">🎲 Случайно</button>
        <button class="toggle-chip" id="shuffleToggle">🔀 Порядок</button>
      </div>
    </div>

    <div class="field full">
      <label>Параметры листа</label>
      <div class="toggle-chips">
        <button class="toggle-chip on" id="autoFitToggle">📐 Автозаполнение</button>
        <button class="toggle-chip" id="cardsToggle">✂️ Карточки</button>
        <button class="toggle-chip on" id="hideUnreadableToggle">👁 Скрывать нечитаемые</button>
        <button class="toggle-chip on" id="softColorToggle">🟢 Мягкие зелёным</button>
        <button class="toggle-chip on" id="colorLettersToggle">🔴🟦 Красить буквы</button>
      </div>
    </div>

    <div class="field full">
      <label>Согласные (строки)</label>
      <div class="chips" id="consonantsChips"></div>
      <div class="row" style="display:flex; gap:6px; margin-top:4px;">
        <button class="toggle-chip" style="padding:4px 8px; font-size:10px;" data-cons="sonorous" title="М, Н, Л, Р, Й">Сонорные</button>
        <button class="toggle-chip" style="padding:4px 8px; font-size:10px;" data-cons="paired" title="Парные по звонкости и глухости: Б–П, В–Ф, Г–К, Д–Т, Ж–Ш, З–С">Парные</button>
        <button class="toggle-chip" style="padding:4px 8px; font-size:10px;" data-cons="voiced" title="Б, В, Г, Д, Ж, З, Й, Л, М, Н, Р (включая сонорные)">Звонкие</button>
        <button class="toggle-chip" style="padding:4px 8px; font-size:10px;" data-cons="voiceless" title="К, П, С, Т, Ф, Х, Ц, Ч, Ш, Щ">Глухие</button>
        <button class="toggle-chip" style="padding:4px 8px; font-size:10px;" data-cons="hushing" title="Ж, Ш, Ч, Щ, Ц">Шипящие и Ц</button>
        <button class="toggle-chip" style="padding:4px 8px; font-size:10px;" data-cons="hard" title="Всегда твёрдые: Ж, Ш, Ц">Твёрдые</button>
        <button class="toggle-chip" style="padding:4px 8px; font-size:10px;" data-cons="soft" title="Всегда мягкие: Ч, Щ, Й">Мягкие</button>
        <button class="toggle-chip" style="padding:4px 8px; font-size:10px;" data-cons="all">Выбрать всё</button>
        <button class="toggle-chip" style="padding:4px 8px; font-size:10px;" data-cons="clear">Снять всё</button>
      </div>
    </div>

    <div class="field full">
      <label>Гласные (столбцы)</label>
      <div class="chips" id="vowelsChips"></div>
      <div class="row" style="display:flex; gap:6px; margin-top:4px;">
        <button class="toggle-chip" style="padding:4px 8px; font-size:10px;" data-vow="hard">Твёрдые</button>
        <button class="toggle-chip" style="padding:4px 8px; font-size:10px;" data-vow="soft">Мягкие</button>
        <button class="toggle-chip" style="padding:4px 8px; font-size:10px;" data-vow="all">Все</button>
        <button class="toggle-chip" style="padding:4px 8px; font-size:10px;" data-vow="clear">Снять</button>
      </div>
    </div>

    <div class="field wide hidden" id="ccvFieldset">
      <label>Сочетания согласных</label>
      <div class="chips" id="clustersChips"></div>
      <div class="row" style="display:flex; gap:6px; margin-top:4px;">
        <button class="toggle-chip" style="padding:4px 8px; font-size:10px;" data-clusters="common">Частые</button>
        <button class="toggle-chip" style="padding:4px 8px; font-size:10px;" data-clusters="all">Все</button>
        <button class="toggle-chip" style="padding:4px 8px; font-size:10px;" data-clusters="clear">Снять</button>
      </div>
    </div>

    <div class="field wide hidden" id="endConsFieldset">
      <label>Конечные согласные</label>
      <div class="chips" id="endConsonantsChips"></div>
      <div class="row" style="display:flex; gap:6px; margin-top:4px;">
        <button class="toggle-chip" style="padding:4px 8px; font-size:10px;" data-endcons="voiced">Звонкие</button>
        <button class="toggle-chip" style="padding:4px 8px; font-size:10px;" data-endcons="voiceless">Глухие</button>
        <button class="toggle-chip" style="padding:4px 8px; font-size:10px;" data-endcons="all">Все</button>
      </div>
    </div>

    <div class="field wide hidden" id="signFieldset">
      <label>Знаки и разделительные сочетания</label>
      <div class="chips" id="signsChips"></div>
      <div class="row" style="display:flex; flex-wrap:wrap; gap:6px; margin-top:4px;">
        <button class="toggle-chip" style="padding:4px 8px; font-size:10px;" data-signs="simple">Обычный Ь</button>
        <button class="toggle-chip" style="padding:4px 8px; font-size:10px;" data-signs="soft-separator" title="ЬЕ, ЬЁ, ЬЮ, ЬЯ, ЬИ">Разделительный Ь</button>
        <button class="toggle-chip" style="padding:4px 8px; font-size:10px;" data-signs="hard-separator" title="ЪЕ, ЪЁ, ЪЮ, ЪЯ">Разделительный Ъ</button>
        <button class="toggle-chip" style="padding:4px 8px; font-size:10px;" data-signs="all">Все</button>
        <button class="toggle-chip" style="padding:4px 8px; font-size:10px;" data-signs="clear">Снять</button>
      </div>
    </div>

  </div>
</header>

  <div class="field-wrapper">
    <div class="sheet-wrap" id="sheetWrap"></div>
  </div>
</div>

  <button class="btn btn-primary" id="printBtn">🖨️ Печать / PDF</button>
  <button class="btn btn-blue" id="copyLinkBtn">🔗 Скопировать ссылку</button>
  <button class="btn btn-secondary" id="copyPngBtn">📋 Копировать в PNG</button>
  <button class="btn btn-secondary" id="savePngBtn">💾 Сохранить в PNG</button>
</div>

<script>
/* ===== ШАПКА ===== */
function goBack() {
  history.length > 1 ? history.back() : (location.href = '../index.html');
}
document.getElementById('toggleBtn').onclick = () => {
  document.getElementById('settingsGrid').classList.toggle('collapsed');
};
/* ===== ЛОГИКА ГЕНЕРАТОРА СЛОГОВ ===== */
(() => {
  const ALL_CONSONANTS = ['Б','В','Г','Д','Ж','З','Й','К','Л','М','Н','П','Р','С','Т','Ф','Х','Ц','Ч','Ш','Щ'];
  const DEFAULT_CONSONANTS = ['М','Н','П','Б','Т','Д','К','Г','В','Ф','Л','Р','С','З'];
  const SONOROUS_CONSONANTS = ['М', 'Н', 'Л', 'Р', 'Й'];
  const PAIRED_CONSONANTS = ['Б', 'П', 'В', 'Ф', 'Г', 'К', 'Д', 'Т', 'Ж', 'Ш', 'З', 'С']; // по звонкости/глухости
  const HUSHING_CONSONANTS = ['Ж', 'Ш', 'Ч', 'Щ', 'Ц']; // шипящие и Ц
  const ALWAYS_HARD_PRESET = ['Ж', 'Ш', 'Ц'];
  const ALWAYS_SOFT_PRESET = ['Ч', 'Щ', 'Й'];
  const VOICED_CONSONANTS = ['Б', 'В', 'Г', 'Д', 'Ж', 'З', 'Й', 'Л', 'М', 'Н', 'Р'];
  const VOICELESS_CONSONANTS = ['К', 'П', 'С', 'Т', 'Ф', 'Х', 'Ц', 'Ч', 'Ш', 'Щ'];

  const SOFT_VOWELS = ['Я','Ё','Ю','И','Е'];
  const DEFAULT_VOWELS = HARD_VOWELS;

  const VOWELS_CHARS = new Set(ALL_VOWELS);

  // После разделительного Ь в школьных таблицах возможны Е, Ё, Ю, Я, И.
  const SOFT_SEPARATOR_SIGNS = ['ЬЕ', 'ЬЁ', 'ЬЮ', 'ЬЯ', 'ЬИ'];
  const HARD_SEPARATOR_SIGNS = ['ЪЕ', 'ЪЁ', 'ЪЮ', 'ЪЯ'];
  const ALL_SIGNS = ['Ь', ...SOFT_SEPARATOR_SIGNS, ...HARD_SEPARATOR_SIGNS];
  // Сохраняем прежнее начальное поведение, пока педагог не выберет новые сочетания.
  const DEFAULT_SIGNS = ['Ь', ...HARD_SEPARATOR_SIGNS];

  const CC_CLUSTERS = [
    'БЛ','БР','ВЛ','ВР','ГЛ','ГР','ДР','ЖД','ЗЛ','ЗР',

  const DEFAULT_CLUSTERS = ['БЛ','БР','ВР','ГР','ДР','КЛ','КР','ПЛ','ПР','СК','СЛ','СН','СП','СТ','ТР','ФЛ'];
  const COMMON_CLUSTERS  = ['БР','ГР','ДР','КР','ПР','ТР','СП','СТ','СН','СЛ','КЛ','ПЛ'];

  const UNREADABLE_COMBOS = new Set([

    'ЦЯ','ЦЮ','ЦЁ',
    'ЧЫ','ЧЭ','ЧЯ','ЧЮ','ЧО',
    'ЩЫ','ЩЭ','ЩЯ','ЩЮ','ЩО'
  ]);

  const ALWAYS_SOFT_CONS = ['Ч', 'Щ', 'Й'];
  const ALWAYS_HARD_CONS = ['Ж', 'Ш', 'Ц'];
  const SOFTENING = ['Я', 'Ё', 'Ю', 'И', 'Е', 'Ь'];

  const TYPE_NAMES = {
    'CV': 'Открытый слог',
    'VC': 'Закрытый слог',
    'C_SIGN': 'С ь / ъ',
    'CCV': 'Сочетание согласных + гласная',
    'CVC': 'Слог с гласной посередине'
  };

  // Подгоняем размер надписи под фактическую ширину сочетания.
  // Нужна и для карточек, и для табличных ячеек: ВЬЮ, СЪЁ, ЩЬИ длиннее МА.
  const textMeasureCtx = document.createElement('canvas').getContext('2d');
  function fitTextFontMm(text, baseFontMm, availableWidthMm) {
    if (!text || !textMeasureCtx) return baseFontMm;
    textMeasureCtx.font = '800 100px "Nunito Sans", sans-serif';
    const measuredWidth = textMeasureCtx.measureText(text).width;
    if (!measuredWidth) return baseFontMm;
    // Измерение сделано при размере 100px. При одинаковом масштабе
    // отношение ширины текста к кеглю не зависит от единиц (px или мм).
    return Math.min(baseFontMm, availableWidthMm * 100 / measuredWidth * 0.97);
  }

  const GAP_MM = 1;
  const HEADER_HEIGHT_MM = 0;
  const SHEET_PADDING_MM = 12;
  const AUTO_MIN_MM = 8;

  const state = {
    types: ['CV'],
    consonants: new Set(DEFAULT_CONSONANTS),
    vowels: new Set(DEFAULT_VOWELS),
    endConsonants: new Set(SONOROUS_CONSONANTS),
    signs: new Set(DEFAULT_SIGNS),

    activeConsPairs: new Set(),
    activeVowPairs: new Set(),
    cellWidthMm: 26,

    autoFit: true,

    softColor: true,

    orientation: 'portrait',
    displayMode: 'table'
  };

  const sheetWrap = document.getElementById('sheetWrap');
  const consonantsChips = document.getElementById('consonantsChips');
  const vowelsChips = document.getElementById('vowelsChips');
  const endConsonantsChips = document.getElementById('endConsonantsChips');
  const signsChips = document.getElementById('signsChips');
  const clustersChips = document.getElementById('clustersChips');
  
  const ccvFieldset = document.getElementById('ccvFieldset');
  const endConsFieldset = document.getElementById('endConsFieldset');
  const signFieldset = document.getElementById('signFieldset');
  
  const countRange = document.getElementById('countRange');
  const countVal = document.getElementById('countVal');
  const randomBtn = document.getElementById('randomBtn');
  const shuffleToggle = document.getElementById('shuffleToggle');
  const autoFitToggle = document.getElementById('autoFitToggle');
  const cardsToggle = document.getElementById('cardsToggle');
  const hideUnreadableToggle = document.getElementById('hideUnreadableToggle');
  const softColorToggle = document.getElementById('softColorToggle');
  const colorLettersToggle = document.getElementById('colorLettersToggle');
  const copyLinkBtn = document.getElementById('copyLinkBtn');
  const toast = document.getElementById('toast');

  const sortRu = arr => [...arr].sort((a, b) => a.localeCompare(b, 'ru'));
  const shuffle = arr => [...arr].sort(() => Math.random() - 0.5);

  function showToast(msg) {
    toast.textContent = msg;
    toast.classList.add('visible');
    toast.style.transform = 'translateX(-50%) translateY(0)';

      toast.classList.remove('visible');
      toast.style.transform = 'translateX(-50%) translateY(100px)';
      toast.style.opacity = '0';
    }, 2000);
  }

  function getSheetDimensions() {
    if (state.orientation === 'landscape') return { w: 297, h: 210 };
    return { w: 210, h: 297 };
  }

  function isReadable(combo) {
    // Проверяем буквосочетания не только целиком, но и внутри длинных слогов.
    return ![...UNREADABLE_COMBOS].some(part => combo.includes(part));
  }

  function isConsonantSoftAt(text, i) {
    const ch = text[i];
    if (ALWAYS_SOFT_CONS.includes(ch)) return true;
    if (ALWAYS_HARD_CONS.includes(ch)) return false;
    for (let j = i + 1; j < text.length; j++) {
      const n = text[j];
      if (n === 'Ъ') return false;
      if (n === 'Ь') return true;
      if (VOWELS_CHARS.has(n)) return SOFTENING.includes(n);
    }
    return false;
  }

  function renderSyllableHTML(text) {
    const escapeHTML = ch => ch.replaceAll('&', '&amp;').replaceAll('<', '&lt;')
      .replaceAll('>', '&gt;').replaceAll('"', '&quot;').replaceAll("'", '&#39;');
    if (!state.colorLetters) return escapeHTML(text);
    let html = '';
    for (let i = 0; i < text.length; i++) {
      const ch = text[i];
      let cls;
      if (VOWELS_CHARS.has(ch)) {
        cls = 'l-vowel';
      } else if (ch === 'Ь') {
        cls = state.softColor ? 'l-soft' : 'l-cons';
      } else if (ch === 'Ъ') {
        cls = 'l-cons';
      } else if (state.softColor && isConsonantSoftAt(text, i)) {
        cls = 'l-soft';
      } else {
        cls = 'l-cons';
      }
      html += `<span class="${cls}">${escapeHTML(ch)}</span>`;
    }
    return html;
  }

  function makeChip(text, checked, onToggle) {
    const label = document.createElement('label');
    const input = document.createElement('input');
    input.type = 'checkbox';
    input.checked = checked;
    input.addEventListener('change', () => onToggle(input.checked, input));
    label.appendChild(input);
    label.appendChild(document.createTextNode(text));
    return label;
  }

  function updateUIForType() {
    const types = state.types;
    signFieldset.classList.toggle('hidden', !types.includes('C_SIGN'));
    ccvFieldset.classList.toggle('hidden', !types.includes('CCV'));
    endConsFieldset.classList.toggle('hidden', !types.includes('CVC'));
  }

  function renderConsonantChips() {
    consonantsChips.innerHTML = '';
    ALL_CONSONANTS.forEach(ch => {
      consonantsChips.appendChild(makeChip(ch, state.consonants.has(ch), (checked, input) => {
        if (checked) state.consonants.add(ch);
        else {
          if (state.consonants.size <= 1) { input.checked = true; return; }
          state.consonants.delete(ch);
        }
        render();
      }));
    });
  }

  function renderVowelChips() {

      }));

  function renderEndConsonantChips() {

    ALL_CONSONANTS.forEach(ch => {
      endConsonantsChips.appendChild(makeChip(ch, state.endConsonants.has(ch), (checked, input) => {

        else {

      }));

  function renderSignChips() {

    ALL_SIGNS.forEach(ch => {

        else state.signs.delete(ch);

  function renderClusterChips() {

    CC_CLUSTERS.forEach(cl => {
      clustersChips.appendChild(makeChip(cl, state.clusters.has(cl), (checked, input) => {

        else {
          if (state.clusters.size <= 1) { input.checked = true; return; }
          state.clusters.delete(cl);
        }
        render();
      }));
    });

  function computeCellSize(colsCount, rowsCount, numTables = 1) {
    const { w: SHEET_W, h: SHEET_H } = getSheetDimensions();
    const usableW = SHEET_W - SHEET_PADDING_MM * 2;

    const extraHeight = (numTables - 1) * 8 + (numTables > 1 ? numTables * 6 : 0);
    const usableH = SHEET_H - SHEET_PADDING_MM * 2 - HEADER_HEIGHT_MM - extraHeight;

    const maxW = (usableW - GAP_MM * (colsCount - 1)) / colsCount;
    const maxH = (usableH - GAP_MM * (rowsCount - 1)) / rowsCount;

    let W, H;

    if (state.autoFit) {
      // Берем максимум доступного пространства
      W = maxW;
      H = maxH;
      
      // Ограничитель пропорций, чтобы клетки не были слишком вытянутыми
      const aspect = W / H;
      if (aspect > 1.6) W = H * 1.6;
      if (aspect < 0.7) H = W / 0.7;
    } else {
      W = state.cellWidthMm;
      H = W * 0.62;
      if (W > maxW) { W = maxW; H = W * 0.62; }
      if (H > maxH) { H = maxH; W = Math.min(maxW, H / 0.62); }
    }

    return { W, H };
  }

  function getMaxRowsPerPage(cellH, numTables = 1) {
    const { h: SHEET_H } = getSheetDimensions();
    const extraHeight = (numTables - 1) * 8 + (numTables > 1 ? numTables * 6 : 0);
    const usableH = SHEET_H - SHEET_PADDING_MM * 2 - HEADER_HEIGHT_MM - extraHeight;
    const rows = Math.floor((usableH + GAP_MM) / (cellH + GAP_MM));
    return Math.max(1, rows);
  }

  function setSyllableCount(target) {
    let bestCols = 5, bestRows = 5;
    let bestDiff = Infinity;

    for (let cols = 2; cols <= 22; cols++) {
      for (let rows = 2; rows <= 11; rows++) {
        const syllables = (cols - 1) * (rows - 1);
        const diff = Math.abs(syllables - target);

        const aspectRatio = (rows - 1) / (cols - 1);
        const targetRatio = 2.29;
        const ratioPenalty = Math.abs(aspectRatio - targetRatio) * 10;

        const score = diff + ratioPenalty;

        if (score < bestDiff) {
          bestDiff = score;
          bestCols = cols;
          bestRows = rows;
        }
      }
    }

    const consCount = bestCols - 1;
    const vowCount = bestRows - 1;

    state.consonants = new Set(ALL_CONSONANTS.slice(0, consCount));
    state.vowels = new Set(ALL_VOWELS.slice(0, vowCount));

    renderConsonantChips();
    renderVowelChips();
    render();
  }

  function randomSyllables() {
    const consCount = Math.floor(Math.random() * 8) + 5;
    const vowCount = Math.floor(Math.random() * 5) + 3;

    const shuffledCons = shuffle([...ALL_CONSONANTS]).slice(0, consCount);
    const shuffledVows = shuffle([...ALL_VOWELS]).slice(0, vowCount);

    state.consonants = new Set(shuffledCons);
    state.vowels = new Set(shuffledVows);

    renderConsonantChips();
    renderVowelChips();
    render();
  }

  // Все выбранные типы выводим на общих листах; оси всегда фиксированы.
  // Любая выбранная гласная может стоять перед Й, в том числе ЁЙ. После Й допустимы только А, О, У, Е.
  const VOWELS_AFTER_Y = new Set(['А','О','У','Е']);
  const MAX_DATA_COLUMNS = 9;

  function makeUnifiedRows() {
    const result = [];
    const vowelsBase = ALL_VOWELS.filter(v => state.vowels.has(v));
    const consonantsBase = sortRu([...state.consonants].filter(c => c !== 'Й'));
    const hasY = state.consonants.has('Й');
    const vowels = state.shuffle ? shuffle(vowelsBase) : vowelsBase;
    const consonants = state.shuffle ? shuffle(consonantsBase) : consonantsBase;
    const open = state.types.includes('CV');
    const closed = state.types.includes('VC');

    function pushHeader(label, values, alphabet = 'vowel') {
      result.push({ kind: 'head', label, values, alphabet });
    }
    function pushRow(label, values) {
      if (values.some(Boolean)) result.push({ kind: 'data', label, values });
    }
    const chunk = (arr, n = MAX_DATA_COLUMNS) => {
      const chunks = [];
      for (let i = 0; i < arr.length; i += n) chunks.push(arr.slice(i, i + n));
      return chunks;
    };

    if ((open || closed) && vowels.length && (consonants.length || hasY)) {
      // ФИКСИРОВАННЫЕ ОСИ: согласные всегда слева, гласные всегда сверху.
      // Не меняем местами строки и столбцы в зависимости от числа выбранных букв.
      // При 10 гласных разбиваем таблицу на два блока, сохраняя ориентацию.
      const allCons = [...consonants, ...(hasY ? ['Й'] : [])];
      chunk(vowels).forEach(group => {
        pushHeader('', group);
        allCons.forEach(c => {
          if (open) {
            pushRow(c, group.map(v => c === 'Й'
              ? (VOWELS_AFTER_Y.has(v) ? 'Й' + v : '')
              : c + v));
          }
          if (closed) {
            pushRow(c, group.map(v => v + c));
          }
        });
      });
    }

    if (state.types.includes('C_SIGN')) {
      const signs = ALL_SIGNS.filter(v => state.signs.has(v));
      const cons = state.shuffle ? shuffle(consonantsBase) : consonantsBase;
      chunk(signs).forEach(group => {
        pushHeader('Ь / Ъ', group);
        cons.forEach(c => pushRow(c, group.map(s => c + s)));
      });
    }

    if (state.types.includes('CCV')) {
      const clustersBase = CC_CLUSTERS.filter(c => state.clusters.has(c));
      const clusters = state.shuffle ? shuffle(clustersBase) : clustersBase;
      chunk(vowels).forEach(group => {
        pushHeader('СС + Г', group);
        clusters.forEach(c => pushRow(c, group.map(v => c + v)));
      });
    }

    if (state.types.includes('CVC')) {
      // СГС: по-прежнему согласная слева и гласная сверху.
      // Разные конечные согласные показываем отдельными блоками: …М, …Н и т. д.
      const endingsBase = sortRu([...state.endConsonants]);
      const endings = state.shuffle ? shuffle(endingsBase) : endingsBase;
      endings.forEach(end => {
        chunk(vowels).forEach(group => {
          pushHeader('…' + end, group);
          consonants.forEach(c => pushRow(c, group.map(v => c + v + end)));
        });
      });
    }

    // Убираем заголовки пустых секций.
    return result.filter((row, i, rows) =>
      row.kind !== 'head' || (rows[i + 1] && rows[i + 1].kind === 'data')
    );
  }

  function render() {
    sheetWrap.innerHTML = '';

    if (state.types.length === 0) {
      renderMessage('Выберите хотя бы один тип таблицы');
      return;
    }
    if (state.displayMode === 'cards') {
      renderCardsMode();
    } else {
      renderTableMode();
    }
  }

  function renderMessage(message) {
    const sheet = createSheet();
    const content = document.createElement('div');
    content.className = 'sheet-content';
    const msg = document.createElement('div');
    msg.className = 'empty-msg';
    msg.textContent = message;
    content.appendChild(msg);
    sheet.appendChild(content);
    sheetWrap.appendChild(sheet);
  }

  function paginateRows(rows, capacity) {
    const pages = [];
    let current = [];
    let lastHeader = null;
    rows.forEach(row => {
      if (row.kind === 'head') lastHeader = row;
      if (current.length >= capacity || (row.kind === 'head' && current.length >= capacity - 1)) {
        if (current.length) pages.push(current);
        current = row.kind === 'data' && lastHeader ? [lastHeader] : [];
      }
      current.push(row);
    });
    if (current.length) pages.push(current);
    return pages;
  }

  function renderTableMode() {
    const allRows = makeUnifiedRows();
    if (!allRows.some(r => r.kind === 'data' && r.values.some(v => v && (!state.hideUnreadable || isReadable(v))))) {
      renderMessage('Для выбранных букв нет подходящих слогов');
      return;
    }

    const colCount = 1 + Math.max(1, ...allRows.map(r => r.values.length));
    // Не ужимаем десятки строк в микроскопические клетки: продолжаем таблицу на след. листе.
    const maxRows = state.orientation === 'landscape' ? 10 : 17;
    const pages = paginateRows(allRows, maxRows);
    // Один размер клеток и шрифта на ВСЕХ страницах одного набора.
    // Иначе короткая последняя страница получает более крупные буквы.
    const sizes = pages.map(rows => computeCellSize(colCount, rows.length, 1));
    const cellW = Math.min(...sizes.map(size => size.W), state.autoFit ? 36 : Infinity);
    const cellH = Math.min(...sizes.map(size => size.H), state.autoFit ? 24 : Infinity);
    pages.forEach(rows => {
      const sheet = createSheet();
      const content = document.createElement('div');
      content.className = 'sheet-content';
      content.appendChild(buildUnifiedTable(rows, colCount, cellW, cellH));
      sheet.appendChild(content);
      sheetWrap.appendChild(sheet);
    });
  }

  function buildUnifiedTable(rows, colCount, W, H) {
    // На одном листе остаётся один блок, но ширина каждой секции зависит
    // от числа её столбцов. Короткие секции больше не прижаты к левому краю.
    const block = document.createElement('div');
    block.className = 'table-block';
    let group = [];
    const sections = [];
    rows.forEach(row => {
      if (row.kind === 'head' && group.length) {
        sections.push(group);
        group = [];
      }
      group.push(row);
    });
    if (group.length) sections.push(group);

    sections.forEach(section => {
      const sectionCols = Math.max(1, ...section.map(r => r.values.length)) + 1;
      const grid = document.createElement('div');
      grid.className = 'grid';
      grid.style.gridTemplateColumns = `repeat(${sectionCols}, ${W.toFixed(3)}mm)`;
      grid.style.gridTemplateRows = `repeat(${section.length}, ${H.toFixed(3)}mm)`;
      grid.style.gap = GAP_MM + 'mm';
      grid.style.fontSize = Math.min(W, H, 18) * 0.45 + 'mm';

      function addCell(value, className, isSyllable = false) {
        const cell = document.createElement('div');
        cell.className = className;
        if (value) {
          if (isSyllable && state.hideUnreadable && !isReadable(value)) {
            cell.className = 'cell unreadable';
          } else {
            cell.innerHTML = renderSyllableHTML(value);
            // Даже четырёхбуквенные сочетания не выходят за границы ячейки.
            const baseFontMm = Math.min(W, H, 18) * 0.45;
            cell.style.fontSize = fitTextFontMm(value, baseFontMm, W - 2) + 'mm';
          }
        }
        grid.appendChild(cell);
      }

      section.forEach(row => {
        addCell(row.label, 'cell header grid-label');
        for (let i = 0; i < sectionCols - 1; i++) {
          const value = row.values[i] || '';
          if (i >= row.values.length) {
            addCell('', 'cell grid-spacer');
          } else {
            addCell(value, row.kind === 'head' ?
              (row.alphabet === 'consonant' ? 'cell header' : 'cell header vowel') :
              (value ? 'cell' : 'cell grid-spacer'), row.kind === 'data');
          }
        }
      });
      block.appendChild(grid);
    });
    return block;
  }

  function renderCardsMode() {
    let allSyllables = [];
    // Карточки используют ту же логику, что и общая таблица.
    const unique = new Set();
    makeUnifiedRows().forEach(row => {
      if (row.kind !== 'data') return;
      row.values.forEach(syllable => {
        if (syllable && (!state.hideUnreadable || isReadable(syllable)) && !unique.has(syllable)) {
          unique.add(syllable);
          allSyllables.push(syllable);
        }
      });
    });

    if (state.shuffle) {
      allSyllables = shuffle(allSyllables);
    }

    const { w: SHEET_W, h: SHEET_H } = getSheetDimensions();
    const usableW = SHEET_W - SHEET_PADDING_MM * 2;
    const usableH = SHEET_H - SHEET_PADDING_MM * 2 - HEADER_HEIGHT_MM;

    const cardW = Math.min(40, Math.max(20, usableW / 5));
    const cardH = cardW * 1.2;

    const maxCardsPerPage = Math.max(1,
      Math.floor(usableW / (cardW + 3)) * Math.floor(usableH / (cardH + 3))
    );

    if (allSyllables.length === 0) {
      const sheet = createSheet();
      const content = document.createElement('div');
      content.className = 'sheet-content';
      const msg = document.createElement('div');
      msg.className = 'empty-msg';
      msg.textContent = 'Нет слогов для отображения';
      content.appendChild(msg);
      sheet.appendChild(content);
      sheetWrap.appendChild(sheet);
      return;
    }

    const cardChunks = [];
    for (let i = 0; i < allSyllables.length; i += maxCardsPerPage) {
      cardChunks.push(allSyllables.slice(i, i + maxCardsPerPage));
    }

    cardChunks.forEach((chunk, pageIndex) => {
      const sheet = createSheet();
      const cardsGrid = document.createElement('div');
      cardsGrid.className = 'cards-grid';

      chunk.forEach(syllable => {
        const card = document.createElement('div');
        card.className = 'card';
        card.style.width = cardW.toFixed(2) + 'mm';
        card.style.height = cardH.toFixed(2) + 'mm';
        // Длинные слоги уменьшаются индивидуально, короткие остаются крупными.
        const readableWidthMm = cardW - 5; // поля, рамка, запас от краёв
        card.style.fontSize = fitTextFontMm(syllable, cardW * 0.4, readableWidthMm).toFixed(2) + 'mm';
        card.textContent = syllable;
        cardsGrid.appendChild(card);
      });

      sheet.appendChild(cardsGrid);

      sheetWrap.appendChild(sheet);
    });
  }

  function createSheet() {
    const sheet = document.createElement('div');
    sheet.className = `sheet ${state.orientation}`;
    return sheet;
  }

  function stateToUrl() {
    const params = new URLSearchParams();
    params.set('types', state.types.join(','));
    if (state.consonants.size)    params.set('cons',    [...state.consonants].join(''));
    if (state.vowels.size)        params.set('vow',     [...state.vowels].join(''));
    if (state.endConsonants.size) params.set('endcons', [...state.endConsonants].join(''));
    if (state.signs.size)         params.set('signs',   [...state.signs].join(','));
    if (state.clusters.size)      params.set('clusters',[...state.clusters].join(','));
    params.set('shuffle', state.shuffle ? '1' : '0');
    params.set('autoFit', state.autoFit ? '1' : '0');
    params.set('targetCount', state.targetCount);
    params.set('hideUnreadable', state.hideUnreadable ? '1' : '0');
    params.set('softColor', state.softColor ? '1' : '0');
    params.set('colorLetters', state.colorLetters ? '1' : '0');
    params.set('orientation', state.orientation);
    params.set('displayMode', state.displayMode);
    return window.location.pathname + '?' + params.toString();
  }

  function loadStateFromUrl() {
    const params = new URLSearchParams(window.location.search);
    if (params.has('types')) {
      const t = params.get('types').split(',').filter(Boolean);
      state.types = t.filter(x => Object.hasOwn(TYPE_NAMES, x));
    }
    if (params.has('cons')) {
      const c = params.get('cons').split('').filter(Boolean);
      state.consonants = new Set(c.filter(x => ALL_CONSONANTS.includes(x)));
    }
    if (params.has('vow')) {
      const v = params.get('vow').split('').filter(Boolean);
      state.vowels = new Set(v.filter(x => ALL_VOWELS.includes(x)));
    }
    if (params.has('endcons')) {
      const e = params.get('endcons').split('').filter(Boolean);
      state.endConsonants = new Set(e.filter(x => ALL_CONSONANTS.includes(x)));
    }
    if (params.has('signs')) {
      const s = params.get('signs').split(',').filter(Boolean);
      state.signs = new Set(s.filter(x => ALL_SIGNS.includes(x)));
    }
    if (params.has('clusters')) {
      const cl = params.get('clusters').split(',').filter(Boolean);
      state.clusters = new Set(cl.filter(x => CC_CLUSTERS.includes(x)));
    }
    if (params.has('shuffle')) state.shuffle = params.get('shuffle') === '1';
    if (params.has('autoFit')) state.autoFit = params.get('autoFit') === '1';
    if (params.has('targetCount')) {
      const tc = parseInt(params.get('targetCount'), 10);
      if (!isNaN(tc)) state.targetCount = tc;
    }
    if (params.has('hideUnreadable')) state.hideUnreadable = params.get('hideUnreadable') === '1';
    if (params.has('softColor')) state.softColor = params.get('softColor') === '1';
    if (params.has('colorLetters')) state.colorLetters = params.get('colorLetters') === '1';
    if (params.has('orientation') && ['portrait','landscape'].includes(params.get('orientation')))
      state.orientation = params.get('orientation');
    if (params.has('displayMode') && ['cards','table'].includes(params.get('displayMode')))
      state.displayMode = params.get('displayMode');
  }

  // Event Listeners
  document.getElementById('typeChips').addEventListener('change', (e) => {
    if (e.target.name === 'tableType') {
      const checkedBoxes = document.querySelectorAll('[name="tableType"]:checked');
      state.types = Array.from(checkedBoxes).map(cb => cb.value);
      updateUIForType();
      render();
    }
  });

  shuffleToggle.addEventListener('click', () => {
    state.shuffle = !state.shuffle;
    shuffleToggle.classList.toggle('on', state.shuffle);
    render();
  });

  autoFitToggle.addEventListener('click', () => {
    state.autoFit = !state.autoFit;
    autoFitToggle.classList.toggle('on', state.autoFit);
    render();
  });

  cardsToggle.addEventListener('click', () => {
    state.displayMode = state.displayMode === 'cards' ? 'table' : 'cards';
    cardsToggle.classList.toggle('on', state.displayMode === 'cards');
    render();
  });

  hideUnreadableToggle.addEventListener('click', () => {
    state.hideUnreadable = !state.hideUnreadable;
    hideUnreadableToggle.classList.toggle('on', state.hideUnreadable);
    render();
  });

  softColorToggle.addEventListener('click', () => {
    state.softColor = !state.softColor;
    softColorToggle.classList.toggle('on', state.softColor);
    render();
  });

  colorLettersToggle.addEventListener('click', () => {
    state.colorLetters = !state.colorLetters;
    colorLettersToggle.classList.toggle('on', state.colorLetters);
    render();
  });

  countRange.addEventListener('input', e => {
    state.targetCount = parseInt(e.target.value, 10);
    countVal.textContent = state.targetCount;
    setSyllableCount(state.targetCount);
  });

  randomBtn.addEventListener('click', () => {
    randomSyllables();
  });

  copyLinkBtn.addEventListener('click', () => {
    const url = new URL(stateToUrl(), window.location.href).href;
    navigator.clipboard.writeText(url).then(() => {
      showToast('Ссылка скопирована!');
    }).catch(() => {
      showToast('Не удалось скопировать');
    });
  });

  document.querySelectorAll('[data-cons]').forEach(btn => {
    btn.addEventListener('click', () => {
      const mode = btn.dataset.cons;
      const presets = {
        sonorous: SONOROUS_CONSONANTS,
        paired: PAIRED_CONSONANTS,
        voiced: VOICED_CONSONANTS,
        voiceless: VOICELESS_CONSONANTS,
        hushing: HUSHING_CONSONANTS,
        hard: ALWAYS_HARD_PRESET,
        soft: ALWAYS_SOFT_PRESET,
        all: ALL_CONSONANTS,
        clear: []
      };
      const letters = presets[mode];
      if (!letters) return;
      state.consonants = new Set(letters);
      renderConsonantChips();
      render();
    });
  });

  document.querySelectorAll('[data-vow]').forEach(btn => {
    btn.addEventListener('click', () => {
      const mode = btn.dataset.vow;
      state.vowels.clear();
      if (mode === 'hard') HARD_VOWELS.forEach(v => state.vowels.add(v));
      else if (mode === 'soft') SOFT_VOWELS.forEach(v => state.vowels.add(v));
      else if (mode === 'all') ALL_VOWELS.forEach(v => state.vowels.add(v));
      renderVowelChips();
      render();
    });
  });

  document.querySelectorAll('[data-endcons]').forEach(btn => {
    btn.addEventListener('click', () => {
      const mode = btn.dataset.endcons;
      state.endConsonants.clear();
      if (mode === 'voiced') VOICED_CONSONANTS.forEach(c => state.endConsonants.add(c));
      else if (mode === 'voiceless') VOICELESS_CONSONANTS.forEach(c => state.endConsonants.add(c));
      else if (mode === 'all') ALL_CONSONANTS.forEach(c => state.endConsonants.add(c));
      renderEndConsonantChips();
      render();
    });
  });

  document.querySelectorAll('[data-clusters]').forEach(btn => {
    btn.addEventListener('click', () => {
      const mode = btn.dataset.clusters;
      state.clusters.clear();
      if (mode === 'all') CC_CLUSTERS.forEach(c => state.clusters.add(c));
      else if (mode === 'common') COMMON_CLUSTERS.forEach(c => state.clusters.add(c));
      renderClusterChips();
      render();
    });
  });

  document.querySelectorAll('[data-signs]').forEach(btn => {
    btn.addEventListener('click', () => {
      const presets = {
        simple: ['Ь'],
        'soft-separator': SOFT_SEPARATOR_SIGNS,
        'hard-separator': HARD_SEPARATOR_SIGNS,
        all: ALL_SIGNS,
        clear: []
      };
      state.signs = new Set(presets[btn.dataset.signs]);
      renderSignChips();
      render();
    });
  });

  document.getElementById('printBtn').addEventListener('click', () => window.print());

  // === PNG Export ===
  // Многостраничные таблицы сохраняются единым PNG (листы друг под другом).
  const captureSheets = async () => {
    if (!window.html2canvas) {
      showToast('Не удалось загрузить библиотеку PNG. Используйте Печать / PDF.');
      throw new Error('html2canvas не загружен');
    }
    const sheets = [...document.querySelectorAll('.sheet')];
    if (!sheets.length) throw new Error('Нет листов');
    // Нельзя создавать бесконечно высокий canvas: у браузера есть лимит пикселей.
    const scale = 2;
    // В мобильном предпросмотре лист уменьшен transform:scale(...),
    // но PNG должен содержать полноценный лист A4, без обрезки.
    const expectedH = sheets.reduce((sum, sheet) => sum + Math.ceil(sheet.offsetHeight * scale), 0);
    const expectedW = Math.max(...sheets.map(sheet => Math.ceil(sheet.offsetWidth * scale)));
    if (expectedH > 30000 || expectedW * expectedH > 45000000) {
      showToast('Для большой таблицы используйте Печать / PDF.');
      throw new Error('Слишком много листов для одного PNG');
    }
    const result = document.createElement('canvas');
    result.width = expectedW;
    result.height = expectedH;
    const ctx = result.getContext('2d');
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, result.width, result.height);
    let y = 0;
    for (const sheet of sheets) {
      const img = await html2canvas(sheet, {
        scale, useCORS: true, backgroundColor: '#ffffff',
        onclone: doc => {
          doc.querySelectorAll('.sheet').forEach(page => {
            page.style.transform = 'none';
            page.style.marginBottom = '0';
          });
        }
      });
      ctx.drawImage(img, Math.floor((result.width - img.width) / 2), y);
      y += img.height;
    }
    return result;
  };

  document.getElementById('copyPngBtn').addEventListener('click', async () => {
    try {
      const canvas = await captureSheets();
      canvas.toBlob(blob => {
        if (!blob) { showToast('Ошибка создания PNG'); return; }
        try {
          const item = new ClipboardItem({ 'image/png': blob });
          navigator.clipboard.write([item]).then(() => {
            showToast('PNG скопирован!');
          }).catch(() => showToast('Браузер не разрешил копировать PNG'));
        } catch (e) { showToast('Копирование PNG не поддерживается'); }
      }, 'image/png');
    } catch (e) { console.error(e); }
  });

  document.getElementById('savePngBtn').addEventListener('click', async () => {
    try {
      const canvas = await captureSheets();
      const a = document.createElement('a');
      a.href = canvas.toDataURL('image/png');
      a.download = 'slogi.png';
      a.click();
      showToast('PNG сохранён: ' + document.querySelectorAll('.sheet').length + ' лист(ов)');
    } catch (e) { console.error(e); }
  });

  // Init
  loadStateFromUrl();
  document.querySelectorAll('[name="tableType"]').forEach(cb => {
    cb.checked = state.types.includes(cb.value);
  });
  
  if (state.shuffle) shuffleToggle.classList.add('on');
  if (!state.autoFit) autoFitToggle.classList.remove('on');
  if (state.displayMode === 'cards') cardsToggle.classList.add('on');
  if (!state.hideUnreadable) hideUnreadableToggle.classList.remove('on');
  if (!state.softColor) softColorToggle.classList.remove('on');
  if (!state.colorLetters) colorLettersToggle.classList.remove('on');

  updateUIForType();
  renderConsonantChips();
  renderVowelChips();
  renderEndConsonantChips();
  renderSignChips();
  renderClusterChips();
  
  countRange.value = state.targetCount;
  countVal.textContent = state.targetCount;

  render();
  // Если веб-шрифт загрузится позже первого рендера, пересчитать ширины
  // с настоящими метриками, чтобы экспорт и печать не обрезали буквы.
  if (document.fonts && document.fonts.ready) {
    document.fonts.ready.then(() => render()).catch(() => {});
  }
})();
</script>
