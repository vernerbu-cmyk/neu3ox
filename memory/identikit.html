<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Фоторобот - Мнемо-Арена</title>
<style>
  :root {
    --blue: #2D6CDF;
    --blue-dark: #1E4FA8;
    --blue-light: #EBF2FF;
    --orange: #FF8C42;
    --orange-dark: #E86E1F;
    --orange-light: #FFF2E5;
    --bg: #F7F9FC;
    --text: #1F2937;
    --text-muted: #6B7280;
    --border: #E5EAF2;
    --green: #22C55E;
    --red: #EF4444;
    --yellow: #F59E0B;
    --purple: #A855F7;
    --purple-light: #F5EDFF;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  body {
    font-family: -apple-system, 'Segoe UI', Roboto, 'Nunito Sans', sans-serif;
    background: var(--bg);
    min-height: 100vh;
    color: var(--text);
    padding: 16px;
    overflow-x: hidden;
  }

  .container { max-width: 800px; margin: 0 auto; }

  header {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 20px; padding: 16px 22px;
    background: #fff; border-radius: 20px;
    border: 1px solid var(--border);
    box-shadow: 0 4px 16px rgba(45,108,223,.06);
    flex-wrap: wrap; gap: 10px;
  }

  .back-btn {
    width: 46px; height: 46px;
    border: none; border-radius: 14px;
    background: var(--blue-light);
    color: var(--blue);
    font-size: 22px; font-weight: 700;
    cursor: pointer; transition: .18s;
    display: flex; align-items: center; justify-content: center;
  }
  .back-btn:hover { background: var(--blue); color: #fff; transform: translateY(-1px); }

  h1 { font-size: 20px; letter-spacing: .5px; color: var(--blue-dark); font-weight: 800; }

  .score-bar {
    background: var(--orange); color: #fff;
    padding: 8px 18px; border-radius: 30px; font-size: 14px;
    font-weight: 700;
    box-shadow: 0 4px 12px rgba(255,140,66,.3);
  }
  .score-bar span { color: #fff; font-weight: 800; font-size: 17px; }

  main { min-height: 520px; }

  .game-header { text-align: center; margin-bottom: 20px; }
  .game-header h2 { font-size: 22px; margin-bottom: 6px; color: var(--blue-dark); font-weight: 800; }
  .subtitle { font-size: 14px; color: var(--text-muted); font-weight: 600; }

  .status {
    text-align: center; font-size: 16px; margin: 16px 0;
    min-height: 26px; font-weight: 700; color: var(--text); transition: .3s;
  }
  .status.good { color: #16A34A; }
  .status.bad { color: #DC2626; }
  .status.warn { color: var(--orange-dark); }

  .panel {
    background: #fff; border: 1px solid var(--border);
    border-radius: 22px; padding: 26px;
    box-shadow: 0 8px 24px rgba(45,108,223,.06);
  }

  /* ---------- Пресеты ---------- */
  .presets {
    display: flex; gap: 8px; margin-bottom: 22px; flex-wrap: wrap;
  }
  .preset-btn {
    flex: 1 1 auto; min-width: 90px;
    padding: 10px 8px;
    border-radius: 12px;
    border: 2px solid var(--border);
    background: #fff;
    color: var(--blue-dark);
    font-weight: 700;
    font-size: 13px;
    cursor: pointer;
    transition: .18s;
    font-family: inherit;
  }
  .preset-btn:hover { border-color: var(--orange); color: var(--orange-dark); transform: translateY(-1px); }
  .preset-btn.active { background: var(--blue); border-color: var(--blue); color: #fff; }

  /* ---------- Настройки ---------- */
  .settings-row {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 10px; font-size: 15px; color: var(--text); font-weight: 700;
  }
  .settings-row b { color: var(--blue-dark); font-size: 16px; font-weight: 800; }
  input[type="range"] { width: 100%; accent-color: #FF8C42; height: 26px; }

  .time-hint {
    text-align: center;
    font-size: 13px;
    color: var(--text-muted);
    font-weight: 700;
    padding: 10px;
    background: var(--blue-light);
    border-radius: 10px;
    margin-top: 6px;
  }
  .time-hint b { color: var(--blue-dark); }

  /* ---------- Показ преступника ---------- */
  .criminal-show {
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
  }

  .criminal-show svg {
    max-width: 240px;
    animation: popIn .4s cubic-bezier(.34,1.56,.64,1);
  }

  @keyframes popIn {
    from { transform: scale(0); opacity: 0; }
    to { transform: scale(1); opacity: 1; }
  }

  /* ---------- Варианты ответов ---------- */
  .options {
    display: grid;
    gap: 14px;
    margin-top: 20px;
  }

  .face-option {
    background: #fff;
    border: 3px solid var(--border);
    border-radius: 18px;
    padding: 8px;
    cursor: pointer;
    transition: .15s;
    display: flex;
    justify-content: center;
    align-items: center;
    position: relative;
  }

  .face-option:hover {
    border-color: var(--blue);
    background: var(--blue-light);
    transform: translateY(-3px);
    box-shadow: 0 12px 24px rgba(45,108,223,.15);
  }

  .face-option svg {
    width: 100%;
    max-width: 180px;
    height: auto;
  }

  .face-option.correct {
    border-color: var(--green);
    background: #DCFCE7;
    animation: pulseGreen .5s ease;
  }

  .face-option.wrong {
    border-color: var(--red);
    background: #FEE2E2;
    animation: shake .4s ease;
  }

  .face-option.dimmed {
    opacity: .35;
  }

  @keyframes pulseGreen {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.05); }
  }

  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    20% { transform: translateX(-8px); }
    40% { transform: translateX(8px); }
    60% { transform: translateX(-5px); }
    80% { transform: translateX(5px); }
  }

  /* Метка "ты выбрал" */
  .face-option .badge {
    position: absolute;
    top: 6px;
    right: 6px;
    padding: 4px 10px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: 800;
    color: #fff;
    background: var(--red);
    display: none;
  }
  .face-option.wrong .badge {
    display: block;
  }
  .face-option.correct .badge {
    display: block;
    background: var(--green);
    content: '✓';
  }

  /* ---------- Таймер ---------- */
  .timer-bar {
    height: 10px; border-radius: 10px; background: var(--border);
    overflow: hidden; margin-bottom: 20px;
  }
  .timer-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--green), var(--yellow), var(--red));
    transition: width 0.5s linear;
    width: 100%;
  }

  /* ---------- Кнопки ---------- */
  .btn-main {
    display: block; margin: 24px auto 0; padding: 16px 40px;
    border-radius: 14px; border: none;
    background: var(--orange); color: #fff;
    font-size: 17px; font-weight: 800; cursor: pointer;
    transition: .2s; letter-spacing: .5px;
    box-shadow: 0 8px 20px rgba(255,140,66,.3);
    font-family: inherit;
  }
  .btn-main:hover {
    background: var(--orange-dark);
    transform: translateY(-2px);
    box-shadow: 0 12px 28px rgba(255,140,66,.4);
  }
  .btn-main:active { transform: translateY(0); }

  .btn-secondary {
    display: block; margin: 8px auto 0; padding: 12px 30px;
    border-radius: 14px; border: none;
    background: transparent; color: var(--blue-dark);
    font-size: 15px; font-weight: 700; cursor: pointer;
    transition: .2s;
    font-family: inherit;
  }
  .btn-secondary:hover { background: var(--blue-light); }

  /* ---------- Результат ---------- */
  .result-screen { text-align: center; padding: 20px 0; }
  .result-screen .big {
    font-size: 72px; margin-bottom: 12px;
    animation: popIn .5s cubic-bezier(.34,1.56,.64,1);
  }
  .result-screen h2 { font-size: 26px; margin-bottom: 10px; color: var(--blue-dark); font-weight: 800; }
  .result-screen p { color: var(--text-muted); font-size: 16px; margin: 6px 0; font-weight: 600; }
  .stars { font-size: 40px; margin: 20px 0; letter-spacing: 6px; }

  /* Карточка с описанием признаков */
  .features-card {
    margin-top: 20px;
    padding: 16px;
    background: rgba(45,108,223,.05);
    border-radius: 14px;
    text-align: left;
  }
  .features-card h3 {
    font-size: 13px;
    color: var(--text-muted);
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 10px;
    text-align: center;
  }
  .features-list {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px 16px;
    font-size: 14px;
    font-weight: 600;
  }
  .features-list .feat {
    display: flex;
    gap: 8px;
    align-items: baseline;
  }
  .features-list .feat-name {
    color: var(--text-muted);
    font-weight: 700;
    white-space: nowrap;
  }
  .features-list .feat-value {
    color: var(--blue-dark);
    font-weight: 800;
  }

  @media (max-width: 500px) {
    .preset-btn { font-size: 12px; }
    .features-list { grid-template-columns: 1fr; }
  }
</style>
<link rel="stylesheet" href="../assets/menu-drawer.css">
</head>
<body>
<div class="container">
  <header>
    <button class="back-btn" onclick="location.href='index.html'">←</button>
    <h1>🕵️ ФОТОРОБОТ</h1>
    <div class="score-bar">Очки: <span id="globalScore">0</span></div>
  </header>
  <main id="game"></main>
</div>

<script>
/* ============ УТИЛИТЫ ============ */
const $ = id => document.getElementById(id);
const gameEl = $('game');
let globalScore = 0;
$('globalScore').textContent = globalScore;
function addScore(n) { globalScore += n; $('globalScore').textContent = globalScore; }

function shuffle(a) {
  const arr = [...a];
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}
const rand = n => Math.floor(Math.random() * n);

let timeouts = [];
function wait(ms, fn) {
  const id = setTimeout(fn, ms);
  timeouts.push(id);
  return id;
}
function clearTimeouts() {
  timeouts.forEach(clearTimeout);
  timeouts = [];
}

let audioCtx = null;
function initAudio() {
  if (!audioCtx) {
    try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) {}
  }
}
function beep(freq, dur = 0.15, type = 'sine', vol = 0.08) {
  if (!audioCtx) return;
  try {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.type = type;
    osc.frequency.value = freq;
    const t = audioCtx.currentTime;
    gain.gain.setValueAtTime(vol, t);
    gain.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    osc.start(t); osc.stop(t + dur + 0.02);
  } catch(e) {}
}
function sfxCorrect() { beep(660, 0.1); setTimeout(() => beep(880, 0.15), 90); }
function sfxWrong() { beep(180, 0.3, 'sawtooth', 0.12); }
function sfxClick() { beep(440, 0.05, 'triangle', 0.06); }
function sfxWin() {
  [523, 659, 784, 1047].forEach((f, i) => setTimeout(() => beep(f, 0.2), i * 120));
}

/* ============ ПРИЗНАКИ ЛИЦА ============ */
const FEATURES = {
  skin: {
    name: 'Кожа',
    values: ['светлая', 'тёплая', 'смуглая', 'тёмная']
  },
  hairColor: {
    name: 'Цвет волос',
    values: ['чёрный', 'каштановый', 'рыжий', 'блонд', 'седой', 'синий']
  },
  hairStyle: {
    name: 'Причёска',
    values: ['короткая', 'длинная', 'лысый']
  },
  glasses: {
    name: 'Очки',
    values: ['нет', 'круглые', 'квадратные', 'солнечные']
  },
  mustache: {
    name: 'Усы',
    values: ['нет', 'тонкие', 'густые']
  },
  beard: {
    name: 'Борода',
    values: ['нет', 'короткая', 'длинная']
  },
  hat: {
    name: 'Головной убор',
    values: ['нет', 'кепка', 'цилиндр', 'панама']
  },
  earrings: {
    name: 'Серёжки',
    values: ['нет', 'одна', 'обе']
  },
  freckles: {
    name: 'Веснушки',
    values: ['нет', 'есть']
  },
  eyebrows: {
    name: 'Брови',
    values: ['обычные', 'густые', 'тонкие']
  }
};

const SKIN_COLORS = ['#F5D0A9', '#E0AC69', '#C68642', '#8D5524'];
const HAIR_COLORS = ['#1A1A1A', '#6B4423', '#C0392B', '#F4D03F', '#B8B8B8', '#4A6FE3'];

/* ============ SVG-ЛИЦО ============ */
function faceSVG(f, size = 200) {
  const skin = SKIN_COLORS[f.skin];
  const hairCol = HAIR_COLORS[f.hairColor];

  // Волосы — рисуем по причёске
  let hairPath = '';
  if (f.hairStyle === 0) {
    // короткая
    hairPath = `<path d="M 20 48 Q 50 12 80 48 Q 78 32 50 24 Q 22 32 20 48 Z" fill="${hairCol}"/>`;
  } else if (f.hairStyle === 1) {
    // длинная
    hairPath = `<path d="M 16 52 Q 50 8 84 52 L 84 82 Q 78 74 75 60 Q 72 38 50 32 Q 28 38 25 60 Q 22 74 16 82 Z" fill="${hairCol}"/>`;
  } // лысый = пусто

  // Брови
  let browsPath = '';
  if (f.eyebrows === 0) {
    // обычные
    browsPath = `
      <path d="M 30 54 Q 38 51 46 54" stroke="${hairCol}" stroke-width="2.5" fill="none" stroke-linecap="round"/>
      <path d="M 54 54 Q 62 51 70 54" stroke="${hairCol}" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    `;
  } else if (f.eyebrows === 1) {
    // густые
    browsPath = `
      <path d="M 28 52 Q 38 48 48 53" stroke="${hairCol}" stroke-width="4.5" fill="none" stroke-linecap="round"/>
      <path d="M 52 53 Q 62 48 72 52" stroke="${hairCol}" stroke-width="4.5" fill="none" stroke-linecap="round"/>
    `;
  } else {
    // тонкие
    browsPath = `
      <path d="M 32 55 Q 38 53 45 55" stroke="${hairCol}" stroke-width="1.5" fill="none" stroke-linecap="round"/>
      <path d="M 55 55 Q 62 53 68 55" stroke="${hairCol}" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    `;
  }

  // Глаза
  const eyes = `
    <circle cx="38" cy="64" r="4" fill="#111"/>
    <circle cx="62" cy="64" r="4" fill="#111"/>
  `;

  // Очки
  let glassesPath = '';
  if (f.glasses === 1) {
    // круглые
    glassesPath = `
      <circle cx="38" cy="64" r="10" fill="none" stroke="#111" stroke-width="2.2"/>
      <circle cx="62" cy="64" r="10" fill="none" stroke="#111" stroke-width="2.2"/>
      <line x1="48" y1="64" x2="52" y2="64" stroke="#111" stroke-width="2.2"/>
    `;
  } else if (f.glasses === 2) {
    // квадратные
    glassesPath = `
      <rect x="28" y="56" width="20" height="16" rx="3" fill="none" stroke="#111" stroke-width="2.2"/>
      <rect x="52" y="56" width="20" height="16" rx="3" fill="none" stroke="#111" stroke-width="2.2"/>
      <line x1="48" y1="64" x2="52" y2="64" stroke="#111" stroke-width="2.2"/>
    `;
  } else if (f.glasses === 3) {
    // солнечные
    glassesPath = `
      <rect x="26" y="54" width="22" height="14" rx="4" fill="#1A1A1A"/>
      <rect x="52" y="54" width="22" height="14" rx="4" fill="#1A1A1A"/>
      <line x1="48" y1="60" x2="52" y2="60" stroke="#1A1A1A" stroke-width="2.5"/>
    `;
  }

  // Нос
  const nose = `<path d="M 50 70 Q 47 80 50 82 Q 53 80 50 70" fill="${skin}" stroke="rgba(0,0,0,0.18)" stroke-width="1"/>`;

  // Рот
  const mouth = `<path d="M 42 92 Q 50 96 58 92" stroke="#5A2A1A" stroke-width="2" fill="none" stroke-linecap="round"/>`;

  // Усы
  let mustachePath = '';
  if (f.mustache === 1) {
    // тонкие
    mustachePath = `<path d="M 38 84 Q 50 86 62 84" stroke="${hairCol}" stroke-width="2.5" fill="none" stroke-linecap="round"/>`;
  } else if (f.mustache === 2) {
    // густые
    mustachePath = `<path d="M 34 84 Q 50 90 66 84 Q 50 88 34 84 Z" fill="${hairCol}"/>`;
  }

  // Борода
  let beardPath = '';
  if (f.beard === 1) {
    // короткая — по краям лица
    beardPath = `<path d="M 24 78 Q 22 96 50 104 Q 78 96 76 78 Q 70 88 50 90 Q 30 88 24 78 Z" fill="${hairCol}" opacity="0.9"/>`;
  } else if (f.beard === 2) {
    // длинная — опускается ниже
    beardPath = `<path d="M 22 76 Q 20 100 50 112 Q 80 100 78 76 Q 72 90 50 92 Q 28 90 22 76 Z" fill="${hairCol}"/>`;
  }

  // Шляпа
  let hatPath = '';
  if (f.hat === 1) {
    // кепка
    hatPath = `
      <path d="M 18 44 Q 50 14 82 44 L 82 48 Q 50 44 18 48 Z" fill="#2C3E50"/>
      <path d="M 82 46 Q 96 46 96 53 L 78 53 Z" fill="#2C3E50"/>
    `;
  } else if (f.hat === 2) {
    // цилиндр
    hatPath = `
      <rect x="30" y="12" width="40" height="30" fill="#1A1A1A"/>
      <rect x="18" y="40" width="64" height="6" rx="2" fill="#1A1A1A"/>
    `;
  } else if (f.hat === 3) {
    // панама
    hatPath = `
      <ellipse cx="50" cy="36" rx="42" ry="6" fill="#F4D03F"/>
      <path d="M 26 36 Q 30 14 50 12 Q 70 14 74 36 Z" fill="#F4D03F"/>
      <path d="M 26 34 Q 50 40 74 34" stroke="#C9A227" stroke-width="2" fill="none"/>
    `;
  }

  // Серёжки
  let earringsPath = '';
  if (f.earrings === 1) {
    // одна (слева)
    earringsPath = `<circle cx="18" cy="76" r="3" fill="#F4D03F" stroke="#C9A227" stroke-width="1"/>`;
  } else if (f.earrings === 2) {
    // обе
    earringsPath = `
      <circle cx="18" cy="76" r="3" fill="#F4D03F" stroke="#C9A227" stroke-width="1"/>
      <circle cx="82" cy="76" r="3" fill="#F4D03F" stroke="#C9A227" stroke-width="1"/>
    `;
  }

  // Веснушки
  let frecklesPath = '';
  if (f.freckles === 1) {
    frecklesPath = `
      <circle cx="32" cy="76" r="1.2" fill="rgba(120,60,20,0.7)"/>
      <circle cx="36" cy="78" r="1.2" fill="rgba(120,60,20,0.7)"/>
      <circle cx="30" cy="80" r="1.2" fill="rgba(120,60,20,0.7)"/>
      <circle cx="68" cy="76" r="1.2" fill="rgba(120,60,20,0.7)"/>
      <circle cx="64" cy="78" r="1.2" fill="rgba(120,60,20,0.7)"/>
      <circle cx="70" cy="80" r="1.2" fill="rgba(120,60,20,0.7)"/>
    `;
  }

  return `
    <svg viewBox="0 0 100 120" width="${size}" height="${size * 1.2}" style="display:block; margin: 0 auto;">
      <ellipse cx="18" cy="68" rx="5" ry="9" fill="${skin}"/>
      <ellipse cx="82" cy="68" rx="5" ry="9" fill="${skin}"/>
      <ellipse cx="50" cy="68" rx="32" ry="38" fill="${skin}"/>
      ${hairPath}
      ${browsPath}
      ${eyes}
      ${nose}
      ${mouth}
      ${mustachePath}
      ${beardPath}
      ${glassesPath}
      ${hatPath}
      ${earringsPath}
      ${frecklesPath}
    </svg>
  `;
}

/* ============ ГЕНЕРАЦИЯ И МУТАЦИЯ ============ */
function randomFace() {
  return {
    skin: rand(FEATURES.skin.values.length),
    hairColor: rand(FEATURES.hairColor.values.length),
    hairStyle: rand(FEATURES.hairStyle.values.length),
    glasses: rand(FEATURES.glasses.values.length),
    mustache: rand(FEATURES.mustache.values.length),
    beard: rand(FEATURES.beard.values.length),
    hat: rand(FEATURES.hat.values.length),
    earrings: rand(FEATURES.earrings.values.length),
    freckles: rand(FEATURES.freckles.values.length),
    eyebrows: rand(FEATURES.eyebrows.values.length)
  };
}

function mutateFace(f, diffCount) {
  const result = { ...f };
  const keys = Object.keys(FEATURES);
  const shuffledKeys = shuffle(keys);
  const used = new Set();
  let changed = 0;

  for (const k of shuffledKeys) {
    if (changed >= diffCount) break;
    const valuesCount = FEATURES[k].values.length;
    if (valuesCount < 2) continue;

    // Выбираем другое значение
    let newVal;
    let guard = 0;
    do {
      newVal = rand(valuesCount);
      guard++;
    } while (newVal === result[k] && guard < 20);

    if (newVal !== result[k]) {
      result[k] = newVal;
      changed++;
    }
  }
  return result;
}

/* ============ НАСТРОЙКИ ============ */
let idCfg = {
  options: 4,
  showTime: 4,
  diffCount: 2
};
try {
  const s = localStorage.getItem('idCfg');
  if (s) idCfg = { ...idCfg, ...JSON.parse(s) };
} catch(e) {}

/* ============ ЭКРАН НАСТРОЕК ============ */
function startIdentikit() {
  clearTimeouts();

  gameEl.innerHTML = `
    <div class="game-header">
      <h2>🕵️ Фоторобот</h2>
      <div class="subtitle">Запомни преступника — найди его среди похожих</div>
    </div>
    <div class="panel">
      <div style="max-width: 500px; margin: 0 auto;">

        <div class="presets" id="presets">
          <button class="preset-btn" data-opt="3" data-time="5" data-diff="3">🌱 Разминка</button>
          <button class="preset-btn" data-opt="4" data-time="4" data-diff="2">⚡ Стандарт</button>
          <button class="preset-btn" data-opt="6" data-time="3" data-diff="1">🔥 Сложно</button>
          <button class="preset-btn" data-opt="8" data-time="2" data-diff="1">💀 Хардкор</button>
        </div>

        <label style="display:block; margin-bottom: 20px;">
          <div class="settings-row"><span>Вариантов ответа</span><b id="optVal">${idCfg.options}</b></div>
          <input type="range" id="optRange" min="3" max="8" value="${idCfg.options}">
        </label>

        <label style="display:block; margin-bottom: 20px;">
          <div class="settings-row"><span>Время запоминания</span><b id="timeVal">${idCfg.showTime} сек</b></div>
          <input type="range" id="timeRange" min="1" max="15" value="${idCfg.showTime}">
        </label>

        <label style="display:block; margin-bottom: 20px;">
          <div class="settings-row"><span>Отличий у двойников</span><b id="diffVal">${idCfg.diffCount}</b></div>
          <input type="range" id="diffRange" min="1" max="5" value="${idCfg.diffCount}">
          <div class="time-hint" id="diffHint">
            1 отличие = <b>почти неразличимо</b> · 5 отличий = <b>легко</b>
          </div>
        </label>

        <div class="subtitle" style="text-align:left; padding: 12px; background: var(--blue-light); border-radius: 12px; line-height: 1.5; margin-top: 14px;">
          💡 <b>Как играть:</b> смотри на преступника несколько секунд — запомни <b>все признаки</b>: кожу, волосы, причёску, очки, усы, бороду, головной убор, серёжки, веснушки, брови. Потом найди его среди похожих.
        </div>

        <button class="btn-main" id="startBtn">Начать 🕵️</button>
      </div>
    </div>
  `;

  const optRange = $('optRange');
  const timeRange = $('timeRange');
  const diffRange = $('diffRange');

  function markPresetActive() {
    document.querySelectorAll('.preset-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.preset-btn').forEach(b => {
      if (+b.dataset.opt === +optRange.value &&
          +b.dataset.time === +timeRange.value &&
          +b.dataset.diff === +diffRange.value) {
        b.classList.add('active');
      }
    });
  }

  document.querySelectorAll('.preset-btn').forEach(b => {
    b.onclick = () => {
      optRange.value = b.dataset.opt;
      timeRange.value = b.dataset.time;
      diffRange.value = b.dataset.diff;
      $('optVal').textContent = b.dataset.opt;
      $('timeVal').textContent = b.dataset.time + ' сек';
      $('diffVal').textContent = b.dataset.diff;
      markPresetActive();
      sfxClick();
    };
  });

  optRange.oninput = () => { $('optVal').textContent = optRange.value; markPresetActive(); sfxClick(); };
  timeRange.oninput = () => { $('timeVal').textContent = timeRange.value + ' сек'; markPresetActive(); sfxClick(); };
  diffRange.oninput = () => { $('diffVal').textContent = diffRange.value; markPresetActive(); sfxClick(); };

  markPresetActive();

  $('startBtn').onclick = () => {
    idCfg.options = +optRange.value;
    idCfg.showTime = +timeRange.value;
    idCfg.diffCount = +diffRange.value;
    try { localStorage.setItem('idCfg', JSON.stringify(idCfg)); } catch(e) {}
    identikitShow();
  };
}

/* ============ ФАЗА 1: ПОКАЗ ПРЕСТУПНИКА ============ */
function identikitShow() {
  clearTimeouts();
  const showTime = idCfg.showTime;
  const target = randomFace();

  gameEl.innerHTML = `
    <div class="game-header">
      <h2>🕵️ Фоторобот</h2>
      <div class="subtitle">Запомни преступника... <span id="time">${showTime}</span> сек</div>
    </div>
    <div class="panel">
      <div class="timer-bar"><div class="timer-fill" id="tfill" style="width:100%"></div></div>
      <div class="status warn">Смотри внимательно на все детали!</div>
      <div class="criminal-show">
        ${faceSVG(target, 240)}
      </div>
    </div>
  `;

  beep(600, 0.15);

  let left = showTime;
  const intervalId = setInterval(() => {
    left--;
    const t = $('time'); if (t) t.textContent = Math.max(0, left);
    const f = $('tfill'); if (f) f.style.width = (Math.max(0, left) / showTime * 100) + '%';
    if (left <= 0) clearInterval(intervalId);
  }, 1000);
  timeouts.push(intervalId);

  wait(showTime * 1000, () => identikitAsk(target));
}

/* ============ ФАЗА 2: ВЫБОР ============ */
function identikitAsk(target) {
  clearTimeouts();
  const optionsCount = idCfg.options;
  const diffCount = idCfg.diffCount;

  const distractors = [];
  for (let i = 0; i < optionsCount - 1; i++) {
    // Каждый дистрактор отличается в diffCount признаках от цели
    let dist = mutateFace(target, diffCount);
    // Гарантируем уникальность
    let guard = 0;
    while (guard < 10 && distractors.some(d => JSON.stringify(d) === JSON.stringify(dist))) {
      dist = mutateFace(target, diffCount);
      guard++;
    }
    distractors.push(dist);
  }

  const options = shuffle([{ face: target, isTarget: true }, ...distractors.map(d => ({ face: d, isTarget: false }))]);
  const correctIdx = options.findIndex(o => o.isTarget);

  // Адаптивные колонки
  const cols = optionsCount <= 4 ? 2 : optionsCount <= 6 ? 3 : 4;

  gameEl.innerHTML = `
    <div class="game-header">
      <h2>🕵️ Фоторобот</h2>
      <div class="subtitle">Кто из них был преступником?</div>
    </div>
    <div class="panel">
      <div class="status">Выбери того самого!</div>
      <div class="options" id="opts" style="grid-template-columns: repeat(${cols}, 1fr);"></div>
    </div>
  `;

  const opts = $('opts');
  let answered = false;

  options.forEach((o, i) => {
    const el = document.createElement('div');
    el.className = 'face-option';
    el.innerHTML = `
      <div class="badge">ТЫ</div>
      ${faceSVG(o.face, 180)}
    `;
    el.onclick = () => {
      if (answered) return;
      answered = true;

      const good = i === correctIdx;

      options.forEach((_, j) => {
        const faceEl = opts.children[j];
        faceEl.style.pointerEvents = 'none';
        if (j !== correctIdx) faceEl.classList.add('dimmed');
      });

      if (good) {
        el.classList.add('correct');
        el.classList.remove('dimmed');
        el.querySelector('.badge').textContent = '✓';
        sfxWin();
        addScore(20);
      } else {
        el.classList.add('wrong');
        el.classList.remove('dimmed');
        el.querySelector('.badge').textContent = 'ТЫ';
        // Подсветить правильный
        const correctEl = opts.children[correctIdx];
        correctEl.classList.add('correct');
        correctEl.classList.remove('dimmed');
        correctEl.querySelector('.badge').textContent = '✓';
        sfxWrong();
      }

      wait(1800, () => identikitResult(target, good, o.face, options[correctIdx].face));
    };
    opts.appendChild(el);
  });
}

/* ============ ФАЗА 3: РЕЗУЛЬТАТ ============ */
function identikitResult(target, good, chosenFace, correctFace) {
  const points = good ? 30 : 5;
  addScore(points);
  const stars = good ? 3 : 0;
  const starStr = '⭐'.repeat(stars) + '☆'.repeat(3 - stars);

  const emoji = good ? '🏆' : '🕵️';
  const title = good ? 'Преступник пойман!' : 'Не тот...';
  const text = good ? 'Ты точно запомнил все признаки' : 'Ты ошибся с выбором';

  // Формируем описание признаков
  function describe(f) {
    return Object.keys(FEATURES).map(k => {
      const val = FEATURES[k].values[f[k]];
      return `<div class="feat">
        <span class="feat-name">${FEATURES[k].name}:</span>
        <span class="feat-value">${val}</span>
      </div>`;
    }).join('');
  }

  gameEl.innerHTML = `
    <div class="panel">
      <div class="result-screen">
        <div class="big">${emoji}</div>
        <h2>${title}</h2>
        <p>${text}</p>
        <div class="stars">${starStr}</div>
        <p style="opacity:.6; font-size: 14px;">+${points} очков</p>

        <div style="margin-top: 22px; padding: 16px; background: rgba(45,108,223,.05); border-radius: 14px;">
          <div style="font-size: 13px; color: var(--text-muted); font-weight: 800; margin-bottom: 10px; text-align: center;">ПРАВИЛЬНЫЙ ПРЕСТУПНИК:</div>
          <div style="display: flex; gap: 20px; justify-content: center; flex-wrap: wrap; align-items: flex-start;">
            <div>${faceSVG(target, 160)}</div>
            <div style="flex: 1; min-width: 220px;">
              <div class="features-list">${describe(target)}</div>
            </div>
          </div>
        </div>

        ${!good ? `
          <div style="margin-top: 16px; padding: 14px; background: rgba(239,68,68,.06); border-radius: 14px;">
            <div style="font-size: 13px; color: var(--text-muted); font-weight: 800; margin-bottom: 10px; text-align: center;">ТВОЙ ВЫБОР:</div>
            <div style="display: flex; gap: 16px; justify-content: center; align-items: center; flex-wrap: wrap;">
              <div>${faceSVG(chosenFace, 110)}</div>
              <div style="font-size: 13px; color: var(--text-muted); font-weight: 600;">
                Отличия от правильного:<br>
                <span style="color: var(--red); font-weight: 800;">
                  ${describeDiffs(target, chosenFace)}
                </span>
              </div>
            </div>
          </div>
        ` : ''}

        <button class="btn-main" id="retry">Ещё раз 🔄</button>
        <button class="btn-secondary" id="menuBtn">← Настройки</button>
      </div>
    </div>
  `;
  $('retry').onclick = () => identikitShow();
  $('menuBtn').onclick = () => startIdentikit();
}

function describeDiffs(a, b) {
  const diffs = [];
  Object.keys(FEATURES).forEach(k => {
    if (a[k] !== b[k]) {
      diffs.push(`${FEATURES[k].name}: ${FEATURES[k].values[a[k]]} ≠ ${FEATURES[k].values[b[k]]}`);
    }
  });
  return diffs.join('<br>');
}

/* ============ СТАРТ ============ */
document.addEventListener('click', initAudio, { once: true });
startIdentikit();
</script>

<script src="../assets/menu-data.js"></script>
