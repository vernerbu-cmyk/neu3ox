function shuffle(a) {
  const arr = [...a];
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}
const rand = n => Math.floor(Math.random() * n);

let timeouts = [];
function wait(ms, fn) {
  const id = setTimeout(fn, ms);
  timeouts.push(id);
  return id;
}
function clearTimeouts() {
  timeouts.forEach(clearTimeout);
  timeouts = [];
}

let audioCtx = null;
function initAudio() {
  if (!audioCtx) {
    try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) {}
  }
}
function beep(freq, dur = 0.15, type = 'sine', vol = 0.08) {
  if (!audioCtx) return;
  try {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.type = type;
    osc.frequency.value = freq;
    const t = audioCtx.currentTime;
    gain.gain.setValueAtTime(vol, t);
    gain.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    osc.start(t); osc.stop(t + dur + 0.02);
  } catch(e) {}
}
function sfxCorrect() { beep(660, 0.1); setTimeout(() => beep(880, 0.15), 90); }
function sfxWrong() { beep(180, 0.3, 'sawtooth', 0.12); }
function sfxClick() { beep(440, 0.05, 'triangle', 0.06); }

/* ============ РАЗБИЕНИЕ ПО СЛОГАМ ============ */
const VOWELS = 'аеёиоуыэюяАЕЁИОУЫЭЮЯ';

function groupConsonants(str) {
  const groups = [];
  let i = 0;
  while (i < str.length) {
    if (i + 1 < str.length && (str[i+1] === 'ь' || str[i+1] === 'ъ')) {
      groups.push(str[i] + str[i+1]);
      i += 2;
    } else {
      groups.push(str[i]);
      i++;
    }
  }
  return groups;
}

function splitIntoSyllables(word) {
  if (word.length <= 3) return word;
  // если нет гласных — оставить как есть
  if (![...word].some(c => VOWELS.includes(c))) return word;

  const syllables = [];
  let current = '';
  let i = 0;

  while (i < word.length) {
    current += word[i];
    if (!VOWELS.includes(word[i])) {
      i++;
      continue;
    }
    // гласная
    i++;
    let j = i;
    let consonants = '';
    while (j < word.length && !VOWELS.includes(word[j])) {
      consonants += word[j];
      j++;
    }

    if (j >= word.length) {
      // конец слова
      current += consonants;
      syllables.push(current);
      current = '';
      i = word.length;
    } else {
      const groups = groupConsonants(consonants);
      if (groups.length <= 1) {
        syllables.push(current);
        current = '';
      } else {
        current += groups[0];
        syllables.push(current);
        current = '';
        i += groups[0].length;
      }
    }
  }
  if (current) {
    if (![...current].some(c => VOWELS.includes(c))) {
      if (syllables.length > 0) {
        syllables[syllables.length - 1] += current;
      } else {
        syllables.push(current);
      }
    } else {
      syllables.push(current);
    }
  }
  return syllables.join('-');
}

function syllableTransform(text) {
  return text.replace(/[а-яёА-ЯЁ]+/g, w => splitIntoSyllables(w));
}

function applySyllablesToParagraphs(paragraphs) {
  return paragraphs.map(p => syllableTransform(p));

const EXPERT_QUOTES = [
  'Это первый подобный случай в истории.',
  'Наука пока не может это объяснить.',
  'Мы будем изучать это не меньше года.',
  'Такое бывает раз в сто лет.',
  'Нужно срочно собрать комиссию.',
  'Главное — не паниковать.',
  'Мы уже написали об этом статью.',
  'Природа полна сюрпризов.'
];

const CONSEQUENCES = [
  'Теперь к этому месту выстроилась очередь на три квартала.',
  'Мэрия решила поставить там памятник.',
  'Билеты на это зрелище раскупили на год вперёд.',
  'Местные школьники требуют сделать это школьным уроком.',
  'Соседние города просят повторить это у них.',
  'Учёные подали заявку на грант.',
  'Телеканалы приехали снимать сюжет.',
  'В соцсетях уже появился мем.',
  'Туристы начали приезжать целыми автобусами.',
  'Фермеры просят продать им это чудо.'
];

const ENDINGS = [
  'Подробности уточняются.',
  'Следим за развитием событий.',
  'К счастью, никто не пострадал.',
  'Это уже не первый такой случай.',
  'Никто не знает, что будет дальше.',
  'Местные уже придумали новый праздник.',
  'История пока не получила продолжения.',
  'Продолжение — в следующем выпуске.'
];

const DETAILS = [
  'Рядом стояла машина с мороженым, и все свидетели сначала подумали, что это шутка.',
  'Всё это происходило под музыку из соседнего кафе.',
  'Погода в тот день была самая обычная, ничто не предвещало.',
  'Никто из прохожих сначала не понял, что происходит.',
  'К месту событий сразу сбежались голуби.',
  'Где-то вдалеке играла гармонь, и это добавляло странности.',
  'На асфальте остались следы, которые никто не смог объяснить.',
  'Один из свидетелей снимал всё на старый телефон с кнопками.'
];

/* ============ ГЕНЕРАЦИЯ ============ */
function generateNews(size) {
  const place = PLACES[rand(PLACES.length)];
  const creature = CREATURES[rand(CREATURES.length)];
  const action = ACTIONS[rand(ACTIONS.length)];
  const time = TIMES[rand(TIMES.length)];
  const circumstance = CIRCUMSTANCES[rand(CIRCUMSTANCES.length)];
  const witness = WITNESS_NAMES[rand(WITNESS_NAMES.length)];
  const witnessQuote = WITNESS_QUOTES[rand(WITNESS_QUOTES.length)];
  const expert = EXPERTS[rand(EXPERTS.length)];
  const expertQuote = EXPERT_QUOTES[rand(EXPERT_QUOTES.length)];
  const consequence = CONSEQUENCES[rand(CONSEQUENCES.length)];
  const ending = ENDINGS[rand(ENDINGS.length)];
  const detail = DETAILS[rand(DETAILS.length)];

  const p1 = `${time.charAt(0).toUpperCase() + time.slice(1)} ${place.in} ${creature} ${action.verb} ${action.object}.`;
  const p2 = `По словам очевидцев, всё произошло ${circumstance}.`;
  const p3 = `${witness.charAt(0).toUpperCase() + witness.slice(1)} рассказал: «${witnessQuote}»`;
  const p4 = `Теперь ${action.ability}. ${consequence}`;
  const p5 = `${detail}`;
  const p6 = `${expert.charAt(0).toUpperCase() + expert.slice(1)} прокомментировал: «${expertQuote}»`;
  const p7 = `${ending}`;

  let paragraphs;
  if (size === 'short') {
    paragraphs = [p1, p3, p7];
  } else if (size === 'medium') {
    paragraphs = [p1, p3, p4, p6, p7];
  } else {
    paragraphs = [p1, p2, p3, p4, p5, p6, p7];
  }

  return {
    paragraphs,
    facts: {
      place: place.nom,
      creature,
      action: `${action.verb} ${action.object}`,
      time,
      circumstance,
      witness,
      witnessQuote,
      expert,
      expertQuote,
      consequence,
      detail,
      ending
    },
    actionObj: action
  };
}

function wrongOptions(correct, pool, count = 3) {
  const filtered = pool.filter(v => v !== correct);
  return shuffle(filtered).slice(0, count);
}

/* ============ НАСТРОЙКИ ============ */
let newsCfg = {
  questions: 5,
  showTime: 40,
  timerMode: true,
  size: 'medium',
  headlines: true,
  syllables: false
};
try {
  const s = localStorage.getItem('newsCfg');
  if (s) newsCfg = { ...newsCfg, ...JSON.parse(s) };
} catch(e) {}

/* ============ ЭКРАН НАСТРОЕК ============ */
function startNews() {
  clearTimeouts();

  gameEl.innerHTML = `
    <div class="game-header">
      <h2>🐙 Ложные новости</h2>
      <div class="subtitle">Прочитай абсурдную статью — потом ответь на вопросы</div>
    </div>
    <div class="panel">
      <div style="max-width: 480px; margin: 0 auto;">

        <div class="presets" id="presets">
          <button class="preset-btn" data-size="short" data-q="3" data-timer="0" data-time="30">🌱 Разминка</button>
          <button class="preset-btn" data-size="medium" data-q="5" data-timer="1" data-time="40">⚡ Стандарт</button>
          <button class="preset-btn" data-size="medium" data-q="6" data-timer="1" data-time="25">🔥 Сложнее</button>
          <button class="preset-btn" data-size="long" data-q="8" data-timer="1" data-time="20">💀 Хардкор</button>
        </div>

        <div style="margin-bottom: 22px;">
          <div class="settings-row"><span>Размер статьи</span><b id="sizeVal">${newsCfg.size === 'short' ? 'короткая' : newsCfg.size === 'medium' ? 'средняя' : 'длинная'}</b></div>
          <div class="segment" id="sizeRow">
            <button class="segment-btn" data-size="short">Короткая<small>3 абзаца</small></button>
            <button class="segment-btn" data-size="medium">Средняя<small>5 абзацев</small></button>
            <button class="segment-btn" data-size="long">Длинная<small>7 абзацев</small></button>
          </div>
        </div>

        <div style="margin-bottom: 22px;">
          <div class="settings-row"><span>Формат текста</span><b id="syllablesVal">${newsCfg.syllables ? 'по слогам' : 'обычный'}</b></div>
          <div class="segment" id="syllablesRow">
            <button class="segment-btn" data-syllables="0">Обычный<small>целыми словами</small></button>
            <button class="segment-btn" data-syllables="1">По слогам<small>для чтения</small></button>
          </div>
        </div>

        <label style="display:block; margin-bottom: 22px;">
          <div class="settings-row"><span>Сколько вопросов</span><b id="qVal">${newsCfg.questions}</b></div>
          <input type="range" id="qRange" min="3" max="8" value="${newsCfg.questions}">
        </label>

        <div style="margin-bottom: 22px;">
          <div class="settings-row"><span>Режим чтения</span><b id="timerModeVal">${newsCfg.timerMode ? 'с таймером' : 'без таймера'}</b></div>
          <div class="segment" id="timerRow">
            <button class="segment-btn" data-timer="1">С таймером<small>на время</small></button>
            <button class="segment-btn" data-timer="0">Без таймера<small>сам решаю</small></button>
          </div>
        </div>

        <label style="display:block; margin-bottom: 22px;" id="timeBlock">
          <div class="settings-row"><span>Время на чтение</span><b id="timeVal">${newsCfg.showTime} сек</b></div>
          <input type="range" id="timeRange" min="3" max="120" step="1" value="${newsCfg.showTime}">
        </label>

        <label style="display:flex; align-items:center; gap:12px; margin-bottom: 8px; cursor:pointer; font-weight:700;">
          <input type="checkbox" id="headlines" ${newsCfg.headlines ? 'checked' : ''}
            style="width:20px; height:20px; accent-color:#FF8C42;">
          <span>Оформление "СРОЧНО В НОМЕР!"</span>
        </label>

        <div class="subtitle" style="text-align:left; padding: 14px; background: var(--blue-light); border-radius: 12px; line-height: 1.5; margin-top: 14px;">
          💡 <b>Как играть:</b> увидишь абсурдную статью. Прочитай и запомни детали — потом ответишь на вопросы. В режиме «По слогам» слова разбиты дефисами — так легче читать.
        </div>

        <button class="btn-main" id="startBtn">Начать 📰</button>
      </div>
    </div>
  `;

  const qRange = $('qRange');
  const timeRange = $('timeRange');
  const timeBlock = $('timeBlock');

  function updateTimerUI() {
    $('timerModeVal').textContent = newsCfg.timerMode ? 'с таймером' : 'без таймера';
    gameEl.querySelectorAll('#timerRow .segment-btn').forEach(b => {
      b.classList.toggle('active', (b.dataset.timer === '1') === newsCfg.timerMode);
    });
    timeBlock.classList.toggle('slider-disabled', !newsCfg.timerMode);
  }

  function updateSizeUI() {
    $('sizeVal').textContent = newsCfg.size === 'short' ? 'короткая' : newsCfg.size === 'medium' ? 'средняя' : 'длинная';
    gameEl.querySelectorAll('#sizeRow .segment-btn').forEach(b => {
      b.classList.toggle('active', b.dataset.size === newsCfg.size);
    });
  }

  function updateSyllablesUI() {
    $('syllablesVal').textContent = newsCfg.syllables ? 'по слогам' : 'обычный';
    gameEl.querySelectorAll('#syllablesRow .segment-btn').forEach(b => {
      b.classList.toggle('active', (b.dataset.syllables === '1') === newsCfg.syllables);
    });
  }

  function markPresetActive() {
    document.querySelectorAll('.preset-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.preset-btn').forEach(b => {
      if (b.dataset.size === newsCfg.size &&
          +b.dataset.q === +qRange.value &&
          (b.dataset.timer === '1') === newsCfg.timerMode &&
          +b.dataset.time === +timeRange.value) {
        b.classList.add('active');
      }
    });
  }

  gameEl.querySelectorAll('#sizeRow .segment-btn').forEach(b => {
    b.onclick = () => {
      newsCfg.size = b.dataset.size;
      updateSizeUI();
      markPresetActive();
      sfxClick();
    };
  });

  gameEl.querySelectorAll('#syllablesRow .segment-btn').forEach(b => {
    b.onclick = () => {
      newsCfg.syllables = b.dataset.syllables === '1';
      updateSyllablesUI();
      sfxClick();
    };
  });

  gameEl.querySelectorAll('#timerRow .segment-btn').forEach(b => {
    b.onclick = () => {
      newsCfg.timerMode = b.dataset.timer === '1';
      updateTimerUI();
      markPresetActive();
      sfxClick();
    };
  });

  document.querySelectorAll('.preset-btn').forEach(b => {
    b.onclick = () => {
      newsCfg.size = b.dataset.size;
      qRange.value = b.dataset.q;
      newsCfg.timerMode = b.dataset.timer === '1';
      timeRange.value = b.dataset.time;
      $('qVal').textContent = b.dataset.q;
      $('timeVal').textContent = b.dataset.time + ' сек';
      updateSizeUI();
      updateTimerUI();
      markPresetActive();
      sfxClick();
    };
  });

  qRange.oninput = () => { $('qVal').textContent = qRange.value; markPresetActive(); sfxClick(); };
  timeRange.oninput = () => { $('timeVal').textContent = timeRange.value + ' сек'; markPresetActive(); sfxClick(); };

  updateSizeUI();
  updateSyllablesUI();
  updateTimerUI();
  markPresetActive();

  $('startBtn').onclick = () => {
    newsCfg.questions = +qRange.value;
    newsCfg.showTime = +timeRange.value;
    newsCfg.headlines = $('headlines').checked;
    try { localStorage.setItem('newsCfg', JSON.stringify(newsCfg)); } catch(e) {}
    newsShow();
  };
}

/* ============ ФАЗА 1: ПОКАЗ ============ */
function newsShow() {
  clearTimeouts();
  const showTime = newsCfg.showTime;
  const timerMode = newsCfg.timerMode;
  const news = generateNews(newsCfg.size);

  // Преобразуем абзацы по слогам, если включено
  const displayParagraphs = newsCfg.syllables
    ? applySyllablesToParagraphs(news.paragraphs)
    : news.paragraphs;

  const syllablesClass = newsCfg.syllables ? ' syllables' : '';

  gameEl.innerHTML = `
    <div class="game-header">
      <h2>🐙 Ложные новости</h2>
      <div class="subtitle" id="subtitleLine">${timerMode ? `Читай и запоминай... <span id="time">${showTime}</span> сек` : 'Читай и запоминай — сам реши, когда готов'}</div>
    </div>
    <div class="panel">
      ${timerMode ? `<div class="timer-bar"><div class="timer-fill" id="tfill" style="width:100%"></div></div>` : ''}
      ${newsCfg.headlines ? `<div class="status warn">📰 СРОЧНО В НОМЕР!</div>` : ''}
      <div class="news-card">
        ${newsCfg.headlines ? `<div class="news-headline">Экстренный выпуск</div>` : ''}
        <div class="news-text${syllablesClass}">
          ${displayParagraphs.map(p => `<p>${p}</p>`).join('')}
        </div>
      </div>
      ${timerMode ? '' : `<button class="btn-main" id="readyBtn">Я запомнил →</button>`}
    </div>
  `;

  beep(600, 0.15);

  if (timerMode) {
    let left = showTime;
    const intervalId = setInterval(() => {
      left--;
      const t = $('time'); if (t) t.textContent = Math.max(0, left);
      const f = $('tfill'); if (f) f.style.width = (Math.max(0, left) / showTime * 100) + '%';
      if (left <= 0) clearInterval(intervalId);
    }, 1000);
    timeouts.push(intervalId);

    wait(showTime * 1000, () => newsAsk(news));
  } else {
    $('readyBtn').onclick = () => {
      sfxClick();
      newsAsk(news);
    };
  }
}

/* ============ ФАЗА 2: ВОПРОСЫ ============ */
function newsAsk(news) {
  clearTimeouts();

  const allQuestions = [
    {
      key: 'place', q: 'ГДЕ это произошло?', context: 'Место',
      correct: news.facts.place,
      wrongs: wrongOptions(news.facts.place, PLACES.map(p => p.nom), 3)
    },
    {
      key: 'creature', q: 'КТО герой новости?', context: 'Герой',
      correct: news.facts.creature,
      wrongs: wrongOptions(news.facts.creature, CREATURES, 3)
    },
    {
      key: 'action', q: 'ЧТО он сделал?', context: 'Действие',
      correct: news.facts.action,
      wrongs: shuffle(ACTIONS.filter(a =>
        !(a.verb === news.actionObj.verb && a.object === news.actionObj.object)
      ).map(a => `${a.verb} ${a.object}`)).slice(0, 3)
    },
    {
      key: 'time', q: 'КОГДА это случилось?', context: 'Время',
      correct: news.facts.time,
      wrongs: wrongOptions(news.facts.time, TIMES, 3)
    },
    {
      key: 'circumstance', q: 'ГДЕ ИМЕННО произошло событие?', context: 'Обстоятельства',
      correct: news.facts.circumstance,
      wrongs: wrongOptions(news.facts.circumstance, CIRCUMSTANCES, 3)
    },
    {
      key: 'witness', q: 'КТО был свидетелем?', context: 'Свидетель',
      correct: news.facts.witness,
      wrongs: wrongOptions(news.facts.witness, WITNESS_NAMES, 3)
    },
    {
      key: 'witnessQuote', q: 'ЧТО сказал свидетель?', context: 'Цитата свидетеля',
      correct: news.facts.witnessQuote,
      wrongs: wrongOptions(news.facts.witnessQuote, WITNESS_QUOTES, 3)
    },
    {
      key: 'expert', q: 'КТО дал комментарий как эксперт?', context: 'Эксперт',
      correct: news.facts.expert,
      wrongs: wrongOptions(news.facts.expert, EXPERTS, 3)
    },
    {
      key: 'expertQuote', q: 'ЧТО сказал эксперт?', context: 'Цитата эксперта',
      correct: news.facts.expertQuote,
      wrongs: wrongOptions(news.facts.expertQuote, EXPERT_QUOTES, 3)
    },
    {
      key: 'consequence', q: 'ЧТО произошло ПОСЛЕ?', context: 'Последствия',
      correct: news.facts.consequence,
      wrongs: wrongOptions(news.facts.consequence, CONSEQUENCES, 3)
    },
    {
      key: 'ending', q: 'ЧЕМ закончилась новость?', context: 'Концовка',
      correct: news.facts.ending,
      wrongs: wrongOptions(news.facts.ending, ENDINGS, 3)
    },
    {
      key: 'detail', q: 'КАКАЯ деталь ещё была в тексте?', context: 'Детали',
      correct: news.facts.detail,
      wrongs: wrongOptions(news.facts.detail, DETAILS, 3)
    }
  ];

  // Оставляем только те, чей правильный ответ реально был в тексте
  const paragraphText = news.paragraphs.join(' ');
  const validQuestions = allQuestions.filter(q => {
    if (!q.correct || q.wrongs.length < 3) return false;
    return paragraphText.includes(q.correct);
  });

  const questionCount = Math.min(newsCfg.questions, validQuestions.length);
  const questionPool = shuffle([...validQuestions]).slice(0, questionCount);
  const history = [];

  // Для режима "по слогам" опции тоже разбиваем
  const transformOption = (text) => newsCfg.syllables ? syllableTransform(text) : text;

  function askNext(idx) {
    if (idx >= questionPool.length) {
      return newsResult(news, history);
    }
    const q = questionPool[idx];
    const correctDisplay = transformOption(q.correct);
    const optionsDisplay = shuffle([q.correct, ...q.wrongs]).map(transformOption);

    const dotsHtml = questionPool.map((_, i) => {
      let cls = 'dot';
      if (i < idx) cls += history[i] ? ' correct' : ' wrong';
      else if (i === idx) cls += ' active';
      return `<div class="${cls}"></div>`;
    }).join('');

    gameEl.innerHTML = `
      <div class="game-header">
        <h2>🐙 Ложные новости</h2>
        <div class="subtitle">Вопрос ${idx + 1} / ${questionPool.length}</div>
      </div>
      <div class="panel">
        <div class="progress-dots">${dotsHtml}</div>
        <div class="question-label">${q.q}</div>
        <div class="question-context">${q.context}</div>
        <div class="options" id="opts"></div>
      </div>
    `;

    const opts = $('opts');
    let answered = false;

    optionsDisplay.forEach(o => {
      const b = document.createElement('div');
      b.className = 'option-text';
      b.textContent = o;
      b.onclick = () => {
        if (answered) return;
        answered = true;

        const good = o === correctDisplay;

        opts.querySelectorAll('.option-text').forEach(x => {
          x.style.pointerEvents = 'none';
          if (x.textContent !== correctDisplay && x !== b) x.classList.add('dimmed');
        });

        if (good) {
          b.classList.add('correct');
          sfxCorrect();
          addScore(10);
        } else {
          b.classList.add('wrong');
          sfxWrong();
          opts.querySelectorAll('.option-text').forEach(x => {
            if (x.textContent === correctDisplay) {
              x.classList.add('correct');
              x.classList.remove('dimmed');
            }
          });
        }

        history.push(good);
        wait(1100, () => askNext(idx + 1));
      };
      opts.appendChild(b);
    });
  }

  askNext(0);
}

/* ============ ФАЗА 3: РЕЗУЛЬТАТ ============ */
function newsResult(news, history) {
  const score = history.filter(Boolean).length;
  const max = history.length;

  let emoji, title, textResult, stars, points;

  if (score === max) {
    emoji = '🏆'; title = 'Журналист года!';
    textResult = `Все ${max} деталей запомнил`;
    stars = 3; points = 40;
    sfxWin();
  } else if (score >= max * 0.8) {
    emoji = '📰'; title = 'Почти идеально';
    textResult = `Правильно: ${score} из ${max}`;
    stars = 2; points = 25;
    sfxCorrect();
  } else if (score >= Math.ceil(max / 2)) {
    emoji = '🐙'; title = 'Неплохо';
    textResult = `Правильно: ${score} из ${max}`;
    stars = 1; points = 12;
    sfxCorrect();
  } else {
    emoji = '🌪'; title = 'Газета врёт';
    textResult = `Правильно: ${score} из ${max}`;
    stars = 0; points = 5;
    sfxWrong();
  }

  addScore(points);
  const starStr = '⭐'.repeat(stars) + '☆'.repeat(3 - stars);

  const historyRow = history.map(ok => `
    <div class="ans ${ok ? 'ok' : 'bad'}">${ok ? '✓' : '✗'}</div>
  `).join('');

  const displayParagraphs = newsCfg.syllables
    ? applySyllablesToParagraphs(news.paragraphs)
    : news.paragraphs;
  const syllablesClass = newsCfg.syllables ? ' syllables' : '';
  const newsHtml = displayParagraphs.map(p => `<p>${p}</p>`).join('');

  gameEl.innerHTML = `
    <div class="panel">
      <div class="result-screen">
        <div class="big">${emoji}</div>
        <h2>${title}</h2>
        <p>${textResult}</p>
        <div class="stars">${starStr}</div>
        <p style="opacity:.6; font-size: 14px;">+${points} очков</p>

        <div class="review-full-news">
          <div class="label">📰 А вот что было в новости:</div>
          <div class="text${syllablesClass}">${newsHtml}</div>
        </div>

        <div style="margin-top: 16px;">
          <div style="font-size: 13px; color: var(--text-muted); font-weight: 800; margin-bottom: 10px;">ТВОИ ОТВЕТЫ:</div>
          <div class="review-answers">${historyRow}</div>
        </div>

        <button class="btn-main" id="retry">Ещё раз 🔄</button>
        <button class="btn-secondary" id="menuBtn">← Настройки</button>
      </div>
    </div>
  `;
  $('retry').onclick = () => newsShow();
  $('menuBtn').onclick = () => startNews();
}

/* ============ СТАРТ ============ */
document.addEventListener('click', initAudio, { once: true });
startNews();
</script>
