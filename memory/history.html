<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>История по датам - Мнемо-Арена</title>
<script>
  /* Инициализация темы до отрисовки — чтобы не было вспышки */
  (function() {
    try {
      var t = localStorage.getItem('theme');
      if (!t && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) t = 'dark';
      if (t) document.documentElement.setAttribute('data-theme', t);
    } catch(e) {}
  })();
</script>
<style>
  :root {
    --blue: #2D6CDF; --blue-dark: #1E4FA8; --blue-light: #EBF2FF;
    --orange: #FF8C42; --orange-dark: #E86E1F; --orange-light: #FFF2E5;
    --bg: #F7F9FC; --text: #1F2937; --text-muted: #6B7280;
    --border: #E5EAF2; --green: #22C55E; --red: #EF4444;
    --yellow: #F59E0B; --purple-light: #F5EDFF;
    --card: #FFFFFF;
    --result-correct-bg: #DCFCE7;
    --result-misplaced-bg: #FEF3C7;
    --result-wrong-bg: #FEE2E2;
    --status-good: #16A34A;
    --status-bad: #DC2626;
    --review-bg: rgba(45,108,223,.05);
    --shadow-sm: rgba(45,108,223,.06);
    --shadow-md: rgba(45,108,223,.06);
    --shadow-btn: rgba(45,108,223,.12);
    --shadow-orange: rgba(255,140,66,.3);
    --shadow-orange-lg: rgba(255,140,66,.4);
    --shadow-orange-sm: rgba(255,140,66,.18);
  }
  [data-theme="dark"] {
    --blue: #6C9EFF; --blue-dark: #9BBAFF; --blue-light: #1A2540;
    --orange: #FF8C42; --orange-dark: #FFB47A; --orange-light: #2E2115;
    --bg: #0F1420; --text: #E4EAF2; --text-muted: #8A94A6;
    --border: #232B3D; --green: #4ADE80; --red: #F87171;
    --yellow: #FBBF24; --purple-light: #2A1F3D;
    --card: #161C2B;
    --result-correct-bg: #143321;
    --result-misplaced-bg: #332911;
    --result-wrong-bg: #3B1616;
    --status-good: #4ADE80;
    --status-bad: #F87171;
    --review-bg: rgba(108,158,255,.08);
    --shadow-sm: rgba(0,0,0,.3);
    --shadow-md: rgba(0,0,0,.35);
    --shadow-btn: rgba(0,0,0,.5);
    --shadow-orange: rgba(255,140,66,.2);
    --shadow-orange-lg: rgba(255,140,66,.3);
    --shadow-orange-sm: rgba(255,140,66,.15);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  body, header, .panel, .preset-btn, .segment-btn, .cat-btn, .pool-item,
  .option-text, .slot, .pool, .question-card, .review-block, .subtitle,
  h1, .game-header h2, .timeline-item, .timeline-year, .timeline-event,
  .score-bar, .back-btn, .theme-toggle, .status, .settings-row b,
  .btn-secondary, .slot-placeholder, .review-answers .ans {
    transition: background-color .3s ease, color .3s ease, border-color .3s ease, box-shadow .3s ease;
  }

  body {
    font-family: -apple-system, 'Segoe UI', Roboto, 'Nunito Sans', sans-serif;
    background: var(--bg); min-height: 100vh; color: var(--text);
    padding: 16px; overflow-x: hidden;
  }
  .container { max-width: 800px; margin: 0 auto; }
  header {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 20px; padding: 16px 22px; background: var(--card);
    border-radius: 20px; border: 1px solid var(--border);
    box-shadow: 0 4px 16px var(--shadow-sm); flex-wrap: wrap; gap: 10px;
  }
  .header-right { display: flex; align-items: center; gap: 10px; margin-left: auto; }
  .back-btn {
    width: 46px; height: 46px; border: none; border-radius: 14px;
    background: var(--blue-light); color: var(--blue);
    font-size: 22px; font-weight: 700; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
  }
  .back-btn:hover { background: var(--blue); color: #fff; transform: translateY(-1px); }
  h1 { font-size: 20px; letter-spacing: .5px; color: var(--blue-dark); font-weight: 800; }
  .score-bar {
    background: var(--orange); color: #fff; padding: 8px 18px;
    border-radius: 30px; font-size: 14px; font-weight: 700;
    box-shadow: 0 4px 12px var(--shadow-orange);
  }
  .score-bar span { color: #fff; font-weight: 800; font-size: 17px; }

  /* SVG-кнопка переключения темы */
  .theme-toggle {
    width: 46px; height: 46px;
    border: none; border-radius: 14px;
    background: var(--blue-light);
    color: var(--blue);
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    position: relative; overflow: hidden;
    padding: 0;
  }
  .theme-toggle:hover { background: var(--blue); color: #fff; transform: translateY(-1px); }
  .theme-toggle svg {
    width: 22px; height: 22px;
    position: absolute;
    transition: transform .4s cubic-bezier(.34,1.56,.64,1), opacity .25s;
  }
  .theme-toggle .icon-sun { opacity: 0; transform: rotate(-90deg) scale(.4); }
  .theme-toggle .icon-moon { opacity: 1; transform: rotate(0) scale(1); }
  [data-theme="dark"] .theme-toggle .icon-sun { opacity: 1; transform: rotate(0) scale(1); }
  [data-theme="dark"] .theme-toggle .icon-moon { opacity: 0; transform: rotate(90deg) scale(.4); }

  main { min-height: 520px; }
  .game-header { text-align: center; margin-bottom: 20px; }
  .game-header h2 { font-size: 22px; margin-bottom: 6px; color: var(--blue-dark); font-weight: 800; }
  .subtitle { font-size: 14px; color: var(--text-muted); font-weight: 600; }
  .status {
    text-align: center; font-size: 16px; margin: 16px 0;
    min-height: 26px; font-weight: 700; color: var(--text);
  }
  .status.good { color: var(--status-good); }
  .status.bad { color: var(--status-bad); }
  .status.warn { color: var(--orange-dark); }
  .panel {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 22px; padding: 26px;
    box-shadow: 0 8px 24px var(--shadow-md);
  }
  .presets { display: flex; gap: 8px; margin-bottom: 22px; flex-wrap: wrap; }
  .preset-btn {
    flex: 1 1 auto; min-width: 90px; padding: 10px 8px; border-radius: 12px;
    border: 2px solid var(--border); background: var(--card); color: var(--blue-dark);
    font-weight: 700; font-size: 13px; cursor: pointer; font-family: inherit;
  }
  .preset-btn:hover { border-color: var(--orange); color: var(--orange-dark); transform: translateY(-1px); }
  .preset-btn.active { background: var(--blue); border-color: var(--blue); color: #fff; }
  .segment { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
  .segment-btn {
    flex: 1 1 auto; padding: 10px 8px; border-radius: 12px;
    border: 2px solid var(--border); background: var(--card); color: var(--blue-dark);
    font-weight: 700; font-size: 13px; cursor: pointer;
    font-family: inherit; line-height: 1.2; min-width: 100px;
  }
  .segment-btn:hover { border-color: var(--orange); }
  .segment-btn.active { background: var(--blue); border-color: var(--blue); color: #fff; }
  .segment-btn small { display: block; font-size: 10px; opacity: .7; font-weight: 600; margin-top: 2px; }
  .segment-btn.active small { opacity: .9; }
  .cat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 8px; }
  .cat-btn {
    padding: 12px 6px; border-radius: 12px; border: 2px solid var(--border);
    background: var(--card); color: var(--blue-dark); font-weight: 700; font-size: 12px;
    cursor: pointer; font-family: inherit; line-height: 1.2;
    display: flex; flex-direction: column; align-items: center; gap: 3px;
  }
  .cat-btn:hover { border-color: var(--orange); transform: translateY(-1px); }
  .cat-btn.active { background: var(--blue); border-color: var(--blue); color: #fff; }
  .cat-btn .cat-emoji { font-size: 20px; line-height: 1; }
  .cat-btn .cat-name { font-size: 11px; text-align: center; }
  .cat-btn .cat-count { font-size: 10px; opacity: .6; }
  .cat-btn.active .cat-count { opacity: .85; }

  .timeline { display: flex; flex-direction: column; gap: 10px; margin: 20px 0; }
  .timeline-item {
    display: flex; align-items: center; gap: 14px; padding: 14px 18px;
    background: linear-gradient(145deg, var(--orange-light), var(--purple-light));
    border: 2px solid var(--border); border-radius: 14px;
    animation: slideIn .4s ease backwards;
  }
  @keyframes slideIn {
    from { transform: translateX(-30px); opacity: 0; }
    to { transform: translateX(0); opacity: 1; }
  }
  .timeline-year {
    font-size: 22px; font-weight: 900; color: var(--orange-dark);
    min-width: 70px; text-align: center; letter-spacing: -1px;
    font-family: 'Courier New', monospace;
  }
  .timeline-sep { color: var(--text-muted); font-size: 18px; font-weight: 800; }
  .timeline-event { font-size: 16px; font-weight: 700; color: var(--blue-dark); flex: 1; }
  .timeline-emoji { font-size: 26px; }

  .progress-dots { display: flex; gap: 6px; justify-content: center; margin-bottom: 18px; flex-wrap: wrap; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--border); transition: .3s; }
  .dot.active { background: var(--orange); transform: scale(1.4); }
  .dot.correct { background: var(--green); }
  .dot.wrong { background: var(--red); }

  .slots { display: grid; gap: 10px; margin-bottom: 20px; }
  .slot {
    display: flex; align-items: center; gap: 12px; padding: 14px 18px;
    background: var(--bg); border: 2px dashed var(--border); border-radius: 14px;
    cursor: pointer; min-height: 60px; user-select: none;
  }
  .slot.filled { background: var(--blue-light); border-style: solid; border-color: var(--blue); }
  .slot:hover { border-color: var(--orange); }
  .slot.filled:hover { background: var(--orange-light); border-color: var(--orange); }
  .slot-num { font-size: 16px; font-weight: 900; color: var(--text-muted); min-width: 24px; text-align: center; }
  .slot.filled .slot-num { color: var(--blue); }
  .slot-emoji { font-size: 24px; }
  .slot-event { font-size: 16px; font-weight: 700; color: var(--blue-dark); flex: 1; }
  .slot-placeholder { color: var(--text-muted); font-size: 14px; font-weight: 600; font-style: italic; }
  .slot.result-correct { background: var(--result-correct-bg); border-color: var(--green); border-style: solid; }
  .slot.result-misplaced { background: var(--result-misplaced-bg); border-color: var(--yellow); border-style: solid; }
  .slot.result-wrong { background: var(--result-wrong-bg); border-color: var(--red); border-style: solid; }

  .pool {
    display: flex; flex-direction: column; gap: 10px; padding: 12px;
    background: var(--bg); border-radius: 16px; border: 2px solid var(--border);
    margin-bottom: 20px; min-height: 80px;
  }
  .pool-item {
    display: flex; align-items: center; gap: 12px; padding: 14px 18px;
    background: var(--card); border: 2px solid var(--border); border-radius: 12px;
    cursor: pointer; user-select: none;
    animation: popIn .25s cubic-bezier(.34,1.56,.64,1);
  }
  .pool-item:hover {
    border-color: var(--orange); transform: translateX(4px);
    box-shadow: 0 6px 14px var(--shadow-orange-sm);
  }
  @keyframes popIn {
    from { transform: scale(.8); opacity: 0; }
    to { transform: scale(1); opacity: 1; }
  }
  .pool-empty-hint { text-align: center; color: var(--text-muted); font-weight: 700; font-size: 14px; padding: 20px; }

  .question-card {
    text-align: center; padding: 30px 20px;
    background: linear-gradient(145deg, var(--orange-light), var(--purple-light));
    border-radius: 20px; border: 2px solid var(--border); margin-bottom: 22px;
    animation: popIn .4s cubic-bezier(.34,1.56,.64,1);
  }
  .question-card .big-emoji { font-size: 56px; margin-bottom: 12px; }
  .question-card .event-text { font-size: 22px; font-weight: 800; color: var(--blue-dark); line-height: 1.35; margin-bottom: 8px; }
  .question-card .question-hint { font-size: 14px; color: var(--text-muted); font-weight: 700; margin-top: 12px; }

  .options { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
  .option-text {
    padding: 22px 16px; font-size: 20px; font-weight: 800; border-radius: 16px;
    background: var(--card); border: 2px solid var(--border); color: var(--text);
    cursor: pointer; text-align: center; user-select: none;
    word-break: break-word; font-family: inherit; line-height: 1.3;
  }
  .option-text.year { font-family: 'Courier New', monospace; letter-spacing: 2px; }
  .option-text:hover:not(:disabled) {
    background: var(--blue-light); border-color: var(--blue);
    transform: translateY(-2px); box-shadow: 0 8px 18px var(--shadow-btn);
  }
  .option-text:disabled { cursor: default; }
  .option-text.correct {
    background: var(--result-correct-bg); border-color: var(--green);
    transform: scale(1.02); box-shadow: 0 0 0 4px rgba(34,197,94,.15);
  }
  .option-text.wrong { background: var(--result-wrong-bg); border-color: var(--red); animation: shake .35s ease; }
  .option-text.dimmed { opacity: .35; }
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-6px); }
    50% { transform: translateX(6px); }
    75% { transform: translateX(-4px); }
  }
  .settings-row {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 10px; font-size: 15px; color: var(--text); font-weight: 700;
  }
  .settings-row b { color: var(--blue-dark); font-size: 16px; font-weight: 800; }
  input[type="range"] { width: 100%; accent-color: #FF8C42; height: 26px; }
  .btn-main {
    display: block; margin: 24px auto 0; padding: 16px 40px; border-radius: 14px;
    border: none; background: var(--orange); color: #fff; font-size: 17px;
    font-weight: 800; cursor: pointer; letter-spacing: .5px;
    box-shadow: 0 8px 20px var(--shadow-orange); font-family: inherit;
  }
  .btn-main:hover { background: var(--orange-dark); transform: translateY(-2px); box-shadow: 0 12px 28px var(--shadow-orange-lg); }
  .btn-main:active { transform: translateY(0); }
  .btn-secondary {
    display: block; margin: 8px auto 0; padding: 12px 30px; border-radius: 14px;
    border: none; background: transparent; color: var(--blue-dark);
    font-size: 15px; font-weight: 700; cursor: pointer; font-family: inherit;
  }
  .btn-secondary:hover { background: var(--blue-light); }
  .timer-bar { height: 10px; border-radius: 10px; background: var(--border); overflow: hidden; margin-bottom: 20px; }
  .timer-fill {
    height: 100%; background: linear-gradient(90deg, var(--green), var(--yellow), var(--red));
    transition: width 0.5s linear; width: 100%;
  }
  .result-screen { text-align: center; padding: 20px 0; }
  .result-screen .big { font-size: 72px; margin-bottom: 12px; animation: popIn .5s cubic-bezier(.34,1.56,.64,1); }
  .result-screen h2 { font-size: 26px; margin-bottom: 10px; color: var(--blue-dark); font-weight: 800; }
  .result-screen p { color: var(--text-muted); font-size: 16px; margin: 6px 0; font-weight: 600; }
  .stars { font-size: 40px; margin: 20px 0; letter-spacing: 6px; }
  .review-block { margin-top: 20px; padding: 16px; background: var(--review-bg); border-radius: 14px; text-align: left; }
  .review-block .label {
    font-size: 12px; color: var(--text-muted); font-weight: 800;
    text-transform: uppercase; letter-spacing: 1px; margin-bottom: 10px;
  }
  .review-block .item {
    display: flex; align-items: center; gap: 12px; padding: 8px 0;
    font-size: 15px; font-weight: 700; color: var(--blue-dark);
  }
  .review-block .item-year {
    font-family: 'Courier New', monospace; font-weight: 900;
    color: var(--orange-dark); min-width: 60px;
  }
  .review-answers { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; margin-top: 14px; }
  .review-answers .ans {
    display: flex; align-items: center; justify-content: center;
    width: 36px; height: 36px; border-radius: 10px; font-size: 18px;
    font-weight: 800; border: 2px solid;
  }
  .review-answers .ans.ok { background: var(--result-correct-bg); border-color: var(--green); }
  .review-answers .ans.wrong { background: var(--result-wrong-bg); border-color: var(--red); }

  /* ===== РЕЖИМ БЕЗ ЭМОДЗИ ===== */
  .no-emoji .timeline-emoji,
  .no-emoji .slot-emoji,
  .no-emoji .big-emoji,
  .no-emoji .cat-emoji,
  .no-emoji .option-emoji { display: none !important; }
  .no-emoji .timeline-item { padding-left: 22px; }
  .no-emoji .slot { padding-left: 22px; }
  .no-emoji .pool-item { padding-left: 22px; }
  .no-emoji .question-card { padding: 26px 20px; }
  .no-emoji .review-block .item { gap: 18px; }

  @media (max-width: 500px) {
    .timeline-year { font-size: 18px; min-width: 58px; }
    .timeline-event { font-size: 14px; }
    .timeline-emoji { font-size: 22px; }
    .option-text { font-size: 16px; padding: 16px 10px; }
    .preset-btn { font-size: 12px; }
    .segment-btn { font-size: 12px; padding: 10px 6px; }
    .slot-event, .pool-item { font-size: 14px; }
    .question-card .event-text { font-size: 18px; }
    .question-card .big-emoji { font-size: 44px; }
    .cat-grid { grid-template-columns: repeat(2, 1fr); }
    .cat-btn .cat-emoji { font-size: 18px; }
    .cat-btn .cat-name { font-size: 10px; }
    h1 { font-size: 16px; }
  }
</style>

<body>
<div class="container">
  <header>
    <button class="back-btn" onclick="location.href='index.html'">←</button>
    <h1>🕰 ИСТОРИЯ ПО ДАТАМ</h1>
    <div class="header-right">
      <button class="theme-toggle" id="themeToggle" aria-label="Переключить тему" title="Сменить тему">
        <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="4"/>
          <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/>
        </svg>
        <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
        </svg>
      </button>
      <div class="score-bar">Очки: <span id="globalScore">0</span></div>
    </div>
  </header>
  <main id="game"></main>
</div>

<script>
/* ============ УТИЛИТЫ ============ */
const $ = id => document.getElementById(id);
const gameEl = $('game');
let globalScore = 0;
$('globalScore').textContent = globalScore;
function addScore(n) { globalScore += n; $('globalScore').textContent = globalScore; }

function shuffle(a) {
  const arr = [...a];
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}
const rand = n => Math.floor(Math.random() * n);

let timeouts = [];
function wait(ms, fn) { const id = setTimeout(fn, ms); timeouts.push(id); return id; }
function clearTimeouts() { timeouts.forEach(clearTimeout); timeouts = []; }

let audioCtx = null;
function initAudio() {
  if (!audioCtx) {
    try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) {}
  }
}
function beep(freq, dur = 0.15, type = 'sine', vol = 0.08) {
  if (!audioCtx) return;
  try {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.type = type; osc.frequency.value = freq;
    const t = audioCtx.currentTime;
    gain.gain.setValueAtTime(vol, t);
    gain.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    osc.start(t); osc.stop(t + dur + 0.02);
  } catch(e) {}
}
function sfxCorrect() { beep(660, 0.1); setTimeout(() => beep(880, 0.15), 90); }
function sfxWrong() { beep(180, 0.3, 'sawtooth', 0.12); }
function sfxClick() { beep(440, 0.05, 'triangle', 0.06); }
function sfxWin() { [523, 659, 784, 1047].forEach((f, i) => setTimeout(() => beep(f, 0.2), i * 120)); }

/* ============ ПЕРЕКЛЮЧАТЕЛЬ ТЕМЫ ============ */
function setupThemeToggle() {
  const btn = $('themeToggle');
  if (!btn) return;
  btn.onclick = () => {
    const cur = document.documentElement.getAttribute('data-theme') || 'light';
    const next = cur === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', next);
    try { localStorage.setItem('theme', next); } catch(e) {}
    sfxClick();
  };
}

/* ============ БАЗА СОБЫТИЙ ============ */

/* 🌍 Мировая история */
const EVENTS_WORLD = [
  { year: 3000, event: 'Основание Египетского царства', emoji: '🏛️' },
  { year: 776, event: 'Первые Олимпийские игры (Др. Греция)', emoji: '🏅' },
  { year: 753, event: 'Основание Рима', emoji: '🏛️' },
  { year: 586, event: 'Разрушение Первого Иерусалимского храма', emoji: '🕯️' },
  { year: 490, event: 'Марафонская битва', emoji: '⚔️' },

  music:     { name: 'Мир.музыка',    emoji: '🎵', events: EVENTS_MUSIC },
  cinema:    { name: 'Кино',          emoji: '🎬', events: EVENTS_CINEMA },
  space:     { name: 'Космос',        emoji: '🚀', events: EVENTS_SPACE },
  sport:     { name: 'Спорт',         emoji: '🏅', events: EVENTS_SPORT },
  geo:       { name: 'Открытия',      emoji: '🧭', events: EVENTS_GEO }
};

const ALL_EVENTS = Object.values(CATEGORIES).flatMap(c => c.events);

/* ============ НАСТРОЙКИ ============ */
let historyCfg = {
  count: 5,
  showTime: 15,
  category: 'mix',
  mode: 'order',
  noEmoji: false
};
try {
  const s = localStorage.getItem('historyCfg');
  if (s) historyCfg = { ...historyCfg, ...JSON.parse(s) };
} catch(e) {}

/* ============ ЭКРАН НАСТРОЕК ============ */
function startHistory() {
  clearTimeouts();

  const catBtns = Object.keys(CATEGORIES).map(key => {
    const c = CATEGORIES[key];
    return `<button class="cat-btn" data-cat="${key}">
      <div class="cat-emoji">${c.emoji}</div>
      <div class="cat-name">${c.name}</div>
      <div class="cat-count">${c.events.length}</div>
    </button>`;
  }).join('');

  gameEl.innerHTML = `
    <div class="game-header">
      <h2>🕰 История по датам</h2>
      <div class="subtitle">Запомни хронологию — потом расставь по порядку</div>
    </div>
    <div class="panel">
      <div style="max-width: 560px; margin: 0 auto;">

        <div class="presets" id="presets">
          <button class="preset-btn" data-count="4" data-time="20" data-cat="rus" data-mode="order">🌱 Разминка</button>
          <button class="preset-btn" data-count="5" data-time="15" data-cat="mix" data-mode="order">⚡ Стандарт</button>
          <button class="preset-btn" data-count="7" data-time="10" data-cat="mix" data-mode="years">🔥 Сложнее</button>
          <button class="preset-btn" data-count="15" data-time="20" data-cat="mix" data-mode="order">💀 Хардкор</button>
        </div>

        <label style="display:block; margin-bottom: 20px;">
          <div class="settings-row"><span>Сколько событий</span><b id="countVal">${historyCfg.count}</b></div>
          <input type="range" id="countRange" min="3" max="20" value="${historyCfg.count}">
        </label>

        <label style="display:block; margin-bottom: 20px;">
          <div class="settings-row"><span>Время показа</span><b id="timeVal">${historyCfg.showTime} сек</b></div>
          <input type="range" id="timeRange" min="3" max="90" value="${historyCfg.showTime}">
        </label>

        <div style="margin-bottom: 20px;">
          <div class="settings-row"><span>Категория</span><b id="catVal">все вместе</b></div>
          <div class="cat-grid" id="catGrid">
            <button class="cat-btn" data-cat="mix" style="grid-column: span 3;">
              <div class="cat-emoji">🎲</div>
              <div class="cat-name">Микс — все категории</div>
              <div class="cat-count">${ALL_EVENTS.length} событий</div>
            </button>
            ${catBtns}
          </div>
        </div>

        <div style="margin-bottom: 20px;">
          <div class="settings-row"><span>Режим проверки</span><b id="modeVal">по порядку</b></div>
          <div class="segment" id="modeRow">
            <button class="segment-btn" data-mode="order">По порядку<small>расставить</small></button>
            <button class="segment-btn" data-mode="years">Годы<small>какой год</small></button>
            <button class="segment-btn" data-mode="before">Раньше/позже<small>что было первым</small></button>
          </div>
        </div>

        <div style="margin-bottom: 20px;">
          <div class="settings-row"><span>Эмодзи</span><b id="emojiVal">с эмодзи</b></div>
          <div class="segment" id="emojiRow">
            <button class="segment-btn" data-emoji="false">😀 С эмодзи<small>нагляднее</small></button>
            <button class="segment-btn" data-emoji="true">📝 Без эмодзи<small>только текст и даты</small></button>
          </div>
        </div>

        <div class="subtitle" style="text-align:left; padding: 14px; background: var(--blue-light); border-radius: 12px; line-height: 1.5;">
          💡 <b>Как играть:</b> увидишь список реальных событий с годами. Запомни порядок и даты. Потом исчезнет — и надо будет восстановить по памяти.<br>
          🧠 <b>Без эмодзи</b> — хардкорный режим для тренировки памяти: остаются только текст и даты.
        </div>

        <button class="btn-main" id="startBtn">Начать 🕰</button>
      </div>
    </div>
  `;

  const countRange = $('countRange');
  const timeRange = $('timeRange');

  function catName(c) {
    if (c === 'mix') return 'все вместе';
    return CATEGORIES[c] ? CATEGORIES[c].name : c;
  }
  function modeName(m) {
    return m === 'order' ? 'по порядку' : m === 'years' ? 'годы' : 'раньше/позже';
  }
  function emojiName(e) { return e ? 'без эмодзи' : 'с эмодзи'; }

  function updateCatUI() {
    $('catVal').textContent = catName(historyCfg.category);
    gameEl.querySelectorAll('.cat-btn').forEach(b => {
      b.classList.toggle('active', b.dataset.cat === historyCfg.category);
    });
  }
  function updateModeUI() {
    $('modeVal').textContent = modeName(historyCfg.mode);
    gameEl.querySelectorAll('#modeRow .segment-btn').forEach(b => {
      b.classList.toggle('active', b.dataset.mode === historyCfg.mode);
    });
  }
  function updateEmojiUI() {
    $('emojiVal').textContent = emojiName(historyCfg.noEmoji);
    gameEl.querySelectorAll('#emojiRow .segment-btn').forEach(b => {
      b.classList.toggle('active', (b.dataset.emoji === 'true') === !!historyCfg.noEmoji);
    });
  }
  function markPresetActive() {
    document.querySelectorAll('.preset-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.preset-btn').forEach(b => {
      if (+b.dataset.count === +countRange.value &&
          +b.dataset.time === +timeRange.value &&
          b.dataset.cat === historyCfg.category &&
          b.dataset.mode === historyCfg.mode) {
        b.classList.add('active');
      }
    });
  }

  gameEl.querySelectorAll('.cat-btn').forEach(b => {
    b.onclick = () => {
      historyCfg.category = b.dataset.cat;
      updateCatUI(); markPresetActive(); sfxClick();
    };
  });

  gameEl.querySelectorAll('#modeRow .segment-btn').forEach(b => {
    b.onclick = () => {
      historyCfg.mode = b.dataset.mode;
      updateModeUI(); markPresetActive(); sfxClick();
    };
  });

  gameEl.querySelectorAll('#emojiRow .segment-btn').forEach(b => {
    b.onclick = () => {
      historyCfg.noEmoji = (b.dataset.emoji === 'true');
      updateEmojiUI(); sfxClick();
    };
  });

  document.querySelectorAll('.preset-btn').forEach(b => {
    b.onclick = () => {
      countRange.value = b.dataset.count;
      timeRange.value = b.dataset.time;
      historyCfg.category = b.dataset.cat;
      historyCfg.mode = b.dataset.mode;
      $('countVal').textContent = b.dataset.count;
      $('timeVal').textContent = b.dataset.time + ' сек';
      updateCatUI(); updateModeUI(); markPresetActive(); sfxClick();
    };
  });

  countRange.oninput = () => { $('countVal').textContent = countRange.value; markPresetActive(); sfxClick(); };
  timeRange.oninput = () => { $('timeVal').textContent = timeRange.value + ' сек'; markPresetActive(); sfxClick(); };

  updateCatUI(); updateModeUI(); updateEmojiUI(); markPresetActive();

  $('startBtn').onclick = () => {
    historyCfg.count = +countRange.value;
    historyCfg.showTime = +timeRange.value;
    try { localStorage.setItem('historyCfg', JSON.stringify(historyCfg)); } catch(e) {}
    historyShow();
  };
}

/* ============ ГЕНЕРАЦИЯ ============ */
function getEventPool() {
  if (historyCfg.category === 'mix') return [...ALL_EVENTS];
  return CATEGORIES[historyCfg.category] ? [...CATEGORIES[historyCfg.category].events] : [...ALL_EVENTS];
}

function generateTimeline() {
  const count = historyCfg.count;
  if (historyCfg.category === 'mix') {
    const keys = Object.keys(CATEGORIES);
    const picked = [];
    const used = new Set();
    let guard = 0;
    while (picked.length < count && guard < 600) {
      guard++;
      const k = keys[rand(keys.length)];
      const pool = CATEGORIES[k].events;
      const ev = pool[rand(pool.length)];
      const uid = `${ev.year}-${ev.event}`;
      if (used.has(uid)) continue;
      used.add(uid);
      picked.push(ev);
    }
    return picked.sort((a, b) => a.year - b.year);
  }
  const pool = getEventPool();
  return shuffle(pool).slice(0, count).sort((a, b) => a.year - b.year);
}

function applyEmojiMode() {
  if (historyCfg.noEmoji) gameEl.classList.add('no-emoji');
  else gameEl.classList.remove('no-emoji');
}

/* ============ ФАЗА 1: ПОКАЗ ============ */
function historyShow() {
  clearTimeouts();
  applyEmojiMode();
  const showTime = historyCfg.showTime;
  const timeline = generateTimeline();

  gameEl.innerHTML = `
    <div class="game-header">
      <h2>🕰 История по датам</h2>
      <div class="subtitle">Запоминай хронологию... <span id="time">${showTime}</span> сек</div>
    </div>
    <div class="panel">
      <div class="timer-bar"><div class="timer-fill" id="tfill" style="width:100%"></div></div>
      <div class="status warn">Запоминай годы и события</div>
      <div class="timeline" id="timeline"></div>
    </div>
  `;

  const timelineEl = $('timeline');
  timeline.forEach((item, i) => {
    const el = document.createElement('div');
    el.className = 'timeline-item';
    el.style.animationDelay = (i * 0.1) + 's';
    el.innerHTML = `
      <div class="timeline-year">${item.year}</div>
      <div class="timeline-sep">—</div>
      <div class="timeline-event">${item.event}</div>
      <div class="timeline-emoji">${item.emoji}</div>
    `;
    timelineEl.appendChild(el);
    wait(i * 120 + 100, () => beep(400 + i * 60, 0.08));
  });

  let left = showTime;
  const intervalId = setInterval(() => {
    left--;
    const t = $('time'); if (t) t.textContent = Math.max(0, left);
    const f = $('tfill'); if (f) f.style.width = (Math.max(0, left) / showTime * 100) + '%';
    if (left <= 0) clearInterval(intervalId);
  }, 1000);
  timeouts.push(intervalId);

  wait(showTime * 1000, () => {
    if (historyCfg.mode === 'order') historyOrder(timeline);
    else if (historyCfg.mode === 'years') historyYears(timeline);
    else historyBefore(timeline);
  });
}

/* ============ РЕЖИМ «ПОРЯДОК» ============ */
function historyOrder(timeline) {
  clearTimeouts();
  applyEmojiMode();
  const count = timeline.length;
  const slots = Array(count).fill(null);
  const pool = shuffle([...timeline]);

  gameEl.innerHTML = `
    <div class="game-header">
      <h2>🕰 История по датам</h2>
      <div class="subtitle">Расставь события от раннего к позднему</div>
    </div>
    <div class="panel">
      <div class="status">Клик по событию → в следующий свободный слот. Клик по слоту → вернуть.</div>
      <div class="slots" id="slots"></div>
      <div class="pool" id="pool"></div>
      <button class="btn-main" id="checkBtn">Проверить ✓</button>
    </div>
  `;

  const slotsEl = $('slots');
  const poolEl = $('pool');

  function renderAll() {
    slotsEl.innerHTML = '';
    for (let i = 0; i < count; i++) {
      const s = document.createElement('div');
      s.className = 'slot' + (slots[i] ? ' filled' : '');
      s.dataset.idx = i;
      if (slots[i]) {
        s.innerHTML = `
          <div class="slot-num">${i + 1}</div>
          <div class="slot-emoji">${slots[i].emoji}</div>
          <div class="slot-event">${slots[i].event}</div>
        `;
        s.onclick = () => {
          pool.push(slots[i]);
          slots[i] = null;
          beep(360, 0.06, 'triangle', 0.06);
          renderAll();
        };
      } else {
        s.innerHTML = `
          <div class="slot-num">${i + 1}</div>
          <div class="slot-placeholder">пусто</div>
        `;
      }
      slotsEl.appendChild(s);
    }

    poolEl.innerHTML = '';
    if (pool.length === 0) {
      poolEl.innerHTML = '<div class="pool-empty-hint">Все события разложены ✓</div>';
    } else {
      pool.forEach((item, idx) => {
        const p = document.createElement('div');
        p.className = 'pool-item';
        p.innerHTML = `
          <div class="slot-emoji">${item.emoji}</div>
          <div class="slot-event">${item.event}</div>
        `;
        p.onclick = () => {
          const emptyIdx = slots.indexOf(null);
          if (emptyIdx === -1) return;
          slots[emptyIdx] = item;
          pool.splice(idx, 1);
          beep(620, 0.06, 'triangle', 0.07);
          renderAll();
        };
        poolEl.appendChild(p);
      });
    }
  }
  renderAll();

  $('checkBtn').onclick = () => {
    let correctPos = 0;
    let correctItems = 0;
    for (let i = 0; i < count; i++) {
      if (slots[i] === timeline[i]) correctPos++;
    }
    const remaining = [...timeline];
    for (let i = 0; i < count; i++) {
      const s = slots[i];
      if (s) {
        const idx = remaining.indexOf(s);
        if (idx !== -1) { correctItems++; remaining.splice(idx, 1); }
      }
    }

    slotsEl.querySelectorAll('.slot').forEach((el, i) => {
      el.onclick = null;
      el.style.cursor = 'default';
      if (slots[i] === timeline[i]) el.classList.add('result-correct');
      else if (slots[i] && timeline.includes(slots[i])) el.classList.add('result-misplaced');
      else el.classList.add('result-wrong');
    });

    let emoji, title, text, stars, points;
    if (correctPos === count) {
      emoji = '🏆'; title = 'Идеальный порядок!';
      text = `Все ${count} событий на своих местах`;
      stars = 3; points = 50;
      sfxWin();
    } else if (correctItems === count) {
      emoji = '🎖️'; title = 'Порядок перепутан';
      text = `Все события угаданы, но ${count - correctPos} стоят не там`;
      stars = 2; points = 30;
      sfxCorrect();
    } else if (correctItems >= Math.ceil(count / 2)) {
      emoji = '🔍'; title = 'Что-то забыл';
      text = `Вспомнил ${correctItems} из ${count}`;
      stars = 1; points = 15;
      sfxCorrect();
    } else {
      emoji = '🌀'; title = 'Всё перемешалось';
      text = `Только ${correctItems} из ${count}`;
      stars = 0; points = 5;
      sfxWrong();
    }
    addScore(points);

    wait(1400, () => {
      historyResult({
        emoji, title, text, stars, points,
        timeline,
        history: slots.map((s, i) => s === timeline[i])
      });
    });
  };
}

/* ============ РЕЖИМ «ГОДЫ» ============ */
function historyYears(timeline) {
  clearTimeouts();
  applyEmojiMode();
  const questionPool = shuffle([...timeline]);
  const history = [];

  function askNext(idx) {
    if (idx >= questionPool.length) {
      const score = history.filter(Boolean).length;
      return historyResult({
        emoji: score === questionPool.length ? '🏆' : score >= questionPool.length * 0.7 ? '📜' : score >= questionPool.length / 2 ? '🔍' : '🌀',
        title: score === questionPool.length ? 'Историк года!' : score >= questionPool.length * 0.7 ? 'Хорошо помнишь' : score >= questionPool.length / 2 ? 'Неплохо' : 'Даты расплылись',
        text: `Правильно: ${score} из ${questionPool.length}`,
        stars: score === questionPool.length ? 3 : score >= questionPool.length * 0.7 ? 2 : score >= questionPool.length / 2 ? 1 : 0,
        points: Math.round(score / questionPool.length * 40),
        timeline, history
      });
    }

    const cur = questionPool[idx];
    let pool;
    if (historyCfg.category !== 'mix' && CATEGORIES[historyCfg.category]) {
      pool = CATEGORIES[historyCfg.category].events;
    } else {
      pool = ALL_EVENTS;
    }
    const close = pool.filter(e => e.year !== cur.year && Math.abs(e.year - cur.year) <= 150).map(e => e.year);
    const far = pool.filter(e => e.year !== cur.year && Math.abs(e.year - cur.year) > 150).map(e => e.year);
    let wrongs = shuffle(close).slice(0, 3);
    if (wrongs.length < 3) {
      const extra = shuffle(far).slice(0, 3 - wrongs.length);
      wrongs = [...wrongs, ...extra];
    }
    const options = shuffle([cur.year, ...wrongs]);

    const dotsHtml = questionPool.map((_, i) => {
      let cls = 'dot';
      if (i < idx) cls += history[i] ? ' correct' : ' wrong';
      else if (i === idx) cls += ' active';
      return `<div class="${cls}"></div>`;
    }).join('');

    gameEl.innerHTML = `
      <div class="game-header">
        <h2>🕰 История по датам</h2>
        <div class="subtitle">Вопрос ${idx + 1} / ${questionPool.length}</div>
      </div>
      <div class="panel">
        <div class="progress-dots">${dotsHtml}</div>
        <div class="question-card">
          <div class="big-emoji">${cur.emoji}</div>
          <div class="event-text">${cur.event}</div>
          <div class="question-hint">В каком году это было?</div>
        </div>
        <div class="options" id="opts"></div>
      </div>
    `;

    const opts = $('opts');
    let answered = false;

    options.forEach(y => {
      const b = document.createElement('div');
      b.className = 'option-text year';
      b.textContent = y;
      b.onclick = () => {
        if (answered) return;
        answered = true;
        const good = y === cur.year;
        opts.querySelectorAll('.option-text').forEach(x => {
          x.style.pointerEvents = 'none';
          if (+x.textContent !== cur.year && x !== b) x.classList.add('dimmed');
        });
        if (good) {
          b.classList.add('correct');
          sfxCorrect(); addScore(10);
        } else {
          b.classList.add('wrong');
          sfxWrong();
          opts.querySelectorAll('.option-text').forEach(x => {
            if (+x.textContent === cur.year) {
              x.classList.add('correct');
              x.classList.remove('dimmed');
            }
          });
        }
        history.push(good);
        wait(1100, () => askNext(idx + 1));
      };
      opts.appendChild(b);
    });
  }
  askNext(0);
}

/* ============ РЕЖИМ «РАНЬШЕ/ПОЗЖЕ» ============ */
function historyBefore(timeline) {
  clearTimeouts();
  applyEmojiMode();
  const pairCount = Math.min(6, Math.max(3, timeline.length));
  const pairs = [];
  const usedPairs = new Set();
  let guard = 0;
  while (pairs.length < pairCount && guard < 100) {
    guard++;
    const a = timeline[rand(timeline.length)];
    const b = timeline[rand(timeline.length)];
    if (a === b) continue;
    const key = [a.year, b.year].sort().join('-');
    if (usedPairs.has(key)) continue;
    usedPairs.add(key);
    pairs.push([a, b]);
  }
  const history = [];

  function askNext(idx) {
    if (idx >= pairs.length) {
      const score = history.filter(Boolean).length;
      const max = pairs.length;
      return historyResult({
        emoji: score === max ? '🏆' : score >= max * 0.7 ? '📜' : score >= max / 2 ? '🔍' : '🌀',
        title: score === max ? 'Хронология в кармане!' : score >= max * 0.7 ? 'Хорошо' : score >= max / 2 ? 'Неплохо' : 'Путаница',
        text: `Правильно: ${score} из ${max}`,
        stars: score === max ? 3 : score >= max * 0.7 ? 2 : score >= max / 2 ? 1 : 0,
        points: Math.round(score / max * 40),
        timeline, history
      });
    }

    const [a, b] = pairs[idx];
    const earlier = a.year < b.year ? a : b;

    const dotsHtml = pairs.map((_, i) => {
      let cls = 'dot';
      if (i < idx) cls += history[i] ? ' correct' : ' wrong';
      else if (i === idx) cls += ' active';
      return `<div class="${cls}"></div>`;
    }).join('');

    const options = shuffle([a, b]);

    gameEl.innerHTML = `
      <div class="game-header">
        <h2>🕰 История по датам</h2>
        <div class="subtitle">Вопрос ${idx + 1} / ${pairs.length}</div>
      </div>
      <div class="panel">
        <div class="progress-dots">${dotsHtml}</div>
        <div class="question-card">
          <div class="big-emoji">⏳</div>
          <div class="event-text">Что было РАНЬШЕ?</div>
        </div>
        <div class="options" id="opts"></div>
      </div>
    `;

    const opts = $('opts');
    let answered = false;

    options.forEach(opt => {
      const b = document.createElement('div');
      b.className = 'option-text';
      b.innerHTML = `<span class="option-emoji">${opt.emoji}</span><br><span>${opt.event}</span>`;
      b.onclick = () => {
        if (answered) return;
        answered = true;
        const good = opt === earlier;
        opts.querySelectorAll('.option-text').forEach(x => {
          x.style.pointerEvents = 'none';
          if (x !== b) x.classList.add('dimmed');
        });
        if (good) {
          b.classList.add('correct');
          sfxCorrect(); addScore(10);
        } else {
          b.classList.add('wrong');
          sfxWrong();
          opts.querySelectorAll('.option-text').forEach(x => {
            if (x !== b) {
              x.classList.add('correct');
              x.classList.remove('dimmed');
            }
          });
        }
        history.push(good);
        wait(1200, () => askNext(idx + 1));
      };
      opts.appendChild(b);
    });
  }
  askNext(0);
}

/* ============ РЕЗУЛЬТАТ ============ */
function historyResult(data) {
  applyEmojiMode();
  const { emoji, title, text, stars, points, timeline, history } = data;
  addScore(points);
  const starStr = '⭐'.repeat(stars) + '☆'.repeat(3 - stars);

  const historyRow = history.map(ok => `
    <div class="ans ${ok ? 'ok' : 'wrong'}">${ok ? '✓' : '✗'}</div>
  `).join('');

  const timelineHtml = timeline.map(item => `
    <div class="item">
      <div class="item-year">${item.year}</div>
      <div>${historyCfg.noEmoji ? '' : item.emoji + ' '}${item.event}</div>
    </div>
  `).join('');

  gameEl.innerHTML = `
    <div class="panel">
      <div class="result-screen">
        <div class="big">${emoji}</div>
        <h2>${title}</h2>
        <p>${text}</p>
        <div class="stars">${starStr}</div>
        <p style="opacity:.6; font-size: 14px;">+${points} очков</p>

        <div class="review-block">
          <div class="label">🕰 Правильная хронология:</div>
          ${timelineHtml}
        </div>

        <div class="review-answers">${historyRow}</div>

        <button class="btn-main" id="retry">Ещё раз 🔄</button>
        <button class="btn-secondary" id="menuBtn">← Настройки</button>
      </div>
    </div>
  `;
  $('retry').onclick = () => historyShow();
  $('menuBtn').onclick = () => startHistory();
}

/* ============ СТАРТ ============ */
setupThemeToggle();
document.addEventListener('click', initAudio, { once: true });
startHistory();
</script>

<script src="../assets/menu-drawer.js"></script>
