<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Орфография — NeuroX</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito+Sans:wght@400;600;700;800&display=swap" rel="stylesheet" />

  <!-- Общие стили -->
  <link rel="stylesheet" href="../shared/styles.css" />

  <!-- Уникальные стили «Орфография» -->
  <style>
    /* Метка «назад» на логотипе */
    .logo { position: relative; }
    .logo::after {
      content: '←';
      position: absolute;
      top: -4px; left: -6px;
      width: 22px; height: 22px;
      display: flex; align-items: center; justify-content: center;
      background: #FF6A00; color: #fff;
      font-size: 13px; font-weight: 800;
      border-radius: 50%;
      box-shadow: 0 2px 6px rgba(0, 0, 0, .3);
      font-family: "Nunito Sans", sans-serif;
      line-height: 1;
      pointer-events: none;
    }
    @media (max-width: 700px) {
      .logo::after { width: 20px; height: 20px; font-size: 12px; top: -3px; left: -5px; }
    }

    /* 1. РАЗБОР ПО СОСТАВУ */
    @keyframes morfPulse {
      0%, 100% { opacity: 1; }
      50%      { opacity: .3; }
    }
    .morf { transition: opacity .3s; }
    .card-1:hover .morf-1 { animation: morfPulse 2.2s ease-in-out infinite; }
    .card-1:hover .morf-2 { animation: morfPulse 2.2s ease-in-out infinite .35s; }
    .card-1:hover .morf-3 { animation: morfPulse 2.2s ease-in-out infinite .7s; }
    .card-1:hover .morf-4 { animation: morfPulse 2.2s ease-in-out infinite 1.05s; }

    /* 2. ПРОВЕРОЧНОЕ СЛОВО */
    @keyframes ringPulse {
      0%, 100% { transform: scale(1);    opacity: .55; }
      50%      { transform: scale(1.16); opacity: 1;   }
    }
    @keyframes letterPulse {
      0%, 100% { fill: var(--blue); }
      50%      { fill: #FF6A00;     }
    }
    .check-ring {
      transform-box: fill-box;
      transform-origin: center;
      transition: opacity .3s;
    }
    .check-letter { transition: fill .3s; }
    .card-2:hover .check-ring   { animation: ringPulse 1.8s ease-in-out infinite; }
    .card-2:hover .check-letter { animation: letterPulse 1.8s ease-in-out infinite; }

    /* 3. БУКВА ЗА БУКВОЙ */
    @keyframes tileFly {
      0%, 100% { transform: rotate(-28deg) translate(0, 0);      opacity: 1;   }
      50%      { transform: rotate(-28deg) translate(4px, -3px); opacity: .35; }
    }
    @keyframes sparkPulse {
      0%, 100% { opacity: .9; transform: scale(1);    }
      50%      { opacity: .3; transform: scale(0.85); }
    }
    .ys-tile {
      transform-box: fill-box;
      transform-origin: center;
    }
    .spark {
      transform-box: fill-box;
      transform-origin: center;
    }
    .card-3:hover .ys-tile { animation: tileFly 2s ease-in-out infinite; }
    .card-3:hover .spark   { animation: sparkPulse 2s ease-in-out infinite; }
  </style>
</head>

<body>

  <div class="container">
    <div class="cards">

      <!-- 1. РАЗБОР СЛОВА ПО СОСТАВУ -->
      <div class="card card-1" onclick="openTrainer('morfems.html')">
        <div class="left">
          <div class="icon-wrap">
            <svg viewBox="0 0 48 48" fill="none">
              <rect class="morf morf-1" x="6"  y="18" width="7"  height="12" rx="2" fill="currentColor"/>
              <rect class="morf morf-2" x="15" y="18" width="14" height="12"          fill="#FF6A00"/>
              <rect class="morf morf-3" x="30" y="18" width="7"  height="12"          fill="currentColor"/>
              <rect class="morf morf-4" x="38" y="18" width="4"  height="12" rx="2"   fill="currentColor" opacity=".55"/>
              <path d="M8 36 L40 36" stroke="currentColor" stroke-width="2" stroke-linecap="round" opacity=".35"/>
            </svg>
          </div>
          <div class="card-text">
            <div class="title">Разбор слова по составу</div>
          </div>
        </div>
        <div class="arrow">›</div>
      </div>

      <!-- 2. ПРОВЕРОЧНОЕ СЛОВО -->
      <div class="card card-2" onclick="openTrainer('chek.html')">
        <div class="left">
          <div class="icon-wrap">
            <svg viewBox="0 0 48 48" fill="none">
              <text x="10" y="32" font-family="Fredoka, sans-serif" font-size="18" font-weight="700" fill="currentColor" stroke="none" text-anchor="middle">в</text>
              <text class="check-letter" x="24" y="32" font-family="Fredoka, sans-serif" font-size="18" font-weight="700" fill="currentColor" stroke="none" text-anchor="middle">о</text>
              <text x="38" y="32" font-family="Fredoka, sans-serif" font-size="18" font-weight="700" fill="currentColor" stroke="none" text-anchor="middle">д</text>
              <circle class="check-ring" cx="24" cy="26" r="11" fill="none" stroke="#FF6A00" stroke-width="2" stroke-dasharray="3 2.5"/>
            </svg>
          </div>
          <div class="card-text">
            <div class="title">Проверочное слово</div>
          </div>
        </div>
        <div class="arrow">›</div>
      </div>

      <!-- 3. БУКВА ЗА БУКВОЙ -->
      <div class="card card-3" onclick="openTrainer('ins/insert.html')">
        <div class="left">
          <div class="icon-wrap">
            <svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
              <g transform="rotate(14 18 20)">
                <rect x="6" y="10" width="18" height="18" rx="5" fill="#FF6A00"/>
                <text x="15" y="24" text-anchor="middle" fill="#fff"
                      font-family="Fredoka, system-ui, sans-serif"
                      font-weight="700" font-size="14">И</text>
              </g>

              <g class="ys-tile" transform="rotate(-28 52 20)">
                <rect x="44" y="8" width="16" height="16" rx="4.5" fill="currentColor"/>
                <text x="52" y="21" text-anchor="middle" fill="#fff"
                      font-family="Fredoka, system-ui, sans-serif"
                      font-weight="700" font-size="12">Ы</text>
              </g>

              <g class="spark" stroke="#FF6A00" stroke-width="2" stroke-linecap="round" opacity="0.9">
                <path d="M29 18 L 39 18"/>
                <path d="M34 13 L 34 23"/>
                <path d="M30.5 14.5 L 37.5 21.5"/>
                <path d="M30.5 21.5 L 37.5 14.5"/>
              </g>

              <g stroke="currentColor" stroke-width="1.6" stroke-linecap="round" opacity="0.4" fill="none">
                <path d="M42 27 L 46 30"/>
                <path d="M42 22 L 48 25"/>
                <path d="M41 17 L 47 19"/>
              </g>

              <rect x="20" y="42" width="24" height="14" rx="5" fill="none"
                    stroke="currentColor" stroke-width="2.2" stroke-dasharray="3.5 3"/>
              <path d="M29 49 H 35 M 32 46 V 52"
                    stroke="currentColor" stroke-width="2.2" stroke-linecap="round"
                    opacity="0.5"/>
            </svg>
          </div>
          <div class="card-text">
            <div class="title">Буква за буквой</div>
          </div>
        </div>
        <div class="arrow">›</div>
      </div>

      <!-- Сюда добавляй следующие тренажёры по образцу:

      <div class="card card-4" onclick="openTrainer('dict.html')">
        <div class="left">
          <div class="icon-wrap"> SVG </div>
          <div class="card-text"><div class="title">Словарные слова</div></div>
        </div>
        <div class="arrow">›</div>
      </div>

      -->

    </div>
  </div>

  <!-- Общие скрипты: layout → seasons → app -->
  <script src="../shared/layout.js" defer></script>
  <script src="../shared/seasons.js" defer></script>
  <script src="../shared/storage.js" defer></script>
<script src="../shared/app.js" defer></script>

  <!-- Уникальное для «Орфография» -->
  <script defer>
    (function () {
      'use strict';

      function applyHeader() {
        const h1 = document.querySelector('header h1');
        if (h1) h1.textContent = 'Орфография';

        const subtitle = document.getElementById('headerSubtitle');
        if (subtitle) subtitle.textContent = 'NeuroX · 3 тренажёра';
      }

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', applyHeader);
      } else {
        applyHeader();
      }

      // Клик по логотипу — назад в главное меню
      document.addEventListener('click', function (e) {
        const logo = e.target.closest && e.target.closest('#logoBtn');
        if (!logo) return;
        e.preventDefault();
        e.stopImmediatePropagation();
        location.href = '../index.html';
      }, true);

      // Открытие тренажёра
      window.openTrainer = function (path) {
        location.href = path;
      };

      // Синхронизация иконки темы в шапке
      const SVG_SUN  = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
      const SVG_MOON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>';

      function syncThemeIcon() {
        const btn = document.getElementById('themeBtn');
        if (!btn) return;
        const theme = document.documentElement.getAttribute('data-theme');
        btn.innerHTML = theme === 'dark' ? SVG_SUN : SVG_MOON;
      }

      new MutationObserver(syncThemeIcon).observe(document.documentElement, {
        attributes: true,
        attributeFilter: ['data-theme']
      });
      syncThemeIcon();
    })();
  </script>

</body>

</html>
