<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Мемо - NeuroX</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">

<style>

:root{
    --blue:#1E3F8A;
    --blue-soft:#3A5FA8;
    --blue-light:#2A56C6;
    --blue-pale:#E8EEF9;
    --orange:#FF6A00;
    --orange-soft:#FF8B3D;
    --orange-dark:#E85B00;
    --orange-pale:#FFEADB;
    --bg:#F4F6FB;
}

*{ box-sizing:border-box; }

body {
    margin: 0;
    font-family: "Nunito Sans", sans-serif;
    background-color: var(--bg);
    background-image: radial-gradient(circle, rgba(30,63,138,.07) 1.5px, transparent 1.6px);
    background-size: 26px 26px;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    color: var(--blue);
}

/* ===== HEADER ===== */

.header {
    position: relative;
    width: 100%;
    background: var(--blue);
    color: white;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px 24px 26px;
    font-family: "Fredoka", sans-serif;
    font-size: 24px;
    font-weight: 700;
    letter-spacing: .4px;
    box-shadow: 0 6px 20px rgba(30,63,138,.25);
    overflow: hidden;
}

.header::before,
.header::after {
    content: '';
    position: absolute;
    border-radius: 50%;
    pointer-events: none;
}

.header::before {
    width: 220px;
    height: 220px;
    top: -110px;
    right: -60px;
    background: rgba(255,106,0,.22);
}

.header::after {
    width: 170px;
    height: 170px;
    bottom: -120px;
    left: 30px;
    background: rgba(255,255,255,.09);
}

.header-title {
    position: relative;
    z-index: 1;
}

.back-btn {
    position: absolute;
    left: 20px;
    top: 50%;
    transform: translateY(-50%);
    width: 48px;
    height: 48px;
    border: none;
    border-radius: 16px;
    background: rgba(255,255,255,.18);
    color: #fff;
    font-size: 22px;
    cursor: pointer;
    transition: .22s;
    z-index: 2;
    font-family: inherit;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0;
}

.back-btn:hover {
    background: var(--orange);
    transform: translateY(-50%) rotate(-6deg) scale(1.06);
}

/* ===== START SCREEN ===== */

.start-screen {
    margin-top: 50px;
    display: flex;
    flex-direction: column;
    gap: 18px;
    align-items: center;
    width: min(92vw, 420px);
    background: #fff;
    border-radius: 26px;
    padding: 32px 28px;
    box-shadow: 0 6px 0 rgba(30,63,138,.10),
                0 14px 26px rgba(0,0,0,.06);
}

.start-screen label {
    display: flex;
    justify-content: space-between;
    align-items: center;
    width: 100%;
    font-weight: 700;
    font-size: 15px;
    gap: 14px;
}

.start-screen select {
    font-family: inherit;
    font-weight: 700;
    font-size: 15px;
    color: var(--blue);
    background: var(--blue-pale);
    border: 2px solid transparent;
    border-radius: 12px;
    padding: 10px 14px;
    cursor: pointer;
    transition: .2s;
    flex: 1;
    max-width: 180px;
}

.start-screen select:focus {
    outline: none;
    border-color: var(--orange);
}

.big-btn {
    margin-top: 10px;
    padding: 18px 46px;
    font-family: "Fredoka", sans-serif;
    font-size: 22px;
    font-weight: 700;
    letter-spacing: .5px;
    background: var(--orange);
    color: white;
    border: none;
    border-radius: 18px;
    cursor: pointer;
    box-shadow: 0 6px 0 var(--orange-dark);
    transition: background .15s, transform .12s, box-shadow .12s;
}

.big-btn:hover { background: var(--orange-soft); }

.big-btn:active {
    transform: translateY(4px);
    box-shadow: 0 2px 0 var(--orange-dark);
}

/* ===== GAME ===== */

#game {
    display: flex;
    flex-direction: column;
    align-items: center;
    width: 100%;
    padding: 22px 0 40px;
}

.timer-bar {
    width: min(92vw, 720px);
    height: 12px;
    background: var(--blue-pale);
    border-radius: 999px;
    margin: 8px 0 22px;
    overflow: hidden;
    position: relative;
}

.timer-bar::after {
    content: '';
    position: absolute;
    inset: 0;
    width: 100%;
    background: linear-gradient(90deg, var(--blue), var(--orange));
    border-radius: 999px;
    transition: width 1s linear;
    transform-origin: left;
}

/* ❗ СТАБИЛЬНАЯ СЕТКА */
.grid {
    display: grid;
    gap: 10px;
    width: min(92vw, 720px);
}

/* карточки фиксированные */
.card {
    aspect-ratio: 1 / 1;
    width: 100%;
    perspective: 900px;
    cursor: pointer;
}

.inner {
    width: 100%;
    height: 100%;
    transition: transform 0.55s cubic-bezier(.34, 1.3, .64, 1);
    transform-style: preserve-3d;
    position: relative;
}

.card.flipped .inner {
    transform: rotateY(180deg);
}

.face {
    position: absolute;
    inset: 0;
    border-radius: 18px;
    display: flex;
    justify-content: center;
    align-items: center;
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
}

.front {
    background: linear-gradient(145deg, var(--blue-light), var(--blue));
    color: white;
    font-family: "Fredoka", sans-serif;
    font-size: 20px;
    font-weight: 700;
    box-shadow: 0 4px 0 rgba(30,63,138,.35);
}

.card:hover .front {
    background: linear-gradient(145deg, var(--blue), #17326E);
}

.back {
    background: #fff;
    transform: rotateY(180deg);
    font-size: 42px;
    border: 2px solid var(--blue-pale);
    box-shadow: 0 4px 0 rgba(30,63,138,.08);
}

/* подсветка совпадения */
.card.matching .back {
    background: var(--orange-pale);
    border-color: var(--orange);
    box-shadow: 0 0 0 4px rgba(255,106,0,.15);
    animation: popMatch .45s ease;
}

@keyframes popMatch {
    0% { transform: rotateY(180deg) scale(1); }
    50% { transform: rotateY(180deg) scale(1.08); }
    100% { transform: rotateY(180deg) scale(1); }
}

.hidden {
    display: none !important;
}

@media (max-width: 700px) {
    .header { font-size: 20px; padding: 16px 18px 20px; }
    .back-btn { width: 42px; height: 42px; font-size: 20px; border-radius: 14px; left: 14px; }
    .start-screen { margin-top: 32px; padding: 24px 20px; gap: 14px; }
    .big-btn { font-size: 19px; padding: 16px 36px; }
    .back { font-size: 32px; }
    .front { font-size: 16px; }
    .grid { gap: 6px; }
    .face { border-radius: 14px; }
}

</style>
<link rel="stylesheet" href="../assets/menu-drawer.css">
</head>

<body>

<div class="header">
    <button class="back-btn" onclick="goBack()" aria-label="Назад">☰</button>
    <div class="header-title">🧠 Мемо</div>
</div>

<div class="start-screen" id="startScreen">

    <label>Сетка:
        <select id="size">
            <option value="4">4×4</option>
            <option value="6">6×6</option>
            <option value="8">8×8</option>
        </select>
    </label>

    <label>Запоминание:
        <select id="preview">
            <option value="5">5 сек</option>
            <option value="8" selected>8 сек</option>
            <option value="12">12 сек</option>
            <option value="20">20 сек</option>
            <option value="60">60 сек</option>
        </select>
    </label>

    <button class="big-btn" onclick="startGame()">▶ НАЧАТЬ</button>
</div>

<div id="game" class="hidden">
    <div class="timer-bar" id="timerBar"></div>
    <div class="grid" id="grid"></div>
</div>

<script>

function goBack(){
    location.href = "index.html";
}

const icons=[
"🍎","🚗","🐶","⚽","🌙","🎲","🎧","🔥",
"🐱","🐸","🦊","🐼","🍕","🍉","🚀","🎈",
"🏀","🎮","📚","✏️","🎯","🧠","⚡","🌈",
"🐝","🦁","🐙","🍩","🧩","🚁","🏆","💡"
];

let cards=[], first=null, lock=false;
let pairs=0, moves=0;

function shuffle(a){
    for(let i=a.length-1;i>0;i--){
        let j=Math.floor(Math.random()*(i+1));
        [a[i],a[j]]=[a[j],a[i]];
    }
    return a;
}

/* 🔥 ФИКС-таймер */
function runTimer(sec, onEnd){
    const bar=document.getElementById("timerBar");
    let t=sec;

    bar.style.width="100%";

    const interval=setInterval(()=>{
        t--;
        bar.style.width=(t/sec)*100+"%";

        if(t<=0){
            clearInterval(interval);
            bar.style.width="0%";
            if(onEnd) onEnd();
        }
    },1000);
}

/* START */
function startGame(){

    const size=+document.getElementById("size").value;
    const preview=+document.getElementById("preview").value;

    const total=size*size;
    const need=total/2;

    const pool=[...icons];
    const pick=[];

    for(let i=0;i<need;i++){
        const idx=Math.floor(Math.random()*pool.length);
        pick.push(pool.splice(idx,1)[0]);
    }

    cards=shuffle([...pick,...pick]);

    const grid=document.getElementById("grid");
    grid.innerHTML="";
    grid.style.gridTemplateColumns=`repeat(${size},1fr)`;

    document.getElementById("startScreen").classList.add("hidden");
    document.getElementById("game").classList.remove("hidden");

    lock=true;
    first=null;
    pairs=0;
    moves=0;

    cards.forEach((ic,i)=>{
        const c=document.createElement("div");
        c.className="card flipped";
        c.dataset.icon=ic;

        c.innerHTML=`
        <div class="inner">
            <div class="face front">${i+1}</div>
            <div class="face back">${ic}</div>
        </div>`;

        c.onclick=()=>flip(c);
        grid.appendChild(c);
    });

    runTimer(preview, ()=>{

        document.querySelectorAll(".card").forEach(c=>{
            c.classList.remove("flipped");
        });

        lock=false;
    });
}

/* FLIP */
function flip(card){

    if(lock || card.classList.contains("flipped")) return;

    card.classList.add("flipped");

    if(!first){
        first=card;
        return;
    }

    moves++;
    lock=true;

    if(first.dataset.icon===card.dataset.icon){

        const a=first;
        const b=card;

        setTimeout(()=>{
            a.classList.add("matching");
            b.classList.add("matching");
        },120);

        setTimeout(()=>{

            /* ❗ ВАЖНО: НЕ УДАЛЯЕМ, только скрываем */
            a.style.visibility="hidden";
            b.style.visibility="hidden";

            pairs++;
            first=null;
            lock=false;

        },900);

    } else {

        setTimeout(()=>{
            first.classList.remove("flipped");
            card.classList.remove("flipped");
            first=null;
            lock=false;
        },700);
    }
}

</script>


<script src="../assets/menu-data.js"></script>
<script src="../assets/menu-drawer.js"></script>
</body>
</html>
