<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Лабиринты - NeuroX</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23FF8C42' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M3 3h3'/%3E%3Cpath d='M9 3h12v18h-3'/%3E%3Cpath d='M14 21H3V3'/%3E%3Cpath d='M6 6v6'/%3E%3Cpath d='M6 6h6'/%3E%3Cpath d='M12 6v9'/%3E%3Cpath d='M12 12h6'/%3E%3Cpath d='M18 12v6'/%3E%3Cpath d='M6 15h6'/%3E%3Cpath d='M3 18h6'/%3E%3Cpath d='M15 3v3'/%3E%3Cpath d='M15 9h6'/%3E%3C/svg%3E">
<style>
:root{
  --blue:#2D6CDF;--blue-dark:#1E4FA8;--blue-light:#EBF2FF;
  --orange:#FF8C42;--orange-dark:#E86E1F;--orange-light:#FFF2E5;
  --bg:#F7F9FC;--card:#FFFFFF;--text:#1F2937;--text-muted:#6B7280;--border:#E5EAF2;
  --shadow:0 4px 16px rgba(45,108,223,.08);
  --c-bg:#FFFFFF;--c-wall:#1F2937;--c-path:#FF8C42;--c-exit:#FF8C42;--c-coin:#F59E0B;
}
[data-theme="dark"]{
  --blue:#4B8CE8;--blue-dark:#8FBCFF;--blue-light:#1B2540;
  --orange:#FF9D57;--orange-dark:#E86E1F;--orange-light:#3A2A1F;
  --bg:#0B1220;--card:#131C33;--text:#E5E7EB;--text-muted:#94A3B8;--border:#1F2A44;
  --shadow:0 4px 16px rgba(0,0,0,.4);
  --c-bg:#0B1220;--c-wall:#CBD5E1;--c-path:#FF9D57;--c-exit:#FF9D57;--c-coin:#FBBF24;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;height:100%;overflow:hidden;}
body{font-family:-apple-system,'Segoe UI',Roboto,'Nunito Sans',sans-serif;background:var(--bg);color:var(--text);transition:background .25s,color .25s;}

#topbar{position:fixed;top:0;left:0;right:0;z-index:20;padding:10px 12px;pointer-events:none;}
#topbar-card{max-width:1200px;margin:0 auto;background:var(--card);border:1px solid var(--border);border-radius:20px;box-shadow:var(--shadow);padding:10px 14px;pointer-events:auto;transition:background .25s,border-color .25s;}
#row-1{display:grid;grid-template-columns:46px 1fr auto;align-items:center;gap:12px;}
#title{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-size:20px;font-weight:800;color:var(--blue-dark);letter-spacing:.5px;text-align:center;white-space:nowrap;pointer-events:none;}
#title .title-icon{width:22px;height:22px;flex-shrink:0;}
.right-btns{display:flex;gap:6px;}
.back-btn,.icon-btn{width:46px;height:46px;border:none;border-radius:14px;background:var(--blue-light);color:var(--blue);font-size:20px;font-weight:700;cursor:pointer;transition:.18s;display:inline-flex;align-items:center;justify-content:center;padding:0;font-family:inherit;flex-shrink:0;}
.back-btn:hover,.icon-btn:hover{background:var(--blue);color:#fff;transform:translateY(-1px);}
#row-2{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px;padding-top:10px;border-top:1px solid var(--border);}
.field{display:inline-flex;align-items:center;gap:6px;background:var(--bg);border:2px solid var(--border);border-radius:12px;padding:0 12px;height:40px;font-size:12px;font-weight:700;color:var(--text-muted);transition:border-color .18s,background .25s;}
.field:focus-within{border-color:var(--blue);}
.field input,.field select{border:none;outline:none;background:transparent;font-family:inherit;font-weight:700;color:var(--text);font-size:14px;}
.field input[type=number]{width:44px;text-align:center;}
.field input[type=text]{width:90px;}
.field select{padding-right:2px;cursor:pointer;}
.field select option{background:var(--card);color:var(--text);}
.btn{border:none;border-radius:12px;background:var(--orange);color:#fff;font-family:inherit;font-size:14px;font-weight:800;padding:0 16px;height:40px;cursor:pointer;transition:.2s;letter-spacing:.3px;box-shadow:0 4px 12px rgba(255,140,66,.3);display:inline-flex;align-items:center;justify-content:center;white-space:nowrap;}
.btn:hover{background:var(--orange-dark);transform:translateY(-1px);box-shadow:0 6px 16px rgba(255,140,66,.4);}
.btn:active{transform:translateY(0);}
.btn-ghost{background:transparent;color:var(--blue-dark);box-shadow:none;}
.btn-ghost:hover{background:var(--blue-light);transform:none;box-shadow:none;}
.toggle{display:inline-flex;align-items:center;gap:6px;padding:0 12px;height:40px;background:var(--blue-light);border-radius:12px;color:var(--blue-dark);font-size:13px;font-weight:700;cursor:pointer;user-select:none;white-space:nowrap;transition:background .25s;}
.toggle input{accent-color:var(--orange);cursor:pointer;margin:0;}
canvas{position:fixed;top:0;left:0;background:var(--bg);touch-action:none;z-index:1;transition:background .25s;}

/* ===== HUD ===== */
#hud{
  position:fixed;
  left:14px;
  bottom:14px;
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  z-index:15;
  max-width:calc(100vw - 28px);
  opacity:1;
  transition:opacity .35s ease;
  pointer-events:none;
}
#hud .hud-item{ pointer-events:auto; }
#hud.idle{ opacity:0; }
#hud.off{ display:none; }

.hud-item{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:8px 12px;font-size:13px;font-weight:700;color:var(--text);box-shadow:var(--shadow);white-space:nowrap;display:inline-flex;gap:6px;align-items:center;transition:background .25s,border-color .25s;}
.hud-item b{color:var(--blue-dark);font-weight:800;}

#toast{position:fixed;left:50%;bottom:80px;transform:translateX(-50%) translateY(20px);background:var(--card);color:var(--text);border:1px solid var(--border);border-radius:14px;padding:12px 20px;font-weight:700;font-size:14px;box-shadow:0 8px 24px rgba(0,0,0,.15);opacity:0;pointer-events:none;transition:.25s;z-index:100;max-width:90vw;text-align:center;}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
#winOverlay{position:fixed;inset:0;background:rgba(15,23,42,.6);display:none;align-items:center;justify-content:center;z-index:200;padding:20px;backdrop-filter:blur(6px);}
#winOverlay.show{display:flex;}
#winCard{background:var(--card);border:1px solid var(--border);border-radius:24px;padding:32px 28px;max-width:400px;width:100%;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.3);animation:popIn .4s cubic-bezier(.34,1.56,.64,1);}
@keyframes popIn{from{transform:scale(.85);opacity:0;}to{transform:scale(1);opacity:1;}}
.win-emoji{font-size:64px;margin-bottom:8px;}
.win-title{font-size:24px;font-weight:800;color:var(--blue-dark);margin:0 0 20px;}
.win-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:24px;}
.win-stat{background:var(--bg);border-radius:14px;padding:12px 6px;}
.win-stat b{display:block;font-size:20px;font-weight:800;color:var(--blue-dark);margin-bottom:2px;}
.win-stat span{font-size:11px;color:var(--text-muted);font-weight:700;text-transform:uppercase;letter-spacing:.3px;}
.win-actions{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;}
#labubuWin{position:fixed;inset:0;width:100vw;height:100vh;object-fit:contain;background:rgba(0,0,0,.55);display:none;z-index:999;}
#copy{position:fixed;right:14px;bottom:8px;font-size:12px;color:var(--text-muted);font-weight:600;pointer-events:none;z-index:10;}

/* ===== REPLAY ===== */
#replayWrap{
  position:fixed;
  left:50%;
  bottom:80px;
  transform:translateX(-50%);
  display:none;
  z-index:60;
  pointer-events:none;
}
#replayWrap.show{ display:block; }
#btnReplay{
  border:none;
  font-family:inherit;
  font-size:18px;
  font-weight:800;
  padding:16px 32px;
  border-radius:16px;
  background:var(--orange);
  color:#fff;
  cursor:pointer;
  box-shadow:0 8px 24px rgba(255,140,66,.45);
  letter-spacing:.3px;
  animation:replayPulse 1.4s ease-in-out infinite;
  pointer-events:auto;
  white-space:nowrap;
  display:inline-flex;
  align-items:center;
  gap:8px;
}
#btnReplay:hover{ background:var(--orange-dark); animation:none; }
#btnReplay:active{ transform:scale(.97); }
#btnReplay svg{ flex-shrink:0; }
@keyframes replayPulse{
  0%, 100% { transform:scale(1); }
  50%      { transform:scale(1.06); }
}

@media(max-width:900px){
  #topbar{padding:8px 10px;}#topbar-card{padding:10px 12px;border-radius:16px;}
  #row-1{grid-template-columns:38px 1fr auto;gap:8px;}
  #title{font-size:17px;}
  #title .title-icon{width:18px;height:18px;}
  .back-btn,.icon-btn{width:38px;height:38px;font-size:16px;border-radius:12px;}
  #row-2{gap:6px;}
  .field{height:36px;padding:0 8px;font-size:11px;border-radius:10px;}
  .field input[type=number]{width:36px;font-size:13px;}
  .field input[type=text]{width:64px;font-size:13px;}
  .field select{font-size:13px;}
  .btn{height:36px;padding:0 12px;font-size:12px;border-radius:10px;}
  .toggle{height:36px;padding:0 10px;font-size:12px;border-radius:10px;}
  #hud{left:10px;bottom:10px;gap:6px;}
  .hud-item{padding:6px 10px;font-size:11px;border-radius:10px;}
  .right-btns .btn-ghost{display:none;}
  #replayWrap{ bottom:70px; }
  #btnReplay{ font-size:15px; padding:13px 24px; }
}
</style>

<script>
(() => {
"use strict";

const $ = id => document.getElementById(id);
const canvas = $("maze"), ctx = canvas.getContext("2d");
const topbar = $("topbar");
const colsInput = $("cols"), rowsInput = $("rows");
const shapeSelect = $("shape"), algoSelect = $("algo");
const seedInput = $("seed");
const fogToggle = $("fogToggle"), coinsToggle = $("coinsToggle");
const animToggle = $("animToggle"), labubuToggle = $("labubuToggle");
const nolimitToggle = $("nolimitToggle"), hudToggle = $("hudToggle");
const labubuWin = $("labubuWin"), imgInput = $("imgInput");
const hudTime = $("hudTime"), hudMoves = $("hudMoves"), hudCoins = $("hudCoins"), hudBest = $("hudBest");
const toastEl = $("toast"), winOverlay = $("winOverlay");
const replayWrap = $("replayWrap"), btnReplay = $("btnReplay");
const hud = $("hud");

const TAU = Math.PI * 2;
const MIN_SIZE = 2, MAX_SIZE = 120, DEFAULT_SIZE = 25;
const STEP_INTERVAL = 20;
const SS = 4, IMG_THRESHOLD = 128, IMG_DARK_RATIO = 0.3;
const ANIM_TARGET_FRAMES = 100;

let shape = "rect";
let cols = DEFAULT_SIZE, rows = DEFAULT_SIZE;
let cell = 20;
let ox = 0, oy = 0, TOP = 88, dpr = 1;
let polarCX = 0, polarCY = 0, polarRingW = 20, polarMaxR = 200;

let maze = [];
let ringOffsets = [];
let openEdges = new Set();

let player = {x:0, y:0};
let exit = {x:0, y:0};
let trail = [];
let coins = [];
let collected = new Set();
let auto = false;
let path = [], pathIndex = 0;

let dirty = true, lastTs = 0, acc = 0, winTimeout = null;
let currentSeed = 0, rng = Math.random;

let startTs = 0, timerInterval = null;
let movesCount = 0, winShown = false;
let generating = false, genIterator = null, genStepsPerFrame = 1;

let bestScores = {};
try { bestScores = JSON.parse(localStorage.getItem("maze_best") || "{}") || {}; } catch(_){}

const markDirty = () => { dirty = true; };

/* ===== HUD автоскрытие (по умолчанию выключено) ===== */
let hudOff = true;
let hudIdleTimer = null;

function pokeHud(){
  if (hudOff) return;
  hud.classList.remove("idle");
  if (hudIdleTimer) clearTimeout(hudIdleTimer);
  hudIdleTimer = setTimeout(() => {
    if (!hudOff) hud.classList.add("idle");
  }, 3000);
}

hud.addEventListener("pointerenter", () => {
  if (hudOff) return;
  hud.classList.remove("idle");
  if (hudIdleTimer){ clearTimeout(hudIdleTimer); hudIdleTimer = null; }
});
hud.addEventListener("pointerleave", () => {
  if (hudOff) return;
  pokeHud();
});

hudToggle.addEventListener("change", (e) => {
  hudOff = !e.target.checked;
  hud.classList.toggle("off", hudOff);
  if (!hudOff) pokeHud();
});

// синхронизация при старте — HUD выключен
hud.classList.toggle("off", hudOff);

/* ===== РЁБРА ===== */
function ekey(a, b){ return a < b ? a + ':' + b : b + ':' + a; }
function isOpen(a, b){ return openEdges.has(ekey(a, b)); }
function openEdge(a, b){ openEdges.add(ekey(a, b)); }

/* ============================================================
   ОПРЕДЕЛЕНИЕ УСТРОЙСТВА
   ============================================================ */
let noLimits = false;

function detectMobile(){
  const coarse = window.matchMedia && window.matchMedia("(pointer: coarse)").matches;
  const narrow = window.matchMedia && window.matchMedia("(max-width: 900px)").matches;
  return coarse && narrow;
}

let isMobile = detectMobile();
function recalcIsMobile(){ isMobile = detectMobile(); }

const LIMITS = {
  rect: {
    desktop: { maxSize: 120, defaultSize: 25 },
    mobile:  { maxSize: 40,  defaultSize: 20 }
  },
  polar: {
    desktop: { maxRows: 40, defaultRows: 18 },
    mobile:  { maxRows: 16, defaultRows: 12 }
  }
};

function limits(){ return isMobile ? "mobile" : "desktop"; }

function applyDeviceLimits(){
  if (noLimits){
    colsInput.removeAttribute("max");
    rowsInput.removeAttribute("max");
    return;
  }
  const L = LIMITS.rect[limits()];
  colsInput.max = L.maxSize;
  rowsInput.max = shape === "polar" ? LIMITS.polar[limits()].maxRows : L.maxSize;

  let c = Math.floor(Number(colsInput.value)) || L.defaultSize;
  let r = Math.floor(Number(rowsInput.value)) || L.defaultSize;

  if (shape === "polar"){
    const P = LIMITS.polar[limits()];
    r = Math.max(MIN_SIZE, Math.min(P.maxRows, r));
    if (c > 30) c = 20;
  } else {
    c = Math.max(MIN_SIZE, Math.min(L.maxSize, c));
    r = Math.max(MIN_SIZE, Math.min(L.maxSize, r));
  }
  colsInput.value = c;
  rowsInput.value = r;
}

/* ===== ТЕМА ===== */
function getCssVar(n){ return getComputedStyle(document.documentElement).getPropertyValue(n).trim(); }
function currentTheme(){ return document.documentElement.dataset.theme === "dark" ? "dark" : "light"; }
function applyTheme(t){
  document.documentElement.dataset.theme = t;
  try{ localStorage.setItem("maze_theme", t); }catch(_){}
  $("btnTheme").textContent = t === "dark" ? "☀️" : "🌙";
  markDirty();
}
function toggleTheme(){ applyTheme(currentTheme() === "dark" ? "light" : "dark"); }
let savedTheme = "light";
try{ savedTheme = localStorage.getItem("maze_theme") || "light"; }catch(_){}
applyTheme(savedTheme);

/* ===== SEED / RNG ===== */
function mulberry32(seed){
  let a = seed >>> 0;
  return function(){
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function hashString(s){
  let h = 2166136261 >>> 0;
  for (let i = 0; i < s.length; i++){ h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
  return h >>> 0;
}
function readSeed(){
  const s = (seedInput.value || "").trim();
  if (!s) return (Math.random() * 0xFFFFFFFF) >>> 0;
  if (/^\d+$/.test(s)) return (+s) >>> 0;
  return hashString(s);
}
function writeSeed(n){ seedInput.value = n.toString(36).toUpperCase(); }

/* ===== ЗВУК + ВИБРАЦИЯ ===== */
let audioCtx = null;
function initAudio(){
  if (!audioCtx){ try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(_){} }
}
function beep(freq, dur = 0.1, type = 'sine', vol = 0.06){
  if (!audioCtx) return;
  const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
  osc.connect(gain); gain.connect(audioCtx.destination);
  osc.type = type; osc.frequency.value = freq;
  const t = audioCtx.currentTime;
  gain.gain.setValueAtTime(vol, t);
  gain.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  osc.start(t); osc.stop(t + dur + 0.02);
}
const sfxStep = () => beep(520, 0.04, 'triangle', 0.04);
const sfxWall = () => beep(180, 0.08, 'sawtooth', 0.05);
const sfxCoin = () => beep(880, 0.12);
const sfxWin  = () => [523, 659, 784, 1047].forEach((f, i) => setTimeout(() => beep(f, 0.2), i * 120));

function vibrate(p){ try { navigator.vibrate && navigator.vibrate(p); } catch(_){} }
const vibStep = () => vibrate(12);
const vibWall = () => vibrate(8);
const vibWin  = () => vibrate([10, 40, 10]);

document.addEventListener('pointerdown', initAudio, { once: true, capture: true });

/* ===== LAYOUT ===== */
function updateTop(){ TOP = topbar.offsetHeight + 6; }

function resizeCanvas(){
  updateTop();
  dpr = window.devicePixelRatio || 1;
  const w = window.innerWidth, h = window.innerHeight;
  canvas.width = Math.floor(w * dpr);
  canvas.height = Math.floor(h * dpr);
  canvas.style.width = w + "px";
  canvas.style.height = h + "px";
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  computeLayout();
  markDirty();
}

function computeLayout(){
  if (!cols || !rows) return;
  const w = window.innerWidth, h = window.innerHeight;
  const availH = h - TOP;
  if (shape === "rect"){
    cell = Math.min(w / cols, availH / rows);
    ox = (w - cols * cell) / 2;
    oy = (h - TOP - rows * cell) / 2 + TOP;
  } else {
    polarCX = w / 2;
    polarCY = h / 2;
    polarMaxR = Math.min(w, h) / 2 - 24;
    polarRingW = polarMaxR / rows;
  }
}

/* ============================================================
   ФОРМА
   ============================================================ */
function ringSectors(r){
  if (shape === "rect") return cols;
  if (r === 0) return 1;
  return Math.max(1, Math.round(TAU * r));
}
function buildRingOffsets(){
  ringOffsets = [0];
  for (let r = 0; r < rows; r++) ringOffsets.push(ringOffsets[r] + ringSectors(r));
}
function lin(r, s){ return ringOffsets[r] + s; }

function cellCenter(s, r){
  if (shape === "rect") return {x: s*cell + ox + cell/2, y: r*cell + oy + cell/2};
  const S = ringSectors(r);
  const a = (s + 0.5) * TAU / S;
  const rr = (r + 0.5) * polarRingW;
  return {x: polarCX + rr * Math.cos(a), y: polarCY + rr * Math.sin(a)};
}
function cellRadius(){
  if (shape === "rect") return Math.max(3, cell * 0.28);
  return Math.max(2, polarRingW * 0.30);
}

/* ===== СОСЕДИ ===== */
function neighbors(s, r){
  const result = [];
  if (shape === "rect"){
    if (r > 0)        result.push({ns: s,     nr: r - 1, kind: 'in'});
    if (s < cols - 1) result.push({ns: s + 1, nr: r,     kind: 'cw'});
    if (r < rows - 1) result.push({ns: s,     nr: r + 1, kind: 'out'});
    if (s > 0)        result.push({ns: s - 1, nr: r,     kind: 'ccw'});
    return result;
  }
  const S = ringSectors(r);
  if (S > 1){
    result.push({ns: (s + 1) % S, nr: r, kind: 'cw'});
    result.push({ns: (s - 1 + S) % S, nr: r, kind: 'ccw'});
  }
  const a0 = s / S, a1 = (s + 1) / S;
  if (r > 0){
    const Si = ringSectors(r - 1);
    const iStart = Math.floor(a0 * Si);
    const iEnd   = Math.ceil(a1 * Si);
    for (let si = iStart; si < iEnd; si++){
      const ss = ((si % Si) + Si) % Si;
      const b0 = ss / Si, b1 = (ss + 1) / Si;
      if (b1 > a0 + 1e-9 && b0 < a1 - 1e-9){
        result.push({ns: ss, nr: r - 1, kind: 'in'});
      }
    }
  }
  if (r < rows - 1){
    const So = ringSectors(r + 1);
    const oStart = Math.floor(a0 * So);
    const oEnd   = Math.ceil(a1 * So);
    for (let so = oStart; so < oEnd; so++){
      const ss = ((so % So) + So) % So;
      const b0 = ss / So, b1 = (ss + 1) / So;
      if (b1 > a0 + 1e-9 && b0 < a1 - 1e-9){
        result.push({ns: ss, nr: r + 1, kind: 'out'});
      }
    }
  }
  return result;
}

function nbrDir(s, r, d){
  if (shape === "rect"){
    if (d === 0){ if (r === 0) return null;     return {s, r: r-1}; }
    if (d === 1){ if (s >= cols-1) return null; return {s: s+1, r}; }
    if (d === 2){ if (r >= rows-1) return null; return {s, r: r+1}; }
    if (d === 3){ if (s === 0) return null;     return {s: s-1, r}; }
    return null;
  }
  const S = ringSectors(r);
  if (d === 1){ if (S <= 1) return null; return {s: (s + 1) % S, r}; }
  if (d === 3){ if (S <= 1) return null; return {s: (s - 1 + S) % S, r}; }
  if (d === 0){
    if (r === 0) return null;
    const Si = ringSectors(r - 1);
    const si = Math.floor((s + 0.5) * Si / S) % Si;
    return {s: si, r: r - 1};
  }
  if (d === 2){
    if (r === rows - 1) return null;
    const So = ringSectors(r + 1);
    const so = Math.floor((s + 0.5) * So / S) % So;
    return {s: so, r: r + 1};
  }
  return null;
}

/* ===== DSU ===== */
class DSU{
  constructor(n){ this.p = new Int32Array(n); for (let i = 0; i < n; i++) this.p[i] = i; }
  find(x){ const p = this.p; while (p[x] !== x){ p[x] = p[p[x]]; x = p[x]; } return x; }
  union(a, b){ a = this.find(a); b = this.find(b); if (a === b) return false; this.p[b] = a; return true; }
}

function readSize(input){
  const v = Math.floor(Number(input.value));
  if (!Number.isFinite(v)) return DEFAULT_SIZE;
  if (noLimits) return Math.max(MIN_SIZE, Math.min(MAX_SIZE, v));
  if (input === rowsInput && shape === "polar"){
    const L = LIMITS.polar[limits()];
    return Math.max(MIN_SIZE, Math.min(L.maxRows, v));
  }
  const L = LIMITS.rect[limits()];
  return Math.max(MIN_SIZE, Math.min(L.maxSize, v));
}

function initMazeGrid(){
  maze = new Array(rows);
  for (let r = 0; r < rows; r++){
    const S = ringSectors(r);
    maze[r] = new Array(S);
    for (let s = 0; s < S; s++) maze[r][s] = { solid: false };
  }
  buildRingOffsets();
  openEdges = new Set();
}

function randomCell(){
  const r = Math.floor(rng() * rows);
  const s = Math.floor(rng() * ringSectors(r));
  return {x: s, y: r};
}

/* ===== ГЕНЕРАТОРЫ ===== */
function* allUniqueEdges(){
  const seen = new Set();
  for (let r = 0; r < rows; r++){
    const S = ringSectors(r);
    for (let s = 0; s < S; s++){
      const a = lin(r, s);
      for (const n of neighbors(s, r)){
        const b = lin(n.nr, n.ns);
        const k = a < b ? a + ':' + b : b + ':' + a;
        if (seen.has(k)) continue;
        seen.add(k);
        yield {a: {s, r, id: a}, b: {s: n.ns, r: n.nr, id: b}};
      }
    }
  }
}

function* genKruskalAnim(){
  const edges = [];
  for (const e of allUniqueEdges()) edges.push(e);
  for (let i = edges.length - 1; i > 0; i--){
    const j = Math.floor(rng() * (i + 1));
    const t = edges[i]; edges[i] = edges[j]; edges[j] = t;
  }
  const dsu = new DSU(ringOffsets[rows]);
  for (const e of edges){
    if (dsu.union(e.a.id, e.b.id)){
      openEdge(e.a.id, e.b.id);
      yield;
    }
  }
}

function* genBacktrackerAnim(){
  const total = ringOffsets[rows];
  const visited = new Uint8Array(total);
  const start = randomCell();
  const stack = [{s: start.x, r: start.y}];
  visited[lin(start.y, start.x)] = 1;
  while (stack.length){
    const top = stack[stack.length - 1];
    const cand = [];
    for (const n of neighbors(top.s, top.r)){
      if (visited[lin(n.nr, n.ns)]) continue;
      cand.push(n);
    }
    if (!cand.length){ stack.pop(); continue; }
    const p = cand[Math.floor(rng() * cand.length)];
    openEdge(lin(top.r, top.s), lin(p.nr, p.ns));
    visited[lin(p.nr, p.ns)] = 1;
    stack.push({s: p.ns, r: p.nr});
    yield;
  }
}

function* genPrimAnim(){
  const total = ringOffsets[rows];
  const inMaze = new Uint8Array(total);
  const frontier = [];
  function add(s, r){
    inMaze[lin(r, s)] = 1;
    for (const n of neighbors(s, r)){
      if (inMaze[lin(n.nr, n.ns)]) continue;
      frontier.push({s, r, n});
    }
  }
  const start = randomCell();
  add(start.x, start.y);
  while (frontier.length){
    const i = Math.floor(rng() * frontier.length);
    const e = frontier.splice(i, 1)[0];
    if (inMaze[lin(e.n.nr, e.n.ns)]) continue;
    openEdge(lin(e.r, e.s), lin(e.n.nr, e.n.ns));
    add(e.n.ns, e.n.nr);
    yield;
  }
}

function* genBinaryAnim(){
  for (let r = 0; r < rows; r++){
    const S = ringSectors(r);
    for (let s = 0; s < S; s++){
      const opts = [];
      const nUp = nbrDir(s, r, 0);
      const nRight = nbrDir(s, r, 1);
      if (nUp)    opts.push({n: nUp});
      if (nRight) opts.push({n: nRight});
      if (!opts.length) continue;
      const pick = opts.length === 1 ? opts[0] : opts[rng() < 0.5 ? 0 : 1];
      openEdge(lin(r, s), lin(pick.n.r, pick.n.s));
      yield;
    }
  }
}

function makeGenIterator(){
  switch (algoSelect.value){
    case 'backtracker': return genBacktrackerAnim();
    case 'prim':        return genPrimAnim();
    case 'binary':      return genBinaryAnim();
    default:            return genKruskalAnim();
  }
}

/* ===== ПРОЧЕЕ ===== */
function placeCoins(){
  coins = [];
  if (!coinsToggle.checked) return;
  const total = ringOffsets[rows];
  const n = Math.max(3, Math.min(10, Math.floor(total / 60)));
  const used = new Set();
  if (maze.length && player && exit){
    used.add(lin(player.y, player.x));
    used.add(lin(exit.y, exit.x));
  }
  let guard = 0;
  while (coins.length < n && guard++ < 5000){
    const r = Math.floor(rng() * rows);
    const s = Math.floor(rng() * ringSectors(r));
    const l = lin(r, s);
    if (used.has(l)) continue;
    used.add(l);
    coins.push({x: s, y: r});
  }
}

function bfsFrom(s0, r0){
  const total = ringOffsets[rows];
  const dist = new Int32Array(total).fill(-1);
  const q = new Int32Array(total);
  let head = 0, tail = 0;
  const startL = lin(r0, s0);
  dist[startL] = 0; q[tail++] = startL;
  while (head < tail){
    const cur = q[head++];
    let cr = 0;
    while (ringOffsets[cr + 1] <= cur) cr++;
    const cs = cur - ringOffsets[cr];
    for (const n of neighbors(cs, cr)){
      const nid = lin(n.nr, n.ns);
      if (dist[nid] !== -1) continue;
      if (!isOpen(cur, nid)) continue;
      dist[nid] = dist[cur] + 1;
      q[tail++] = nid;
    }
  }
  return dist;
}

function finishGeneration(){
  player = {x: 0, y: 0};
  const dist = bfsFrom(0, 0);

  const outerR = rows - 1;
  const outerS = ringSectors(outerR);
  let bestS = 0, bestD = -1;
  for (let s = 0; s < outerS; s++){
    const l = lin(outerR, s);
    if (dist[l] > bestD){ bestD = dist[l]; bestS = s; }
  }
  exit = {x: bestS, y: outerR};

  trail = [{...player}];
  collected = new Set();
  placeCoins();
  resetTimer();
  updateHud();
  markDirty();
}

function generateMaze(keepSeed = false){
  generating = false; genIterator = null;
  hideReplayButton();
  shape = shapeSelect.value;

  cols = readSize(colsInput); rows = readSize(rowsInput);
  colsInput.value = cols; rowsInput.value = rows;

  currentSeed = keepSeed ? currentSeed : readSeed();
  writeSeed(currentSeed);
  rng = mulberry32(currentSeed);
  computeLayout();
  initMazeGrid();

  player = {x: 0, y: 0};
  exit = {x: 0, y: 0};
  trail = [];
  collected = new Set();
  coins = [];
  auto = false; path = []; pathIndex = 0;
  movesCount = 0; winShown = false; acc = 0;
  hideLabubu(); hideWinOverlay();
  updateHud(); markDirty();

  genIterator = makeGenIterator();
  genStepsPerFrame = Math.max(1, Math.ceil(ringOffsets[rows] / ANIM_TARGET_FRAMES));

  if (animToggle.checked){
    generating = true;
  } else {
    let g;
    while (!(g = genIterator.next()).done){}
    genIterator = null;
    finishGeneration();
  }
}

/* ===== HUD / ТАЙМЕР ===== */
function fmtTime(sec){
  sec = Math.floor(sec);
  const m = Math.floor(sec / 60);
  return m + ':' + String(sec % 60).padStart(2, '0');
}
function resetTimer(){
  startTs = performance.now();
  if (timerInterval) clearInterval(timerInterval);
  timerInterval = setInterval(() => {
    hudTime.textContent = fmtTime((performance.now() - startTs) / 1000);
  }, 200);
  hudTime.textContent = "0:00";
}
function stopTimer(){ if (timerInterval){ clearInterval(timerInterval); timerInterval = null; } }
function elapsed(){ return (performance.now() - startTs) / 1000; }
function bestKey(){ return `${shape}_${cols}x${rows}_${algoSelect.value}`; }
function getBest(){ return bestScores[bestKey()] || null; }
function updateHud(){
  hudMoves.textContent = movesCount;
  hudCoins.textContent = `${collected.size}/${coins.length}`;
  const b = getBest();
  hudBest.textContent = b ? fmtTime(b) : "—";
  pokeHud();
}

/* ===== ЛАБУБУ / WIN ===== */
function hideLabubu(){
  if (winTimeout){ clearTimeout(winTimeout); winTimeout = null; }
  labubuWin.style.display = "none";
}
function showLabubu(){
  labubuWin.style.display = "block";
  if (winTimeout) clearTimeout(winTimeout);
  winTimeout = setTimeout(() => { labubuWin.style.display = "none"; winTimeout = null; }, 2500);
}
function showWinOverlay(){
  const t = elapsed();
  const key = bestKey();
  const prev = bestScores[key];
  if (!prev || t < prev){
    bestScores[key] = t;
    try{ localStorage.setItem("maze_best", JSON.stringify(bestScores)); }catch(_){}
  }
  $("winTime").textContent = fmtTime(t);
  $("winMoves").textContent = movesCount;
  $("winBest").textContent = fmtTime(bestScores[key]);
  winOverlay.classList.add("show");
  updateHud();
}
function hideWinOverlay(){ winOverlay.classList.remove("show"); }
function checkWin(){
  if (player.x !== exit.x || player.y !== exit.y) return false;
  if (coins.length && collected.size < coins.length){
    showToast(`Сначала собери монеты! Осталось: ${coins.length - collected.size}`);
    return false;
  }
  if (winShown) return false;
  winShown = true; auto = false; stopTimer();
  vibWin(); sfxWin();
  if (labubuToggle.checked) showLabubu();
  showWinOverlay();
  return true;
}

/* ===== BFS ===== */
function findPathFromTo(from, to){
  const total = ringOffsets[rows];
  const start = lin(from.y, from.x);
  const target = lin(to.y, to.x);
  if (start === target) return [to];
  const prev = new Int32Array(total).fill(-1);
  const seen = new Uint8Array(total);
  const q = new Int32Array(total);
  let head = 0, tail = 0;
  q[tail++] = start; seen[start] = 1;
  while (head < tail){
    const cur = q[head++];
    if (cur === target) break;
    let cr = 0;
    while (ringOffsets[cr + 1] <= cur) cr++;
    const cs = cur - ringOffsets[cr];
    for (const n of neighbors(cs, cr)){
      const nid = lin(n.nr, n.ns);
      if (seen[nid]) continue;
      if (!isOpen(cur, nid)) continue;
      seen[nid] = 1; prev[nid] = cur;
      q[tail++] = nid;
    }
  }
  if (!seen[target]) return null;
  const out = [];
  for (let c = target; c !== -1; c = prev[c]){
    let cr = 0;
    while (ringOffsets[cr + 1] <= c) cr++;
    const cs = c - ringOffsets[cr];
    out.push({x: cs, y: cr});
  }
  out.reverse();
  return out;
}

function findFullPath(){
  const full = [];
  let cur = {x: player.x, y: player.y};
  const remaining = new Set();
  coins.forEach((_, i) => { if (!collected.has(i)) remaining.add(i); });
  while (remaining.size){
    let bestPath = null, bestIdx = -1;
    for (const i of remaining){
      const p = findPathFromTo(cur, coins[i]);
      if (p && (!bestPath || p.length < bestPath.length)){ bestPath = p; bestIdx = i; }
    }
    if (!bestPath) return null;
    for (let k = 1; k < bestPath.length; k++) full.push(bestPath[k]);
    cur = coins[bestIdx];
    remaining.delete(bestIdx);
  }
  const tail = findPathFromTo(cur, exit);
  if (!tail) return null;
  for (let k = 1; k < tail.length; k++) full.push(tail[k]);
  return full;
}

function autoRun(){
  if (winShown || generating) return;

  hideReplayButton();
  player = {x: 0, y: 0};
  trail = [{...player}];
  collected = new Set();
  movesCount = 0;
  winShown = false;
  auto = false;
  path = []; pathIndex = 0;
  acc = 0;
  stopTimer();
  hudTime.textContent = "0:00";
  updateHud();
  markDirty();

  path = findFullPath();
  if (!path || !path.length){ showToast("Путь не найден"); return; }

  auto = true;
  pathIndex = 0;
  acc = 0;
  markDirty();
}

/* ===== ДВИЖЕНИЕ ===== */
function tryMove(dx, dy){
  if (auto || !maze.length || winShown || generating) return;

  let kind;
  if (shape === "rect"){
    if (dx === 0 && dy === -1) kind = 0;
    else if (dx === 1 && dy === 0) kind = 1;
    else if (dx === 0 && dy === 1) kind = 2;
    else if (dx === -1 && dy === 0) kind = 3;
    else return;
  } else {
    if (dy === -1 && dx === 0) kind = 2;
    else if (dy === 1 && dx === 0) kind = 0;
    else if (dx === -1 && dy === 0) kind = 3;
    else if (dx === 1 && dy === 0) kind = 1;
    else return;
  }

  const s = player.x, r = player.y;
  const all = neighbors(s, r);
  const wanted = ['in','cw','out','ccw'][kind];
  const candidates = all.filter(n => n.kind === wanted);

  const curId = lin(r, s);
  const canon = nbrDir(s, r, kind);

  let target = null;
  if (canon){
    for (const n of candidates){
      if (n.ns === canon.s && n.nr === canon.r && isOpen(curId, lin(n.nr, n.ns))){
        target = n; break;
      }
    }
  }
  if (!target){
    for (const n of candidates){
      if (isOpen(curId, lin(n.nr, n.ns))){ target = n; break; }
    }
  }
  if (!target){ sfxWall(); vibWall(); return; }

  player = {x: target.ns, y: target.nr};
  trail.push({...player});
  movesCount++;
  sfxStep(); vibStep();
  collectAt(target.ns, target.nr);
  updateHud(); markDirty();
  checkWin();
}

function collectAt(s, r){
  let got = false;
  coins.forEach((c, i) => {
    if (!collected.has(i) && c.x === s && c.y === r){ collected.add(i); got = true; }
  });
  if (got){ sfxCoin(); vibrate(20); }
}

/* ===== ОТРИСОВКА ===== */
function themeColors(){
  return {
    bg:   getCssVar("--c-bg")   || "#fff",
    wall: getCssVar("--c-wall") || "#111",
    path: getCssVar("--c-path") || "#F80",
    exit: getCssVar("--c-exit") || "#F80",
    coin: getCssVar("--c-coin") || "#F90"
  };
}
function line(x1, y1, x2, y2){
  ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
}

function drawRectMaze(c){
  ctx.strokeStyle = c.wall;
  ctx.lineWidth = Math.max(1, Math.min(3, cell * 0.08));
  ctx.lineCap = "square";

  ctx.fillStyle = c.wall;
  for (let r = 0; r < rows; r++){
    for (let s = 0; s < cols; s++){
      if (maze[r][s].solid) ctx.fillRect(s*cell + ox, r*cell + oy, cell, cell);
    }
  }
  for (let r = 0; r < rows; r++){
    for (let s = 0; s < cols; s++){
      if (maze[r][s].solid) continue;
      const id = lin(r, s);
      const px = s * cell + ox, py = r * cell + oy;
      if (r === 0       || !isOpen(id, lin(r - 1, s))) line(px, py, px + cell, py);
      if (s === cols-1  || !isOpen(id, lin(r, s + 1))) line(px + cell, py, px + cell, py + cell);
      if (r === rows-1  || !isOpen(id, lin(r + 1, s))) line(px, py + cell, px + cell, py + cell);
      if (s === 0       || !isOpen(id, lin(r, s - 1))) line(px, py, px, py + cell);
    }
  }
}

function drawPolarMaze(c){
  ctx.strokeStyle = c.wall;
  ctx.lineWidth = Math.max(1, Math.min(3, polarRingW * 0.1));
  ctx.lineCap = "butt";

  for (let r = 0; r < rows; r++){
    const S = ringSectors(r);
    if (S <= 1) continue;
    const aStep = TAU / S;
    const rIn  = r * polarRingW;
    const rOut = (r + 1) * polarRingW;
    for (let s = 0; s < S; s++){
      const sNext = (s + 1) % S;
      const a = lin(r, s), b = lin(r, sNext);
      if (isOpen(a, b)) continue;
      const ang = (s + 1) * aStep;
      const x1 = polarCX + rIn  * Math.cos(ang), y1 = polarCY + rIn  * Math.sin(ang);
      const x2 = polarCX + rOut * Math.cos(ang), y2 = polarCY + rOut * Math.sin(ang);
      line(x1, y1, x2, y2);
    }
  }

  for (let r = 1; r < rows; r++){
    const S = ringSectors(r);
    const aStep = TAU / S;
    const rIn = r * polarRingW;
    for (let s = 0; s < S; s++){
      const a0 = s * aStep, a1 = (s + 1) * aStep;
      const myId = lin(r, s);
      for (const n of neighbors(s, r)){
        if (n.kind !== 'in') continue;
        const nid = lin(n.nr, n.ns);
        if (isOpen(myId, nid)) continue;
        const Si = ringSectors(n.nr);
        const b0 = n.ns / Si * TAU;
        const b1 = (n.ns + 1) / Si * TAU;
        const c0 = Math.max(a0, b0);
        const c1 = Math.min(a1, b1);
        if (c1 <= c0 + 1e-6) continue;
        ctx.beginPath();
        ctx.arc(polarCX, polarCY, rIn, c0, c1);
        ctx.stroke();
      }
    }
  }

  const rLast = rows - 1;
  const SLast = ringSectors(rLast);
  const aStepLast = TAU / SLast;
  const rOuter = rows * polarRingW;
  for (let s = 0; s < SLast; s++){
    const a0 = s * aStepLast;
    const a1 = (s + 1) * aStepLast;
    ctx.beginPath();
    ctx.arc(polarCX, polarCY, rOuter, a0, a1);
    ctx.stroke();
  }
}

function drawTrail(c){
  if (trail.length < 2) return;
  ctx.strokeStyle = c.path;
  ctx.lineWidth = Math.max(2, (shape === "rect" ? cell : polarRingW) * 0.18);
  ctx.lineCap = "round"; ctx.lineJoin = "round";
  ctx.beginPath();
  const p0 = cellCenter(trail[0].x, trail[0].y);
  ctx.moveTo(p0.x, p0.y);
  for (let i = 1; i < trail.length; i++){
    const p = cellCenter(trail[i].x, trail[i].y);
    ctx.lineTo(p.x, p.y);
  }
  ctx.stroke();
  ctx.lineCap = "square";
}

function drawCoins(c){
  if (!coins.length) return;
  ctx.fillStyle = c.coin;
  for (let i = 0; i < coins.length; i++){
    if (collected.has(i)) continue;
    const p = cellCenter(coins[i].x, coins[i].y);
    ctx.beginPath();
    ctx.arc(p.x, p.y, cellRadius() * 0.65, 0, TAU);
    ctx.fill();
  }
}

function drawExit(c){
  const locked = coins.length && collected.size < coins.length;
  const p = cellCenter(exit.x, exit.y);
  const r = cellRadius();
  ctx.fillStyle = c.bg;
  ctx.beginPath(); ctx.arc(p.x, p.y, r * 1.15, 0, TAU); ctx.fill();
  ctx.strokeStyle = c.exit;
  ctx.lineWidth = Math.max(2, r * 0.35);
  ctx.beginPath(); ctx.arc(p.x, p.y, r * 0.95, 0, TAU); ctx.stroke();
  ctx.fillStyle = c.exit;
  ctx.font = `700 ${Math.max(8, Math.floor(r * 1.4))}px Arial, sans-serif`;
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.fillText(locked ? "🔒" : "F", p.x, p.y);
}

function drawPlayer(c){
  const p = cellCenter(player.x, player.y);
  ctx.fillStyle = c.path;
  ctx.beginPath(); ctx.arc(p.x, p.y, cellRadius(), 0, TAU); ctx.fill();
}

function drawFog(c){
  const w = window.innerWidth, h = window.innerHeight;
  const p = cellCenter(player.x, player.y);
  const base = shape === "rect" ? cell : polarRingW;
  const rad = Math.max(3, Math.min(6, Math.min(cols, rows) * 0.14)) * base;
  ctx.save();
  ctx.beginPath();
  ctx.rect(0, 0, w, h);
  ctx.arc(p.x, p.y, rad, 0, TAU, true);
  ctx.fillStyle = c.bg;
  ctx.fill("evenodd");
  ctx.restore();
}

function draw(){
  if (!maze.length) return;
  const w = window.innerWidth, h = window.innerHeight;
  const c = themeColors();
  ctx.clearRect(0, 0, w, h);
  ctx.fillStyle = c.bg;
  ctx.fillRect(0, 0, w, h);

  if (shape === "rect") drawRectMaze(c); else drawPolarMaze(c);

  if (!generating){
    drawTrail(c);
    drawCoins(c);
    if (fogToggle.checked) drawFog(c);
    drawExit(c);
    drawPlayer(c);
  }
}

/* ===== ЦИКЛ ===== */
function loop(ts){
  if (!lastTs) lastTs = ts;
  const dt = ts - lastTs;
  lastTs = ts;

  if (generating && genIterator){
    let finished = false;
    for (let i = 0; i < genStepsPerFrame; i++){
      const r = genIterator.next();
      if (r.done){ finished = true; break; }
    }
    markDirty();
    if (finished){
      generating = false;
      genIterator = null;
      finishGeneration();
    }
  }

  if (auto && pathIndex < path.length){
    acc += dt;
    while (auto && acc >= STEP_INTERVAL && pathIndex < path.length){
      acc -= STEP_INTERVAL;
      player = path[pathIndex++];
      trail.push({...player});
      movesCount++;
      collectAt(player.x, player.y);
      updateHud();
      markDirty();
      if (player.x === exit.x && player.y === exit.y){
        auto = false;
        acc = 0;
        showReplayButton();
        break;
      }
    }
  }

  if (dirty){ draw(); dirty = false; }
  requestAnimationFrame(loop);
}

/* ===== КАРТИНКА → ЛАБИРИНТ ===== */
function processCanvasToMaze(tctx, tmp){
  hideReplayButton();
  const data = tctx.getImageData(0, 0, tmp.width, tmp.height).data;
  initMazeGrid();
  for (let r = 0; r < rows; r++){
    for (let s = 0; s < cols; s++){
      let dark = 0;
      for (let sy = 0; sy < SS; sy++){
        for (let sx = 0; sx < SS; sx++){
          const px = s * SS + sx, py = r * SS + sy;
          const i = (py * tmp.width + px) * 4;
          const a = data[i+3] / 255;
          const lum = (0.299*data[i] + 0.587*data[i+1] + 0.114*data[i+2]) * a + 255 * (1 - a);
          if (lum < IMG_THRESHOLD) dark++;
        }
      }
      maze[r][s].solid = dark >= SS * SS * IMG_DARK_RATIO;
    }
  }
  for (let r = 0; r < rows; r++){
    for (let s = 0; s < cols; s++){
      if (maze[r][s].solid) continue;
      const id = lin(r, s);
      for (const n of neighbors(s, r)){
        if (maze[n.nr][n.ns].solid) continue;
        openEdge(id, lin(n.nr, n.ns));
      }
    }
  }
  pickStartAndExit();
  trail = [{...player}];
  collected = new Set();
  coins = [];
  if (coinsToggle.checked) placeCoins();
  auto = false; path = []; pathIndex = 0;
  movesCount = 0; winShown = false;
  hideLabubu(); hideWinOverlay();
  resetTimer(); updateHud(); markDirty();
}

async function imageToMaze(url){
  if (shape !== "rect"){ showToast("Картинка доступна только для ▭"); return; }
  const img = new Image();
  img.crossOrigin = "anonymous";
  img.src = url;
  try { await img.decode(); } catch(_){ showToast("Не удалось загрузить картинку"); return; }
  cols = readSize(colsInput); rows = readSize(rowsInput);
  colsInput.value = cols; rowsInput.value = rows;
  const tmp = document.createElement("canvas");
  tmp.width = cols * SS; tmp.height = rows * SS;
  const tctx = tmp.getContext("2d", { willReadFrequently: true });
  tctx.fillStyle = "#ffffff";
  tctx.fillRect(0, 0, tmp.width, tmp.height);
  const ratio = img.width / img.height, targetRatio = tmp.width / tmp.height;
  let dw = tmp.width, dh = tmp.height, dx = 0, dy = 0;
  if (ratio > targetRatio){ dh = tmp.width / ratio; dy = (tmp.height - dh) / 2; }
  else { dw = tmp.height * ratio; dx = (tmp.width - dw) / 2; }
  tctx.drawImage(img, dx, dy, dw, dh);
  processCanvasToMaze(tctx, tmp);
  showToast("Лабиринт из картинки готов!");
}

function pickStartAndExit(){
  let start = null;
  outer:
  for (let r = 0; r < rows; r++){
    const S = ringSectors(r);
    for (let s = 0; s < S; s++){
      if (!maze[r][s].solid){ start = {s, r}; break outer; }
    }
  }
  if (!start){ player = {x:0,y:0}; exit = {x:0,y:0}; showToast("Нет проходов"); return; }
  player = {x: start.s, y: start.r};
  const dist = bfsFrom(start.s, start.r);

  const outerR = rows - 1;
  const outerS = ringSectors(outerR);
  let bestS = 0, bestD = -1;
  for (let s = 0; s < outerS; s++){
    const l = lin(outerR, s);
    if (maze[outerR][s].solid) continue;
    if (dist[l] > bestD){ bestD = dist[l]; bestS = s; }
  }
  exit = {x: bestS, y: outerR};
}

/* ===== ЭКСПОРТ / ПЕЧАТЬ ===== */
function buildExportDataURL(){
  const ec = document.createElement("canvas");
  const ectx = ec.getContext("2d");
  ec.width = Math.floor(window.innerWidth * dpr);
  ec.height = Math.floor(window.innerHeight * dpr);
  ectx.fillStyle = "#ffffff";
  ectx.fillRect(0, 0, ec.width, ec.height);
  ectx.drawImage(canvas, 0, 0);
  return ec.toDataURL("image/png");
}
function printMaze(){
  const w = window.open("");
  if (!w) return;
  const url = buildExportDataURL();
  w.document.write(
    `<!doctype html><html><head><meta charset="utf-8"><title>Лабиринт</title>
    <style>@page{margin:10mm}html,body{margin:0;padding:0}img{width:100%;height:auto;display:block}</style>
    </head><body>
    <img src="${url}" onload="setTimeout(function(){window.focus();window.print();},60)">
    </body></html>`
  );
  w.document.close();
}
function exportImage(){
  const a = document.createElement("a");
  a.download = `maze-${shape}-${currentSeed.toString(36)}.png`;
  a.href = buildExportDataURL();
  a.click();
}

/* ===== СОБЫТИЯ ===== */
$("btnBack").addEventListener("click", () => { location.href = "index.html"; });
$("btnGenerate").addEventListener("click", () => generateMaze(false));
$("btnAuto").addEventListener("click", autoRun);
$("btnPrint").addEventListener("click", printMaze);
$("btnExport").addEventListener("click", exportImage);
$("btnTheme").addEventListener("click", toggleTheme);

$("btnImage").addEventListener("click", () => imgInput.click());
imgInput.addEventListener("change", (e) => {
  const f = e.target.files && e.target.files[0];
  if (!f) return;
  const url = URL.createObjectURL(f);
  imageToMaze(url).finally(() => URL.revokeObjectURL(url));
  imgInput.value = "";
});
canvas.addEventListener("dragover", (e) => e.preventDefault());
canvas.addEventListener("drop", (e) => {
  e.preventDefault();
  const f = e.dataTransfer.files && e.dataTransfer.files[0];
  if (!f || !f.type.startsWith("image/")) return;
  const url = URL.createObjectURL(f);
  imageToMaze(url).finally(() => URL.revokeObjectURL(url));
});

algoSelect.addEventListener("change", () => generateMaze(false));

shapeSelect.addEventListener("change", () => {
  if (shapeSelect.value === "polar"){
    const P = LIMITS.polar[limits()];
    const curR = Math.floor(Number(rowsInput.value)) || 25;
    if (!noLimits && (curR > P.maxRows || curR < 6)) rowsInput.value = P.defaultRows;
    if (!["backtracker"].includes(algoSelect.value)){
      showToast("◯ Для витиеватых путей лучше Бэктрекер", 3000);
    }
  }
  applyDeviceLimits();
  generateMaze(false);
});

colsInput.addEventListener("change", () => generateMaze(false));
rowsInput.addEventListener("change", () => generateMaze(false));
seedInput.addEventListener("change", () => generateMaze(false));

fogToggle.addEventListener("change", markDirty);
coinsToggle.addEventListener("change", () => { placeCoins(); updateHud(); markDirty(); });

nolimitToggle.addEventListener("change", (e) => {
  noLimits = e.target.checked;
  applyDeviceLimits();
  if (noLimits) showToast("Лимиты размера сняты", 1800);
});

$("btnWinAgain").addEventListener("click", () => { hideWinOverlay(); generateMaze(false); });
$("btnWinNew").addEventListener("click", () => { hideWinOverlay(); seedInput.value = ""; generateMaze(false); });

/* ===== СВАЙПЫ ===== */
let swipeStart = null;
canvas.addEventListener("pointerdown", (e) => {
  if (e.pointerType === "mouse" && e.button !== 0) return;
  swipeStart = {x: e.clientX, y: e.clientY, t: performance.now()};
});
canvas.addEventListener("pointerup", (e) => {
  if (!swipeStart) return;
  const dx = e.clientX - swipeStart.x, dy = e.clientY - swipeStart.y;
  const dt = performance.now() - swipeStart.t;
  swipeStart = null;
  if (dt > 700) return;
  const TH = 22;
  if (Math.abs(dx) < TH && Math.abs(dy) < TH) return;
  if (Math.abs(dx) > Math.abs(dy)) tryMove(dx > 0 ? 1 : -1, 0);
  else tryMove(0, dy > 0 ? 1 : -1);
});
canvas.addEventListener("pointercancel", () => { swipeStart = null; });

/* ===== КЛАВИАТУРА ===== */
window.addEventListener("keydown", (e) => {
  const tag = e.target && e.target.tagName;
  if (tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT") return;
  switch (e.key){
    case "ArrowUp": case "w": case "W": case "ц": case "Ц": tryMove(0,-1); e.preventDefault(); break;
    case "ArrowDown": case "s": case "S": case "ы": case "Ы": tryMove(0, 1); e.preventDefault(); break;
    case "ArrowLeft": case "a": case "A": case "ф": case "Ф": tryMove(-1,0); e.preventDefault(); break;
    case "ArrowRight": case "d": case "D": case "в": case "В": tryMove( 1,0); e.preventDefault(); break;
    case "r": case "R": case "к": case "К": generateMaze(true); break;
    case "g": case "G": case "п": case "П": seedInput.value = ""; generateMaze(false); break;
    case "t": case "T": case "е": case "Е": toggleTheme(); break;
    case "f": case "F": case "а": case "А": fogToggle.checked = !fogToggle.checked; markDirty(); break;
    case "c": case "C": case "с": case "С":
      shapeSelect.value = shapeSelect.value === "rect" ? "polar" : "rect";
      shapeSelect.dispatchEvent(new Event("change"));
      break;
    case " ":
      if (auto) auto = false; else autoRun();
      e.preventDefault(); break;
  }
});

/* ===== RESIZE ===== */
window.addEventListener("resize", () => {
  recalcIsMobile();
  applyDeviceLimits();
  resizeCanvas();
});
const ro = new ResizeObserver(() => { updateTop(); computeLayout(); markDirty(); });
ro.observe(topbar);

/* ===== СТАРТ ===== */
applyDeviceLimits();
resizeCanvas();
generateMaze(false);
requestAnimationFrame(loop);

})();
</script>
