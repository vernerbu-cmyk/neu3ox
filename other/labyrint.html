<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Лабиринты - NeuroX</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">

<style>

:root{
    --blue:#1E3F8A;
    --blue-soft:#3A5FA8;
    --blue-pale:#E8EEF9;
    --orange:#FF6A00;
    --orange-soft:#FF8B3D;
    --orange-dark:#C85100;
    --orange-pale:#FFEADB;
    --bg:#F4F6FB;
}

*{
    box-sizing:border-box;
}

body{
    margin:0;
    overflow:hidden;
    background:var(--bg);
    font-family:"Nunito Sans",sans-serif;
    color:#222;
}

/* ===== TOPBAR ===== */

#topbar{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:88px;
    background:var(--blue);
    display:flex;
    align-items:center;
    justify-content:center;
    z-index:20;
    padding:0 14px;
    box-sizing:border-box;
    overflow:hidden;
    box-shadow:0 6px 20px rgba(30,63,138,.25);
}

#topbar::before,
#topbar::after{
    content:'';
    position:absolute;
    border-radius:50%;
    pointer-events:none;
}

#topbar::before{
    width:200px;
    height:200px;
    top:-100px;
    right:-60px;
    background:rgba(255,106,0,.22);
}

#topbar::after{
    width:160px;
    height:160px;
    bottom:-100px;
    left:30px;
    background:rgba(255,255,255,.09);
}

/* ===== TITLE ===== */

#title{
    position:absolute;
    left:50%;
    transform:translateX(-50%);
    color:#fff;
    font-family:"Fredoka",sans-serif;
    font-size:28px;
    font-weight:700;
    letter-spacing:.4px;
    pointer-events:none;
    z-index:2;
    text-shadow:0 2px 6px rgba(0,0,0,.15);
}

/* ===== LEFT CONTROLS ===== */

#controls{
    position:absolute;
    left:14px;
    display:flex;
    align-items:center;
    gap:8px;
    z-index:3;
}

/* ===== RIGHT CONTROLS ===== */

#rightControls{
    position:absolute;
    right:14px;
    display:flex;
    align-items:center;
    gap:8px;
    z-index:3;
}

/* ===== BACK BUTTON ===== */

.menu-btn{
    width:44px;
    height:44px;
    border:none;
    border-radius:14px;
    background:rgba(255,255,255,.18);
    color:#fff;
    font-size:22px;
    cursor:pointer;
    transition:.22s;
    flex-shrink:0;
    font-family:inherit;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    padding:0;
    box-shadow:none;
}

.menu-btn:hover{
    background:var(--orange);
    transform:rotate(-6deg) scale(1.06);
}

.menu-btn:active{
    transform:scale(.95);
    box-shadow:none;
}

/* ===== INPUTS ===== */

input[type="number"]{
    width:62px;
    height:40px;
    border:none;
    border-radius:12px;
    padding:0 10px;
    font-size:15px;
    font-family:inherit;
    font-weight:700;
    color:var(--blue);
    background:#fff;
    text-align:center;
    transition:.18s;
}

input[type="number"]:focus{
    outline:2px solid var(--orange);
    outline-offset:0;
}

/* ===== BUTTONS ===== */

button{
    border:none;
    border-radius:12px;
    background:var(--orange);
    color:#fff;
    font-family:"Nunito Sans",sans-serif;
    font-size:14px;
    font-weight:800;
    padding:10px 16px;
    cursor:pointer;
    box-shadow:0 4px 0 var(--orange-dark);
    transition:background .15s, transform .12s, box-shadow .12s;
    height:40px;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    letter-spacing:.2px;
    white-space:nowrap;
}

button:hover{
    background:var(--orange-soft);
}

button:active{
    transform:translateY(3px);
    box-shadow:0 1px 0 var(--orange-dark);
}

/* ===== LABEL ===== */

#labubuLabel{
    display:flex;
    align-items:center;
    gap:6px;
    color:#fff;
    font-size:13px;
    font-weight:700;
    cursor:pointer;
    user-select:none;
    white-space:nowrap;
}

#labubuLabel input[type="checkbox"]{
    accent-color:var(--orange);
    width:18px;
    height:18px;
    cursor:pointer;
    margin:0;
}

/* ===== CANVAS ===== */

canvas{
    position:fixed;
    top:0;
    left:0;
    background:#fff;
}

/* ===== LABUBU ===== */

#labubuWin{
    position:fixed;
    inset:0;
    width:100vw;
    height:100vh;
    object-fit:contain;
    background:rgba(0,0,0,.55);
    display:none;
    z-index:999;
}

/* ===== COPY ===== */

#copy{
    position:fixed;
    right:14px;
    bottom:8px;
    font-size:12px;
    color:#98A3BF;
    font-weight:600;
    pointer-events:none;
    z-index:10;
}

/* ===== MOBILE ===== */

@media(max-width:900px){

    #topbar{
        height:132px;
        align-items:flex-start;
        padding-top:10px;
    }

    #title{
        top:14px;
        font-size:22px;
    }

    #controls{
        top:56px;
        left:10px;
        right:10px;
        gap:6px;
        flex-wrap:wrap;
    }

    #rightControls{
        top:56px;
        right:10px;
        gap:6px;
    }

    button{
        font-size:12px;
        padding:7px 10px;
        height:34px;
        border-radius:10px;
    }

    .menu-btn{
        width:38px;
        height:38px;
        font-size:18px;
        border-radius:12px;
    }

    input[type="number"]{
        width:48px;
        height:34px;
        font-size:13px;
        border-radius:10px;
    }

    #labubuLabel{
        font-size:12px;
    }
}

.mobileHide{
    display:none !important;
}

</style>
<link rel="stylesheet" href="../assets/menu-drawer.css">
</head>

<body>

<div id="topbar">

    <div id="controls">

        <button class="menu-btn" onclick="goBack()" aria-label="Назад">☰</button>

        <input id="cols" type="number" value="25">
        <input id="rows" type="number" value="25">

        <button onclick="generateMaze()">Создать</button>
        <button onclick="autoRun()">Путь</button>

        <label id="labubuLabel">
            <input type="checkbox" id="labubuToggle" checked>
            Лабубу
        </label>

    </div>

    <div id="title">Лабиринты</div>

    <div id="rightControls">
        <button onclick="printMaze()">Печать</button>
        <button onclick="exportImage()">PNG</button>
    </div>

</div>

<canvas id="maze"></canvas>

<div id="copy">© verner</div>

<img id="labubuWin"
src="https://media1.tenor.com/m/OUh0o7DMsGYAAAAC/labubu-%D0%BB%D0%B0%D0%B1%D1%83%D0%B1%D1%83.gif">

<script>

const canvas=document.getElementById("maze");
const ctx=canvas.getContext("2d");

const labubuWin=document.getElementById("labubuWin");

function goBack(){
    location.href="index.html";
}

function checkDevice(){

    if(
        window.innerWidth <= 700 ||
        navigator.maxTouchPoints > 0
    ){

        document
        .getElementById("rightControls")
        .classList.add("mobileHide");

    }

}

checkDevice();

window.addEventListener("resize",checkDevice);


let TOP=88;


function updateTop(){
    TOP=document.getElementById("topbar").offsetHeight;
}

let cols,rows,cell;
let maze=[];
let player;
let exit;

let trail=[];
let auto=false;
let path=[];
let pathIndex=0;

let ox=0,oy=0;

const DIRS=[
    {x:0,y:-1},
    {x:1,y:0},
    {x:0,y:1},
    {x:-1,y:0}
];

function resize(){
    updateTop();
    canvas.width=innerWidth;
    canvas.height=innerHeight;

    if(cols){
        let availableHeight=canvas.height-TOP;

        cell=Math.min(
            canvas.width/cols,
            availableHeight/rows
        );

        ox=(canvas.width-cols*cell)/2;
        oy=(canvas.height-TOP-rows*cell)/2+TOP;
    }
}

window.onresize=()=>{resize();draw();};

class DSU{
    constructor(n){
        this.p=[...Array(n)].map((_,i)=>i);
    }
    f(x){
        return this.p[x]==x?x:this.p[x]=this.f(this.p[x]);
    }
    u(a,b){
        a=this.f(a);b=this.f(b);
        if(a==b)return false;
        this.p[b]=a;
        return true;
    }
}

function id(x,y){return y*cols+x;}

function generateMaze(){

cols=+document.getElementById("cols").value;
rows=+document.getElementById("rows").value;

resize();

maze=[];
trail=[];
auto=false;
path=[];
pathIndex=0;

player={x:0,y:0};
exit={x:cols-1,y:rows-1};

labubuWin.style.display="none";

for(let y=0;y<rows;y++){
maze[y]=[];
for(let x=0;x<cols;x++){
maze[y][x]={w:[1,1,1,1]};
}}

let edges=[];

for(let y=0;y<rows;y++){
for(let x=0;x<cols;x++){
if(x<cols-1)edges.push({x,y,d:1,nx:x+1,ny:y});
if(y<rows-1)edges.push({x,y,d:2,nx:x,ny:y+1});
}}

edges.sort(()=>Math.random()-0.5);

let dsu=new DSU(rows*cols);

for(let e of edges){
if(dsu.u(id(e.x,e.y),id(e.nx,e.ny))){
maze[e.y][e.x].w[e.d]=0;
maze[e.ny][e.nx].w[[2,3,0,1][e.d]]=0;
}}

draw();
}

ctx.fillStyle="#ffffff";
ctx.fillRect(0,0,canvas.width,canvas.height);

function findPath(){

let q=[{x:player.x,y:player.y,p:[]}];
let v=new Set();

while(q.length){
let c=q.shift();
let k=c.x+","+c.y;
if(v.has(k))continue;
v.add(k);

let p=c.p.concat({x:c.x,y:c.y});

if(c.x==exit.x&&c.y==exit.y)return p;

for(let d=0;d<4;d++){
if(!maze[c.y][c.x].w[d]){
let nx=c.x+DIRS[d].x;
let ny=c.y+DIRS[d].y;
q.push({x:nx,y:ny,p:p});
}}
}
return null;
}

function autoRun(){
path=findPath();
if(!path)return;
auto=true;
pathIndex=0;
}

function checkWin(){
if(player.x===exit.x && player.y===exit.y){
if(document.getElementById("labubuToggle").checked){
labubuWin.style.display="block";
setTimeout(()=>labubuWin.style.display="none",2500);
}
auto=false;
}
}

function draw(){

if(!maze.length) return;

ctx.clearRect(0,0,canvas.width,canvas.height);

ctx.strokeStyle="#000";
ctx.lineWidth=2;

for(let y=0;y<rows;y++){
for(let x=0;x<cols;x++){
let c=maze[y][x];
let px=x*cell+ox;
let py=y*cell+oy;

if(c.w[0])line(px,py,px+cell,py);
if(c.w[1])line(px+cell,py,px+cell,py+cell);
if(c.w[2])line(px,py+cell,px+cell,py+cell);
if(c.w[3])line(px,py,px,py+cell);
}}

function line(x1,y1,x2,y2){
ctx.beginPath();
ctx.moveTo(x1,y1);
ctx.lineTo(x2,y2);
ctx.stroke();
}

ctx.strokeStyle="#FF6A00";
ctx.lineWidth=4;

for(let i=1;i<trail.length;i++){
ctx.beginPath();
ctx.moveTo(trail[i-1].x*cell+ox+cell/2,trail[i-1].y*cell+oy+cell/2);
ctx.lineTo(trail[i].x*cell+ox+cell/2,trail[i].y*cell+oy+cell/2);
ctx.stroke();
}

/* PLAYER */
ctx.fillStyle="#FF6A00";
ctx.fillRect(player.x*cell+ox+cell/4,player.y*cell+oy+cell/4,cell/2,cell/2);

/* EXIT (ИСПРАВЛЕНО) */
let ex=exit.x*cell+ox+cell/2;
let ey=exit.y*cell+oy+cell/2;

ctx.fillStyle="#fff";
ctx.fillRect(exit.x*cell+ox+cell*0.25,exit.y*cell+oy+cell*0.25,cell*0.5,cell*0.5);

ctx.strokeStyle="#FF6A00";
ctx.lineWidth=3;
ctx.strokeRect(exit.x*cell+ox+cell*0.25,exit.y*cell+oy+cell*0.25,cell*0.5,cell*0.5);

ctx.fillStyle="#FF6A00";
ctx.font=`${Math.floor(cell*0.35)}px Arial`;
ctx.textAlign="center";
ctx.textBaseline="middle";
ctx.fillText("F",ex,ey);
}

function loop(){

if(auto && pathIndex<path.length){
player=path[pathIndex++];
trail.push({...player});
checkWin();
}

draw();
requestAnimationFrame(loop);
}

resize();
generateMaze();
loop();

function printMaze(){
const w=window.open("");
const img=canvas.toDataURL();
w.document.write(`<img src="${img}" style="width:100%">`);
w.print();
}

function exportImage(){

    const exportCanvas=document.createElement("canvas");
    const ctx2=exportCanvas.getContext("2d");

    exportCanvas.width=canvas.width;
    exportCanvas.height=canvas.height;

    // 🔥 ЖЁСТКИЙ БЕЛЫЙ ФОН (без альфы вообще)
    ctx2.fillStyle="#ffffff";
    ctx2.fillRect(0,0,exportCanvas.width,exportCanvas.height);

    // 🔥 копируем основной canvas
    ctx2.drawImage(canvas,0,0);

    // 🔥 ВАЖНО: пересоздаём PNG уже без прозрачности
    const imgURL=exportCanvas.toDataURL("image/png");

    const a=document.createElement("a");
    a.download="maze.png";
    a.href=imgURL;
    a.click();
}
</script>


<script src="../assets/menu-data.js"></script>
<script src="../assets/menu-drawer.js"></script>
</body>
</html>
