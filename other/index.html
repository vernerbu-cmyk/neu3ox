<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Другое — NeuroX</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito+Sans:wght@400;600;700;800&display=swap" rel="stylesheet" />

  <!-- Общие стили -->
  <link rel="stylesheet" href="../shared/styles.css" />

  <!-- Уникальные стили «Другое» -->
  <style>
    /* Метка «назад» на логотипе */
    .logo { position: relative; }
    .logo::after {
      content: '←';
      position: absolute;
      top: -4px; left: -6px;
      width: 22px; height: 22px;
      display: flex; align-items: center; justify-content: center;
      background: #FF6A00; color: #fff;
      font-size: 13px; font-weight: 800;
      border-radius: 50%;
      box-shadow: 0 2px 6px rgba(0, 0, 0, .3);
      font-family: "Nunito Sans", sans-serif;
      line-height: 1;
      pointer-events: none;
    }
    @media (max-width: 700px) {
      .logo::after { width: 20px; height: 20px; font-size: 12px; top: -3px; left: -5px; }
    }

    /* Описание под названием карточки */
    .desc {
      margin-top: 2px;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-muted);
      line-height: 1.35;
      transition: color .3s;
    }
    @media (max-width: 700px) {
      .desc { font-size: 12px; }
    }

    /* 1. ЛАБИРИНТ */
    @keyframes mazeGlow {
      0%, 40%  { stroke: currentColor; }
      50%, 90% { stroke: #FF6A00; }
      100%     { stroke: currentColor; }
    }
    .card-1:hover .maze-inner { animation: mazeGlow 2s ease-in-out infinite; }

    /* 2. ЛАБИРИНТ 2.0 */
    @keyframes sparkSpin {
      0%, 100% { transform: rotate(0deg) scale(1); }
      50%      { transform: rotate(180deg) scale(1.2); }
    }
    .card-2 .sparkle { transform-box: fill-box; transform-origin: center; }
    .card-2:hover .maze-inner { animation: mazeGlow 2s ease-in-out infinite; }
    .card-2:hover .sparkle    { animation: sparkSpin 2.4s ease-in-out infinite; }

    /* 3. МЕМО */
    @keyframes cardPulse {
      0%, 100% { stroke: currentColor; fill: transparent; }
      50%      { stroke: #FF6A00;     fill: rgba(255,106,0,.15); }
    }
    .card-3:hover .card-a { animation: cardPulse 2s ease-in-out infinite; }
    .card-3:hover .card-b { animation: cardPulse 2s ease-in-out infinite .5s; }

    /* 4. ЧТО ИЗМЕНИЛОСЬ */
    @keyframes dotGlow {
      0%, 40%  { fill: #FF6A00; }
      50%, 90% { fill: currentColor; }
      100%     { fill: #FF6A00; }
    }
    .card-4:hover .diff-dot { animation: dotGlow 1.8s ease-in-out infinite; }

    /* 5. СВЕТОФОР */
    @keyframes lightOn {
      0%, 25%   { fill: currentColor; }
      33%, 66%  { fill: #FF6A00; }
      75%, 100% { fill: currentColor; }
    }
    .card-5:hover .light-1 { animation: lightOn 3s ease-in-out infinite; }
    .card-5:hover .light-2 { animation: lightOn 3s ease-in-out infinite 1s; }
    .card-5:hover .light-3 { animation: lightOn 3s ease-in-out infinite 2s; }
  </style>
</head>

<body>

  <div class="container">
    <div class="cards">

      <!-- 1. ЛАБИРИНТ -->
      <div class="card card-1" onclick="openTrainer('labyrint.html')">
        <div class="left">
          <div class="icon-wrap">
            <svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round">
              <rect x="6" y="6" width="36" height="36" rx="3"/>
              <g class="maze-inner">
                <path d="M15 6 L15 15"/>
                <path d="M6 15 L24 15"/>
                <path d="M24 6 L24 24"/>
                <path d="M15 24 L33 24"/>
                <path d="M33 15 L33 33"/>
                <path d="M15 33 L42 33"/>
                <path d="M24 33 L24 42"/>
              </g>
              <circle cx="10.5" cy="10.5" r="2" fill="#FF6A00" stroke="none"/>
              <circle cx="37.5" cy="37.5" r="2" fill="#FF6A00" stroke="none"/>
            </svg>
          </div>
          <div class="card-text">
            <div class="title">Лабиринт</div>
            <div class="desc">Проведи линию от входа к выходу, не задев стены</div>
          </div>
        </div>
        <div class="arrow">›</div>
      </div>

      <!-- 2. ЛАБИРИНТ 2.0 -->
      <div class="card card-2" onclick="openTrainer('labyrint2.html')">
        <div class="left">
          <div class="icon-wrap">
            <svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round">
              <rect x="6" y="6" width="36" height="36" rx="3"/>
              <g class="maze-inner">
                <path d="M15 6 L15 15"/>
                <path d="M6 15 L24 15"/>
                <path d="M24 6 L24 24"/>
                <path d="M15 24 L33 24"/>
                <path d="M33 15 L33 33"/>
                <path d="M15 33 L42 33"/>
                <path d="M24 33 L24 42"/>
              </g>
              <circle cx="10.5" cy="10.5" r="2" fill="#FF6A00" stroke="none"/>
              <circle cx="37.5" cy="37.5" r="2" fill="#FF6A00" stroke="none"/>
              <path class="sparkle" d="M38 12 L39 15 L42 16 L39 17 L38 20 L37 17 L34 16 L37 15 Z" fill="#FF6A00" stroke="none"/>
            </svg>
          </div>
          <div class="card-text">
            <div class="title">Лабиринт 2.0</div>
            <div class="desc">Обновлённая версия с новыми правилами (тест)</div>
          </div>
        </div>
        <div class="arrow">›</div>
      </div>

      <!-- 3. МЕМО -->
      <div class="card card-3" onclick="openTrainer('memo.html')">
        <div class="left">
          <div class="icon-wrap">
            <svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round">
              <rect class="card-a" x="4" y="12" width="18" height="26" rx="3"/>
              <rect class="card-b" x="26" y="12" width="18" height="26" rx="3"/>
              <text x="13" y="31" font-family="Fredoka, sans-serif" font-size="16" font-weight="700" fill="currentColor" stroke="none" text-anchor="middle">?</text>
              <text x="35" y="31" font-family="Fredoka, sans-serif" font-size="16" font-weight="700" fill="#FF6A00" stroke="none" text-anchor="middle">?</text>
            </svg>
          </div>
          <div class="card-text">
            <div class="title">Мемо</div>
            <div class="desc">Найди пары среди перевёрнутых карточек</div>
          </div>
        </div>
        <div class="arrow">›</div>
      </div>

      <!-- 4. ЧТО ИЗМЕНИЛОСЬ? -->
      <div class="card card-4" onclick="openTrainer('peremeny.html')">
        <div class="left">
          <div class="icon-wrap">
            <svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round">
              <rect x="4" y="8" width="18" height="32" rx="3"/>
              <rect x="26" y="8" width="18" height="32" rx="3"/>
              <circle cx="9" cy="15" r="2" fill="currentColor" stroke="none"/>
              <path d="M14 15 L18 15"/>
              <path d="M8 21 L18 21"/>
              <path d="M8 27 L18 27"/>
              <circle cx="9" cy="34" r="2" fill="currentColor" stroke="none"/>
              <path d="M14 34 L18 34"/>
              <circle class="diff-dot" cx="31" cy="15" r="2" fill="#FF6A00" stroke="none"/>
              <path d="M36 15 L40 15"/>
              <path d="M30 21 L40 21"/>
              <path d="M30 27 L40 27"/>
              <circle cx="31" cy="34" r="2" fill="currentColor" stroke="none"/>
              <path d="M36 34 L40 34"/>
            </svg>
          </div>
          <div class="card-text">
            <div class="title">Что изменилось?</div>
            <div class="desc">Запомни картинку и найди отличия на новой</div>
          </div>
        </div>
        <div class="arrow">›</div>
      </div>

      <!-- 5. СВЕТОФОР -->
      <div class="card card-5" onclick="openTrainer('stoplight.html')">
        <div class="left">
          <div class="icon-wrap">
            <svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round">
              <rect x="16" y="4" width="16" height="40" rx="4"/>
              <circle class="light light-1" cx="24" cy="13" r="3.5" fill="currentColor" stroke="none"/>
              <circle class="light light-2" cx="24" cy="24" r="3.5" fill="#FF6A00" stroke="none"/>
              <circle class="light light-3" cx="24" cy="35" r="3.5" fill="currentColor" stroke="none"/>
            </svg>
          </div>
          <div class="card-text">
            <div class="title">Светофор</div>
            <div class="desc">Реагируй на сигналы и переключайся между задачами</div>
          </div>
        </div>
        <div class="arrow">›</div>
      </div>

    </div>
  </div>

  <!-- Общие скрипты: layout → seasons → app -->
  <script src="../shared/layout.js" defer></script>
  <script src="../shared/seasons.js" defer></script>
  <script src="../shared/storage.js" defer></script>
<script src="../shared/app.js" defer></script>

  <!-- Уникальное для «Другое» -->
  <script defer>
    (function () {
      'use strict';

      function applyHeader() {
        const h1 = document.querySelector('header h1');
        if (h1) h1.textContent = 'Другое';

        const subtitle = document.getElementById('headerSubtitle');
        if (subtitle) subtitle.textContent = 'NeuroX · 5 тренажёров';
      }

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', applyHeader);
      } else {
        applyHeader();
      }

      // Клик по логотипу — назад в главное меню
      document.addEventListener('click', function (e) {
        const logo = e.target.closest && e.target.closest('#logoBtn');
        if (!logo) return;
        e.preventDefault();
        e.stopImmediatePropagation();
        location.href = '../index.html';
      }, true);

      // Открытие тренажёра
      window.openTrainer = function (path) {
        location.href = path;
      };

      // Синхронизация иконки темы в шапке
      const SVG_SUN  = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
      const SVG_MOON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>';

      function syncThemeIcon() {
        const btn = document.getElementById('themeBtn');
        if (!btn) return;
        const theme = document.documentElement.getAttribute('data-theme');
        btn.innerHTML = theme === 'dark' ? SVG_SUN : SVG_MOON;
      }

      new MutationObserver(syncThemeIcon).observe(document.documentElement, {
        attributes: true,
        attributeFilter: ['data-theme']
      });
      syncThemeIcon();
    })();
  </script>

</body>

</html>
