<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>Запрещённый символ</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #f4f6fb;
            font-family: Arial, sans-serif;
        }

        header {

            background: #1E3F8A;
            color: #fff;

            text-align: center;

            padding: 18px;

            font-size: 30px;
            font-style: italic;

        }

        .container {

            max-width: 820px;
            margin: auto;

            padding: 20px;

        }

        .card {

            background: #fff;

            border-radius: 22px;

            padding: 30px;

            box-shadow: 0 5px 20px rgba(0, 0, 0, .15);

        }

        .controls {

            display: flex;
            gap: 15px;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;

        }

        select {

            padding: 12px 16px;

            font-size: 20px;

            border-radius: 12px;

            border: 2px solid #ddd;

        }

        button {

            background: #FF6A00;

            color: #fff;

            border: none;

            border-radius: 12px;

            padding: 12px 28px;

            font-size: 20px;

            cursor: pointer;

            box-shadow: 0 4px 0 #c34d00;

        }

        button:active {

            transform: translateY(3px);
            box-shadow: none;

        }

        #rule {

            margin-top: 25px;

            font-size: 24px;

        }

        #target {

            color: #FF6A00;

            font-size: 54px;

            font-weight: bold;

        }

        #rule {

            display: flex;

            flex-direction: column;

            align-items: center;

            justify-content: center;

            text-align: center;

            margin: 25px 0;

        }

        .title {

            width: 100%;

            text-align: center;

            font-size: 24px;

            font-weight: bold;

            color: #666;

            margin-bottom: 10px;

            text-transform: uppercase;

        }

        #symbol {

            height: 220px;

            display: flex;

            justify-content: center;
            align-items: center;

            font-size: 120px;

            font-weight: bold;

            color: #1E3F8A;

            user-select: none;

            cursor: pointer;

            transition: .15s;

        }

        #symbol.good {

            color: #3bb54a;
            transform: scale(1.1);

        }

        #symbol.bad {

            color: #ff4040;
            transform: scale(.92);

        }

        .stats {

            display: flex;

            justify-content: center;

            align-items: center;

            gap: 80px;

            margin-top: 20px;

            font-size: 22px;

        }

        .speed {

            margin-top: 30px;

            text-align: center;

        }

        .speed input {

            width: 300px;

        }

        .speedLabels {

            display: flex;

            justify-content: space-between;

            width: 300px;

            margin: 8px auto 0;

            font-size: 14px;

            color: #666;

        }

        footer {

            margin: 25px;

            text-align: right;

            color: #888;

            font-size: 12px;

        }

        @media(max-width:700px) {

            .card {

                padding: 18px;

            }

            #symbol {

                font-size: 95px;
                height: 180px;

            }

            .stats {

                flex-direction: column;
                gap: 10px;

            }

            .speed input,
            .speedLabels {

                width: 100%;

            }

            button,
            select {

                width: 100%;

            }

        }
    </style>
<link rel="stylesheet" href="../../assets/menu-drawer.css">
</head>

<body>

    <header>
        Запрещённый символ
    </header>

    <div class="container">

        <div class="card">

            <div class="controls">

                <select id="targetSelect">
                </select>


                <button id="startBtn">
                    Старт
                </button>

            </div>

            <div id="rule">

                Цель

                <div id="target">
                    М
                </div>

            </div>

            <div id="symbol">
                —
            </div>

            <div class="stats">

                <div>
                    Правильно:
                    <span id="good">0</span>
                </div>

                <div>
                    Ошибки:
                    <span id="bad">0</span>
                </div>

            </div>

            <div class="speed">

                <input type="range" id="speed" min="1" max="10" value="5">

                <div class="speedLabels">

                    <span>Медленно</span>
                    <span>Быстро</span>

                </div>

            </div>

        </div>

    </div>

    <footer>
        © verner
    </footer>

    <script>

        let lettersData = {};

        let series = [];
        let index = 0;
        let timer = null;
        let speed = 1100;

        let good = 0;
        let bad = 0;


        async function loadLetters() {

            const response = await fetch("letters.json");

            lettersData = await response.json();


            const select = document.getElementById("targetSelect");

            select.innerHTML = "";


            Object.keys(lettersData).forEach(letter => {

                const option = document.createElement("option");

                option.value = letter;
                option.textContent = letter;

                select.appendChild(option);

            });


            document.getElementById("target").textContent =
                select.value;

        }

        function shuffle(arr) {

            for (let i = arr.length - 1; i > 0; i--) {

                const j = Math.floor(Math.random() * (i + 1));

                [arr[i], arr[j]] = [arr[j], arr[i]];

            }

            return arr;

        }
        function buildSeries(target) {

            series = [];


            const data = lettersData[target];


            // цель
            for (let i = 0; i < 14; i++) {

                series.push(target);

            }


            // похожие буквы
            for (let i = 0; i < 18; i++) {

                const arr = data.distractors;

                series.push(
                    arr[Math.floor(Math.random() * arr.length)]
                );

            }


            // случайные буквы
            for (let i = 0; i < 8; i++) {

                const arr = data.random;

                series.push(
                    arr[Math.floor(Math.random() * arr.length)]
                );

            }


            shuffle(series);


        }



        function flash(className) {

            const s = document.getElementById("symbol");

            s.classList.remove("good", "bad");

            void s.offsetWidth;

            s.classList.add(className);

            setTimeout(() => {

                s.classList.remove("good", "bad");

            }, 150);

        }



        function updateStats() {

            document.getElementById("good").textContent = good;

            document.getElementById("bad").textContent = bad;
        }

        function showNext() {

            if (index >= series.length) {

                finishGame();
                return;

            }

            document.getElementById("symbol").textContent =
                series[index];

            updateStats();

        }



        function nextStep() {

            index++;

            showNext();

        }



        function finishGame() {

            clearTimeout(timer);

            timer = null;

            document.getElementById("symbol").textContent = "✔";

        }



        function scheduleNext() {

            clearTimeout(timer);

            timer = setTimeout(() => {

                nextStep();

                scheduleNext();

            }, speed);

        }



        document.getElementById("targetSelect").onchange = function () {

            document.getElementById("target").textContent = this.value;

        };



        document.getElementById("startBtn").onclick = function () {
            if (Object.keys(lettersData).length === 0) {

                alert("JSON ещё не загрузился");

                return;

            }

            clearTimeout(timer);

            good = 0;
            bad = 0;

            index = 0;

            const keys = Object.keys(lettersData);

            const target = keys[
                Math.floor(Math.random() * keys.length)
            ];

            document.getElementById("target").textContent = target;

            buildSeries(target);

            showNext();

            scheduleNext();

        };



        document.getElementById("symbol").onclick = function () {

            if (!series.length) return;

            if (index >= series.length) return;

            const target =
                document.getElementById("target").textContent;

            if (series[index] === target) {

                good++;
                flash("good");

            } else {

                bad++;
                flash("bad");

            }

            updateStats();

        };



        document.getElementById("speed").oninput = function () {

            const v = Number(this.value);

            speed = 1700 - v * 130;

            if (timer) {

                scheduleNext();

            }

        };

        loadLetters().then(() => {

            console.log("JSON загружен");
            console.log(lettersData);

        });

        updateStats();

    </script>


<script src="../../assets/menu-data.js"></script>
<script src="../../assets/menu-drawer.js"></script>
</body>

</html>
