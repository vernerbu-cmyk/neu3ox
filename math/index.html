<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Скоросчёт — NeuroX</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito+Sans:wght@400;600;700;800&display=swap" rel="stylesheet" />

  <!-- Общие стили -->
  <link rel="stylesheet" href="../shared/styles.css" />

  <!-- Уникальные стили «Скоросчёт» -->
  <style>
    /* Метка «назад» на логотипе */
    .logo { position: relative; }
    .logo::after {
      content: '←';
      position: absolute;
      top: -4px;
      left: -6px;
      width: 22px; height: 22px;
      display: flex; align-items: center; justify-content: center;
      background: #FF6A00; color: #fff;
      font-size: 13px; font-weight: 800;
      border-radius: 50%;
      box-shadow: 0 2px 6px rgba(0, 0, 0, .3);
      font-family: "Nunito Sans", sans-serif;
      line-height: 1;
      pointer-events: none;
    }
    @media (max-width: 700px) {
      .logo::after { width: 20px; height: 20px; font-size: 12px; top: -3px; left: -5px; }
    }

    /* 1. ДОМИКИ */
    @keyframes winBlink {
      0%, 40%  { stroke: var(--blue); }
      50%, 90% { stroke: #FF6A00; }
      100%     { stroke: var(--blue); }
    }
    .win-1, .win-2 { transition: stroke .3s; }
    .card-1:hover .win-1 { animation: winBlink 2.4s ease-in-out infinite; }
    .card-1:hover .win-2 { animation: winBlink 2.4s ease-in-out infinite .6s; }

    /* 2. НАЙДИ ЧИСЛО */
    @keyframes magPulse {
      0%, 100% { transform: scale(1); }
      50%      { transform: scale(1.10); }
    }
    @keyframes numBlink {
      0%, 40%  { fill: var(--blue); }
      50%, 90% { fill: #FF6A00; }
      100%     { fill: var(--blue); }
    }
    .mag-circle { transform-box: fill-box; transform-origin: center; }
    .mag-num    { transition: fill .3s; }
    .card-2:hover .mag-circle { animation: magPulse 2s ease-in-out infinite; }
    .card-2:hover .mag-num    { animation: numBlink 2s ease-in-out infinite; }

    /* 3. МАГИЧЕСКИЙ КВАДРАТ */
    @keyframes magicPulse {
      0%, 100% { transform: scale(1);   opacity: 1; }
      50%      { transform: scale(1.8); opacity: .6; }
    }
    @keyframes gridGlow {
      0%, 40%  { stroke: var(--blue); }
      50%, 90% { stroke: #FF6A00; }
      100%     { stroke: var(--blue); }
    }
    .magic-dot { transform-box: fill-box; transform-origin: center; }
    .grid-line { transition: stroke .3s; }
    .card-3:hover .magic-dot { animation: magicPulse 1.6s ease-in-out infinite; }
    .card-3:hover .grid-line { animation: gridGlow 2.4s ease-in-out infinite; }

    /* 4. ДЕЛЕНИЕ */
    @keyframes divBlink {
      0%, 40%  { fill: var(--blue); }
      50%, 90% { fill: #FF6A00; }
      100%     { fill: var(--blue); }
    }
    .div-dot-1, .div-dot-2 { transition: fill .3s; }
    .card-4:hover .div-dot-1 { animation: divBlink 1.8s ease-in-out infinite; }
    .card-4:hover .div-dot-2 { animation: divBlink 1.8s ease-in-out infinite .9s; }

    /* 5. СЧИТАЛОЧКА */
    @keyframes btnBlink {
      0%, 40%  { fill: var(--blue); }
      50%, 90% { fill: #FF6A00; }
      100%     { fill: var(--blue); }
    }
    .calc-btn { transition: fill .3s; }
    .card-5:hover .calc-btn.b1 { animation: btnBlink 2.4s ease-in-out infinite; }
    .card-5:hover .calc-btn.b2 { animation: btnBlink 2.4s ease-in-out infinite .15s; }
    .card-5:hover .calc-btn.b3 { animation: btnBlink 2.4s ease-in-out infinite .30s; }
    .card-5:hover .calc-btn.b4 { animation: btnBlink 2.4s ease-in-out infinite .45s; }
    .card-5:hover .calc-btn.b5 { animation: btnBlink 2.4s ease-in-out infinite .60s; }
    .card-5:hover .calc-btn.b6 { animation: btnBlink 2.4s ease-in-out infinite .75s; }

    /* 6. ТАБЛИЦА УМНОЖЕНИЯ */
    @keyframes xSpin {
      0%, 20%   { transform: rotate(0deg); }
      50%, 70%  { transform: rotate(90deg); }
      100%      { transform: rotate(0deg); }
    }
    .x-line { transform-box: fill-box; transform-origin: center; }
    .card-6:hover .x-line { animation: xSpin 2.6s ease-in-out infinite; }

    /* 7. ТОЧКИ */
    @keyframes dotBlink {
      0%, 25%  { opacity: 1; }
      50%, 75% { opacity: .12; }
      100%     { opacity: 1; }
    }
    .dot { transition: opacity .3s; }
    .card-7:hover .d1 { animation: dotBlink 2.4s ease-in-out infinite; }
    .card-7:hover .d2 { animation: dotBlink 2.4s ease-in-out infinite .3s; }
    .card-7:hover .d3 { animation: dotBlink 2.4s ease-in-out infinite .6s; }
    .card-7:hover .d4 { animation: dotBlink 2.4s ease-in-out infinite .9s; }
    .card-7:hover .d5 { animation: dotBlink 2.4s ease-in-out infinite 1.2s; }
  </style>
</head>

<body>

  <div class="container">
    <div class="cards">

      <!-- 1. ДОМИКИ -->
      <div class="card card-1" onclick="openTrainer('domiky.html')">
        <div class="left">
          <div class="icon-wrap">
            <svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round">
              <path d="M5 21 L14 12 L23 21 V39 H5 Z"/>
              <path d="M25 26 L33 18 L41 26 V39 H25 Z"/>
              <rect class="win-1" x="10" y="28" width="8" height="11"/>
              <rect class="win-2" x="30" y="31" width="6" height="8"/>
            </svg>
          </div>
          <div class="card-text"><div class="title">Домики</div></div>
        </div>
        <div class="arrow">›</div>
      </div>

      <!-- 2. НАЙДИ ЧИСЛО -->
      <div class="card card-2" onclick="openTrainer('findnumber.html')">
        <div class="left">
          <div class="icon-wrap">
            <svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
              <circle class="mag-circle" cx="20" cy="20" r="13"/>
              <path d="M30 30 L41 41"/>
              <text class="mag-num" x="20" y="26" font-family="Fredoka, sans-serif" font-size="15" font-weight="700" fill="currentColor" stroke="none" text-anchor="middle">7</text>
            </svg>
          </div>
          <div class="card-text"><div class="title">Найди число</div></div>
        </div>
        <div class="arrow">›</div>
      </div>

      <!-- 3. МАГИЧЕСКИЙ КВАДРАТ -->
      <div class="card card-3" onclick="openTrainer('magic.html')">
        <div class="left">
          <div class="icon-wrap">
            <svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round">
              <rect x="6" y="6" width="36" height="36" rx="4"/>
              <path class="grid-line" d="M18 6 V42 M30 6 V42 M6 18 H42 M6 30 H42"/>
              <circle class="magic-dot" cx="24" cy="24" r="3" fill="#FF6A00" stroke="none"/>
            </svg>
          </div>
          <div class="card-text"><div class="title">Магический квадрат</div></div>
        </div>
        <div class="arrow">›</div>
      </div>

      <!-- 4. ДЕЛЕНИЕ -->
      <div class="card card-4" onclick="openTrainer('delenie.html')">
        <div class="left">
          <div class="icon-wrap">
            <svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
              <circle class="div-dot-1" cx="24" cy="14" r="3" fill="currentColor" stroke="none"/>
              <path d="M8 24 H40"/>
              <circle class="div-dot-2" cx="24" cy="34" r="3" fill="currentColor" stroke="none"/>
            </svg>
          </div>
          <div class="card-text"><div class="title">Деление</div></div>
        </div>
        <div class="arrow">›</div>
      </div>

      <!-- 5. СЧИТАЛОЧКА -->
      <div class="card card-5" onclick="openTrainer('primery.html')">
        <div class="left">
          <div class="icon-wrap">
            <svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round">
              <rect x="10" y="5" width="28" height="38" rx="4"/>
              <rect x="15" y="10" width="18" height="7" rx="1.5"/>
              <circle class="calc-btn b1" cx="17" cy="25" r="1.8" fill="currentColor" stroke="none"/>
              <circle class="calc-btn b2" cx="24" cy="25" r="1.8" fill="currentColor" stroke="none"/>
              <circle class="calc-btn b3" cx="31" cy="25" r="1.8" fill="currentColor" stroke="none"/>
              <circle class="calc-btn b4" cx="17" cy="33" r="1.8" fill="currentColor" stroke="none"/>
              <circle class="calc-btn b5" cx="24" cy="33" r="1.8" fill="#FF6A00" stroke="none"/>
              <circle class="calc-btn b6" cx="31" cy="33" r="1.8" fill="currentColor" stroke="none"/>
            </svg>
          </div>
          <div class="card-text"><div class="title">Считалочка</div></div>
        </div>
        <div class="arrow">›</div>
      </div>

      <!-- 6. ТАБЛИЦА УМНОЖЕНИЯ -->
      <div class="card card-6" onclick="openTrainer('tablitsa.html')">
        <div class="left">
          <div class="icon-wrap">
            <svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round">
              <path class="x-line" d="M12 12 L36 36"/>
              <path class="x-line" d="M36 12 L12 36"/>
            </svg>
          </div>
          <div class="card-text"><div class="title">Таблица умножения</div></div>
        </div>
        <div class="arrow">›</div>
      </div>

      <!-- 7. ТОЧКИ -->
      <div class="card card-7" onclick="openTrainer('tochki.html')">
        <div class="left">
          <div class="icon-wrap">
            <svg viewBox="0 0 48 48" fill="none">
              <circle class="dot d1" cx="14" cy="14" r="3.6" fill="currentColor"/>
              <circle class="dot d2" cx="34" cy="14" r="3.6" fill="currentColor"/>
              <circle class="dot d3" cx="14" cy="34" r="3.6" fill="currentColor"/>
              <circle class="dot d4" cx="34" cy="34" r="3.6" fill="currentColor"/>
              <circle class="dot d5" cx="24" cy="24" r="3.6" fill="#FF6A00"/>
            </svg>
          </div>
          <div class="card-text"><div class="title">Точки</div></div>
        </div>
        <div class="arrow">›</div>
      </div>

    </div>
  </div>

  <!-- Общие скрипты: layout → seasons → app -->
  <script src="../shared/layout.js" defer></script>
  <script src="../shared/seasons.js" defer></script>
  <script src="../shared/storage.js" defer></script>
<script src="../shared/app.js" defer></script>

  <!-- Уникальное для «Скоросчёт» -->
  <script defer>
    (function () {
      'use strict';

      function applyHeader() {
        const h1 = document.querySelector('header h1');
        if (h1) h1.textContent = 'Скоросчёт';

        const subtitle = document.getElementById('headerSubtitle');
        if (subtitle) subtitle.textContent = 'NeuroX · 7 тренажёров';
      }

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', applyHeader);
      } else {
        applyHeader();
      }

      // Клик по логотипу — назад в главное меню
      document.addEventListener('click', function (e) {
        const logo = e.target.closest && e.target.closest('#logoBtn');
        if (!logo) return;
        e.preventDefault();
        e.stopImmediatePropagation();
        location.href = '../index.html';
      }, true);

      // Открытие тренажёра
      window.openTrainer = function (path) {
        location.href = path;
      };

      // Синхронизация иконки темы в шапке
      const SVG_SUN  = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
      const SVG_MOON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>';

      function syncThemeIcon() {
        const btn = document.getElementById('themeBtn');
        if (!btn) return;
        const theme = document.documentElement.getAttribute('data-theme');
        btn.innerHTML = theme === 'dark' ? SVG_SUN : SVG_MOON;
      }

      new MutationObserver(syncThemeIcon).observe(document.documentElement, {
        attributes: true,
        attributeFilter: ['data-theme']
      });
      syncThemeIcon();
    })();
  </script>

</body>

</html>
