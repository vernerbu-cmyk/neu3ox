name: Build NeuroX Radar APK
on:
  push:
    branches:
      - build/radar-android-7-1
    paths:
      - 'radar-android/**'
      - '.github/workflows/radar-android-apk.yml'
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android SDK
        run: |
          SDK_MANAGER="$(find /usr/local/lib/android/sdk/cmdline-tools -type f -name sdkmanager | head -n 1)"
          "$SDK_MANAGER" --sdk_root=/usr/local/lib/android/sdk 'platforms;android-35' 'build-tools;35.0.0'
      - name: Build APK
        working-directory: radar-android
        run: gradle --no-daemon :app:assembleRelease
      - name: Gather offline signing utility
        run: |
          SIGNER="$(find /usr/local/lib/android/sdk/build-tools -path '*/lib/apksigner.jar' | sort -V | tail -n 1)"
          test -s "$SIGNER"
          cp "$SIGNER" radar-android/apksigner.jar
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NeuroX-Radar-Unsigned-7.1.7-and-Signer
          path: |
            radar-android/app/build/outputs/apk/release/app-release-unsigned.apk
            radar-android/apksigner.jar
          if-no-files-found: error
          retention-days: 30
