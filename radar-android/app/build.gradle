plugins {
    id 'com.android.application'
}
android {
    namespace 'ru.neurox.radar'
    compileSdk 35
    defaultConfig {
        applicationId 'ru.neurox.radar'
        minSdk 23
        targetSdk 35
        versionCode 3
        versionName '7.1.2'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildTypes {
        release {
            minifyEnabled false
        }
    }
}
